<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>六边形扩展</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:linear-gradient(140deg,#ff6f00,#ffca28);overflow:hidden;display:grid;grid-template:repeat(3,1fr)/repeat(6,1fr)}
.hex{clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);background:#263238;display:grid;place-items:center;opacity:0;animation:hx 3.8s cubic-bezier(.2,.8,.3,1) infinite;margin:-1vh}
.hex b{color:#ffca28;font-size:3vh;font-family:monospace}
@keyframes hx{0%,14%{opacity:0;transform:scale(.1)}34%,86%{opacity:1;transform:scale(1.08)}100%{opacity:0;transform:scale(1.08)}}
</style></head>
<body><div id="stage"><span class="hex" style="animation-delay:0.0s"><b>01</b></span><span class="hex" style="animation-delay:0.09s"><b>02</b></span><span class="hex" style="animation-delay:0.18s"><b>03</b></span><span class="hex" style="animation-delay:0.27s"><b>04</b></span><span class="hex" style="animation-delay:0.36s"><b>05</b></span><span class="hex" style="animation-delay:0.44999999999999996s"><b>06</b></span><span class="hex" style="animation-delay:0.54s"><b>07</b></span><span class="hex" style="animation-delay:0.63s"><b>08</b></span><span class="hex" style="animation-delay:0.72s"><b>09</b></span><span class="hex" style="animation-delay:0.8099999999999999s"><b>01</b></span><span class="hex" style="animation-delay:0.8999999999999999s"><b>02</b></span><span class="hex" style="animation-delay:0.99s"><b>03</b></span><span class="hex" style="animation-delay:1.08s"><b>04</b></span><span class="hex" style="animation-delay:1.17s"><b>05</b></span><span class="hex" style="animation-delay:0.06000000000000005s"><b>06</b></span><span class="hex" style="animation-delay:0.1499999999999999s"><b>07</b></span><span class="hex" style="animation-delay:0.24s"><b>08</b></span><span class="hex" style="animation-delay:0.33000000000000007s"><b>09</b></span></div></body></html>
