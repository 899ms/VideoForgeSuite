<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>油漆滚筒</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#e9e4da;display:grid;place-items:center;overflow:hidden}
.pt{position:absolute;inset:0;background:#ff6d3b;transform:scaleY(0);transform-origin:top;animation:pt 4s steps(1) infinite}
.rl{position:absolute;left:50%;top:0;width:34vh;height:9vh;background:linear-gradient(#ffd54f,#ffb300);border-radius:4.5vh;transform:translate(-50%,0);animation:rl 4s steps(30) infinite;box-shadow:0 .8vh 2vh #0005}
.rl:after{content:"";position:absolute;left:50%;bottom:-16vh;width:1.4vh;height:16vh;background:#5d4037}
@keyframes pt{0%,8%{transform:scaleY(0)}55%,86%{transform:scaleY(1)}87%,100%{opacity:0}}
@keyframes rl{0%,8%{top:-10vh}55%{top:88%}86%,100%{top:110%}}
</style></head>
<body><div id="stage"><div class="pt"></div><div class="rl"></div></div></body></html>
