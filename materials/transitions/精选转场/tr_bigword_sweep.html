<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>大字横扫</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#fff;display:grid;place-items:center;overflow:hidden}
.wd{position:absolute;font-size:34vh;font-weight:900;color:#111;white-space:nowrap;animation:wv 3s cubic-bezier(.8,0,.2,1) infinite;transform:translateX(-120vw)}
.wd.w2{color:#ff1744;animation-delay:1.5s}
@keyframes wv{0%{transform:translateX(-120vw)}45%,60%{transform:translateX(0)}100%{transform:translateX(120vw)}}
</style></head>
<body><div id="stage"><div class="wd">GO GO GO</div><div class="wd w2">冲冲冲</div></div></body></html>
