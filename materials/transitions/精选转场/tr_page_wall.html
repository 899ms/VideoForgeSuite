<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>3D翻页墙</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#0e1220;display:grid;place-items:center;perspective:120vh;overflow:hidden}
.wl{position:absolute;inset:6%;display:grid;grid-template:repeat(3,1fr)/repeat(4,1fr);grid-gap:1vh;transform-style:preserve-3d}
.wl i{background:linear-gradient(135deg,#2f3b5c,#1a2238);transform-origin:left;animation:pw 4.4s cubic-bezier(.7,0,.3,1) infinite;backface-visibility:hidden}
.wl i:nth-child(odd){background:linear-gradient(135deg,#3a4975,#232d4d)}
@keyframes pw{0%,12%{transform:rotateY(0)}70%,88%{transform:rotateY(-100deg)}100%{transform:rotateY(0)}}
</style></head>
<body><div id="stage"><div class="wl"><i style="animation-delay:0.0s"></i><i style="animation-delay:0.12s"></i><i style="animation-delay:0.24s"></i><i style="animation-delay:0.36s"></i><i style="animation-delay:0.48s"></i><i style="animation-delay:0.6s"></i><i style="animation-delay:0.72s"></i><i style="animation-delay:0.84s"></i><i style="animation-delay:0.96s"></i><i style="animation-delay:1.08s"></i><i style="animation-delay:1.2s"></i><i style="animation-delay:1.3199999999999998s"></i></div></div></body></html>
