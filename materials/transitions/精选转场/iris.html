<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>光圈开合</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
.bg{position:fixed;inset:0;background:radial-gradient(70% 70% at 50% 45%,#FF5C8Acc 0%,transparent 72%),radial-gradient(55% 55% at 18% 82%,#7C6CF5aa 0%,transparent 70%),radial-gradient(55% 55% at 82% 18%,#29D3E6aa 0%,transparent 70%),linear-gradient(135deg,#2b2542,#171428);animation:hue 22s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}canvas{width:100%;height:100%;display:block}
.txt{color:#fff;font-weight:900;text-align:center}
</style></head>
<body><div class="bg"></div><div id="stage"><canvas id="cv"></canvas></div>
<script>var cv=document.getElementById('cv'),x=cv.getContext('2d');
function rs(){cv.width=innerWidth;cv.height=innerHeight;}rs();addEventListener('resize',rs);var t=0,dir=1;(function loop(){requestAnimationFrame(loop);t+=0.02*dir;if(t>1){t=1;dir=-1}if(t<0){t=0;dir=1;}x.fillStyle='#0e0c16';x.fillRect(0,0,cv.width,cv.height);var R=Math.min(cv.width,cv.height)*0.5*(1-t);x.save();x.beginPath();x.arc(cv.width/2,cv.height/2,R,0,7);x.clip();var g=x.createRadialGradient(cv.width/2,cv.height/2,0,cv.width/2,cv.height/2,Math.max(cv.width,cv.height)*0.5);g.addColorStop(0,'#FF5C8A');g.addColorStop(1,'#7C6CF5');x.fillStyle=g;x.fillRect(0,0,cv.width,cv.height);x.restore();})();</script></body></html>
