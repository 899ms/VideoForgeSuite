<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>墨水扩散</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#f7f4ec;display:grid;place-items:center;overflow:hidden}
.ink{position:absolute;left:50%;top:50%;width:18vh;height:18vh;border-radius:46% 54% 52% 48%/55% 46% 54% 45%;background:#14181f;transform:translate(-50%,-50%) scale(0);animation:ik 4s cubic-bezier(.4,0,.6,1) infinite}
.ink.k2{animation-delay:.12s;background:#1c2230}
.ink.k3{animation-delay:.24s;background:#0b0e14}
.wo{position:absolute;color:#fff;font-size:9vh;font-weight:900;letter-spacing:.3em;opacity:0;animation:wo 4s steps(1) infinite}
@keyframes ik{0%,12%{transform:translate(-50%,-50%) scale(0)}55%,82%{transform:translate(-50%,-50%) scale(26)}83%,100%{opacity:0;transform:translate(-50%,-50%) scale(26)}}
@keyframes wo{0%,40%{opacity:0}52%,80%{opacity:1}81%,100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="ink"></div><div class="ink k2"></div><div class="ink k3"></div><div class="wo">壹</div></div></body></html>
