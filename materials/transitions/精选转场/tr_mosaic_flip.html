<!doctype html><html lang=zh><head><meta charset=utf-8>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:'Segoe UI',system-ui,sans-serif}
.g{position:absolute;inset:0;display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(5,1fr)}
.c{position:relative;transform-style:preserve-3d;animation:flip .7s ease forwards;transform:rotateX(-90deg);opacity:0}
.c.a{background:linear-gradient(135deg,#0ea5e9,#6366f1)}
.c.b{background:linear-gradient(135deg,#f97316,#ec4899);animation-delay:var(--d)}
@keyframes flip{60%{transform:rotateX(20deg);opacity:1}100%{transform:none;opacity:1}}
.lt{position:absolute;z-index:5;font-size:15px;color:#fff;letter-spacing:5px;bottom:10%;left:50%;transform:translateX(-50%);opacity:0;animation:lt .5s ease 2.3s forwards}
@keyframes lt{to{opacity:1}}</style></head><body>
<div class=g id=g></div><div class=lt>MOSAIC FLIP 马赛克翻转转场</div>
<script>
var g=document.getElementById('g');
for(var r=0;r<5;r++)for(var c=0;c<9;c++){var d=document.createElement('div');
d.className='c a';d.style.setProperty('--d',(r*0.07+c*0.055+0.15)+'s');
g.appendChild(d);}
setTimeout(function(){document.querySelectorAll('.c').forEach(function(el,i){
el.style.animation='none';void el.offsetWidth;el.classList.remove('a');el.classList.add('b');el.style.animation='flip .7s ease forwards';el.style.animationDelay=el.style.getPropertyValue('--d');});},1100);
setTimeout(function(){var a=document.querySelectorAll('*');for(var i=0;i<a.length;i++){try{a[i].style.animationPlayState='paused'}catch(e){}}},2400);</script></body></html>
