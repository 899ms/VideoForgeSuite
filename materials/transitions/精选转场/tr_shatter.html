<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>玻璃碎裂</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#0b1020;display:grid;place-items:center;overflow:hidden}
.g{position:absolute;inset:0;display:grid;grid-template:repeat(5,1fr)/repeat(5,1fr)}
.g i{background:linear-gradient(135deg,#38bdf8,#0f172a 70%);animation:sh 4s ease-in infinite;opacity:0}
.g i:nth-child(2n){background:linear-gradient(225deg,#22d3ee,#1e293b 70%)}
@keyframes sh{0%{opacity:1;transform:none;filter:none}18%{opacity:1}30%{opacity:1;transform:translate(calc(var(--dx)*1vh),calc(var(--dy)*1vh)) rotate(calc(var(--r)*1deg))}70%,100%{opacity:0;transform:translate(calc(var(--dx)*14vh),calc(var(--dy)*14vh + 30vh)) rotate(calc(var(--r)*7deg))}}
.crack{position:absolute;left:50%;top:50%;width:120vw;height:120vw;transform:translate(-50%,-50%);background:radial-gradient(circle,#fff0 4%,#ffffff88 4.4%,#fff0 5%);opacity:0;animation:ck 4s steps(1) infinite}
@keyframes ck{0%,10%{opacity:0}14%{opacity:1}18%,100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="g"><i style="--dx:-3;--dy:-3;--r:-20;animation-delay:0ms"></i><i style="--dx:-1;--dy:-3;--r:-7;animation-delay:30ms"></i><i style="--dx:1;--dy:-3;--r:6;animation-delay:60ms"></i><i style="--dx:3;--dy:-3;--r:19;animation-delay:90ms"></i><i style="--dx:5;--dy:-3;--r:-8;animation-delay:120ms"></i><i style="--dx:-3;--dy:-1;--r:5;animation-delay:150ms"></i><i style="--dx:-1;--dy:-1;--r:18;animation-delay:180ms"></i><i style="--dx:1;--dy:-1;--r:-9;animation-delay:0ms"></i><i style="--dx:3;--dy:-1;--r:4;animation-delay:30ms"></i><i style="--dx:5;--dy:-1;--r:17;animation-delay:60ms"></i><i style="--dx:-3;--dy:1;--r:-10;animation-delay:90ms"></i><i style="--dx:-1;--dy:1;--r:3;animation-delay:120ms"></i><i style="--dx:1;--dy:1;--r:16;animation-delay:150ms"></i><i style="--dx:3;--dy:1;--r:-11;animation-delay:180ms"></i><i style="--dx:5;--dy:1;--r:2;animation-delay:0ms"></i><i style="--dx:-3;--dy:3;--r:15;animation-delay:30ms"></i><i style="--dx:-1;--dy:3;--r:-12;animation-delay:60ms"></i><i style="--dx:1;--dy:3;--r:1;animation-delay:90ms"></i><i style="--dx:3;--dy:3;--r:14;animation-delay:120ms"></i><i style="--dx:5;--dy:3;--r:-13;animation-delay:150ms"></i><i style="--dx:-3;--dy:5;--r:0;animation-delay:180ms"></i><i style="--dx:-1;--dy:5;--r:13;animation-delay:0ms"></i><i style="--dx:1;--dy:5;--r:-14;animation-delay:30ms"></i><i style="--dx:3;--dy:5;--r:-1;animation-delay:60ms"></i><i style="--dx:5;--dy:5;--r:12;animation-delay:90ms"></i></div><div class="crack"></div></div></body></html>
