<!doctype html><html lang=zh><head><meta charset=utf-8>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#111;font-family:'Segoe UI',system-ui,sans-serif}
.pg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:900;letter-spacing:6px}
.a{background:linear-gradient(135deg,#f8fafc,#e2e8f0);color:#334155;z-index:1}
.b{background:linear-gradient(135deg,#fbbf24,#f97316);color:#7c2d12;z-index:2;clip-path:polygon(100% 100%,100% 100%,100% 100%);animation:curl 1.9s cubic-bezier(.6,.05,.3,1) .5s forwards}
@keyframes curl{0%{clip-path:polygon(100% 100%,100% 100%,100% 100%)}
55%{clip-path:polygon(100% 100%,100% -30%,-30% 100%)}
100%{clip-path:polygon(100% 100%,100% -120%,-120% 100%)}}
.sh{position:absolute;inset:0;z-index:3;background:radial-gradient(circle at 100% 100%,rgba(0,0,0,.5),transparent 42%);opacity:0;animation:sh 1.9s ease .5s forwards}
@keyframes sh{35%{opacity:1}100%{opacity:0}}
.lt{position:absolute;z-index:4;font-size:15px;color:#7c2d12;letter-spacing:5px;bottom:11%;left:50%;transform:translateX(-50%);opacity:0;animation:lt .5s ease 2.3s forwards}
@keyframes lt{to{opacity:1}}</style></head><body>
<div class="pg a">PAGE CURL</div><div class="pg b">翻页 →</div><div class=sh></div>
<div class=lt>PAGE CURL 翻页转场</div>
<script>setTimeout(function(){try{document.getAnimations().forEach(function(x){x.pause()})}catch(e){}},2400);</script></body></html>
