<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>折屏收拢</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:linear-gradient(140deg,#00695c,#4db6ac);overflow:hidden;display:flex}
.pn{flex:1;background:linear-gradient(140deg,#eceff1,#b0bec5);transform-origin:left;animation:fd 3.6s cubic-bezier(.7,0,.3,1) infinite;border-right:1px solid #90a4a466}
.pn:nth-child(2){animation-delay:.08s}.pn:nth-child(3){animation-delay:.16s}.pn:nth-child(4){animation-delay:.24s}.pn:nth-child(5){animation-delay:.32s}.pn:nth-child(6){animation-delay:.4s}
@keyframes fd{0%,22%{transform:perspective(120vh) rotateY(0)}58%,88%{transform:perspective(120vh) rotateY(-88deg)}100%{transform:perspective(120vh) rotateY(-88deg);opacity:0}}
</style></head>
<body><div id="stage"><div class="pn"></div><div class="pn"></div><div class="pn"></div><div class="pn"></div><div class="pn"></div><div class="pn"></div></div></body></html>
