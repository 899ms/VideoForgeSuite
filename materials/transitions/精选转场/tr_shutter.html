<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>相机快门</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#1a1a1a;display:grid;place-items:center;overflow:hidden}
.bl{position:absolute;inset:0;background:linear-gradient(135deg,#37474f,#78909c)}
.bl{clip-path:polygon(50% 50%,0 0,50% 0);animation:bl 3.2s steps(1) infinite}
.b2{clip-path:polygon(50% 50%,50% 0,100% 0);animation-delay:.04s}
.b3{clip-path:polygon(50% 50%,100% 0,100% 50%);animation-delay:.08s}
.b4{clip-path:polygon(50% 50%,100% 50%,100% 100%);animation-delay:.12s}
.b5{clip-path:polygon(50% 50%,100% 100%,50% 100%);animation-delay:.16s}
.b6{clip-path:polygon(50% 50%,50% 100%,0 100%);animation-delay:.2s}
.b7{clip-path:polygon(50% 50%,0 100%,0 50%);animation-delay:.24s}
.b8{clip-path:polygon(50% 50%,0 50%,0 0);animation-delay:.28s}
.bl{animation-name:sh}
@keyframes sh{0%,30%{transform:scale(1)}45%,68%{transform:scale(0);transform-origin:50% 50%}80%,100%{transform:scale(1)}}
.fd{position:absolute;inset:0;background:#fff;opacity:0;animation:fd 3.2s steps(1) infinite}
@keyframes fd{0%,38%{opacity:0}42%{opacity:1}46%,100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="bl b1"></div><div class="bl b2"></div><div class="bl b3"></div><div class="bl b4"></div><div class="bl b5"></div><div class="bl b6"></div><div class="bl b7"></div><div class="bl b8"></div><div class="fd"></div></div></body></html>
