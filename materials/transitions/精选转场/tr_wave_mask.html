<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>波浪遮罩转场</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:linear-gradient(140deg,#e91e63,#ff80ab);overflow:hidden}
.wv{position:absolute;inset:-2%;background:linear-gradient(140deg,#00695c,#4db6ac);mask:radial-gradient(circle 30vh at 50% 50%,#000 98%,transparent);-webkit-mask:radial-gradient(circle 30vh at 50% 50%,#000 98%,transparent);animation:wv 4s ease-in-out infinite;display:grid;place-items:center;color:#fff;font-size:6vh;font-weight:900}
.wv:after{content:"";position:absolute;left:-60%;right:-60%;bottom:-18vh;height:36vh;background:radial-gradient(ellipse at center,#00695c 58%,transparent 62%);animation:sv 4s ease-in-out infinite}
@keyframes wv{0%,20%{mask-size:0% 0%;-webkit-mask-size:0% 0%}55%,86%{mask-size:280% 280%;-webkit-mask-size:280% 280%}100%{mask-size:280% 280%;opacity:0}}
@keyframes sv{0%,20%{transform:translateY(40vh)}55%,100%{transform:translateY(0)}}
</style></head>
<body><div id="stage"><div class="wv">SCENE B</div></div></body></html>
