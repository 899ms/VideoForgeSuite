<!doctype html><html lang=zh><head><meta charset=utf-8>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:'Segoe UI',system-ui,sans-serif}
.sc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:58px;font-weight:900;letter-spacing:6px}
.a{background:linear-gradient(135deg,#1e293b,#0f172a);color:#e2e8f0}
.b{background:linear-gradient(135deg,#7c3aed,#db2777);color:#fff;z-index:2;clip-path:inset(0 0 0 100%);animation:slide 1.6s cubic-bezier(.85,0,.15,1) 0.4s forwards}
@keyframes slide{40%{clip-path:inset(0 0 0 12%)}100%{clip-path:inset(0 0 0 0)}}
.gl{position:absolute;inset:0;z-index:3;background:repeating-linear-gradient(0deg,rgba(255,255,255,.06) 0 2px,transparent 2px 5px);opacity:0;animation:gl .18s steps(3) 1.55s}
@keyframes gl{0%{opacity:1;transform:translateX(-8px)}100%{opacity:0}}
.lt{position:absolute;z-index:4;font-size:15px;color:#fff;letter-spacing:5px;bottom:12%;left:50%;transform:translateX(-50%);opacity:0;animation:lt .5s ease 2s forwards}
@keyframes lt{to{opacity:1}}</style></head><body>
<div class="sc a">SCENE A</div><div class="sc b">SCENE B</div><div class=gl></div>
<div class=lt>GLITCH SLIDE 转场</div>
<script>setTimeout(function(){try{document.getAnimations().forEach(function(x){x.pause()})}catch(e){}},2500);</script></body></html>
