<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>推挤换幕</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;overflow:hidden;display:grid;grid-template:1fr 1fr/1fr 1fr}
.s{position:absolute;inset:0;background:linear-gradient(135deg,#263238,#37474f)}
.s:after{content:"A";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:16vh;color:#80cbc4;font-weight:900}
.q{background:linear-gradient(135deg,#bf360c,#e64a19);position:relative;overflow:hidden}
.q:after{content:"B";position:absolute;font-size:16vh;color:#ffccbc;font-weight:900}
.q.q1:after{left:50%;top:150%}.q.q2:after{left:-50%;top:50%}.q.q3:after{left:150%;top:50%}.q.q4:after{left:50%;top:-50%}
.s{animation:sw 3.4s steps(1) infinite}
@keyframes sw{0%,18%{opacity:1}30%{opacity:0}88%,100%{opacity:1}}
.q{animation:qg 3.4s steps(1) infinite;opacity:0}
.q.q1{animation-name:q1}.q.q2{animation-name:q2}.q.q3{animation-name:q3}.q.q4{animation-name:q4}
@keyframes q1{0%,28%{clip-path:inset(0 0 100% 0);opacity:1}32%,88%{clip-path:inset(0);opacity:1}100%{opacity:0}}
@keyframes q2{0%,28%{clip-path:inset(0 100% 0 0);opacity:1}32%,88%{clip-path:inset(0);opacity:1}100%{opacity:0}}
@keyframes q3{0%,28%{clip-path:inset(0 0 0 100%);opacity:1}32%,88%{clip-path:inset(0);opacity:1}100%{opacity:0}}
@keyframes q4{0%,28%{clip-path:inset(100% 0 0 0);opacity:1}32%,88%{clip-path:inset(0);opacity:1}100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="s"></div><div class="q q1"></div><div class="q q2"></div><div class="q q3"></div><div class="q q4"></div></div></body></html>
