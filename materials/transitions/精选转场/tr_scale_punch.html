<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>缩放冲击</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#000;display:grid;place-items:center;overflow:hidden}
.z{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,#7c4dff,#1a0533);animation:zm 3.2s cubic-bezier(.2,.8,.2,1) infinite}
.z.z2{background:radial-gradient(circle at 50% 50%,#ff9100,#3e2200);animation-delay:1.6s}
.t{position:absolute;color:#fff;font-size:9vh;font-weight:900;letter-spacing:.2em;opacity:0;animation:tt 3.2s steps(1) infinite}
@keyframes zm{0%{transform:scale(6);filter:blur(6vh);opacity:0}18%{opacity:1}45%{transform:scale(1);filter:blur(0)}100%{transform:scale(.2);opacity:0}}
@keyframes tt{0%,38%{opacity:0}48%,72%{opacity:1}80%,100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="z"></div><div class="z z2"></div><div class="t">IMPACT</div></div></body></html>
