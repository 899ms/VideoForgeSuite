<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>聚光灯揭示</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#050505;display:grid;place-items:center;overflow:hidden}
.bg{position:absolute;inset:0;background:linear-gradient(120deg,#1b3a4b,#0d1f2d);display:grid;place-items:center;color:#e0f7fa;font-size:7vh;font-weight:800;letter-spacing:.3em;clip-path:circle(0 at 50% 50%);animation:sp 4.4s steps(30) infinite}
.sp2{position:absolute;left:50%;top:50%;width:6vh;height:6vh;border-radius:50%;background:#fff;box-shadow:0 0 8vh 3vh #ffffffcc;transform:translate(-50%,-50%);animation:mv 4.4s steps(20) infinite;mix-blend-mode:screen}
@keyframes sp{0%,14%{clip-path:circle(0 at 50% 50%)}60%,82%{clip-path:circle(75% at 50% 50%)}88%,100%{clip-path:circle(0 at 50% 50%)}}
@keyframes mv{0%{opacity:1}45%{opacity:0}100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="bg">REVEAL</div><div class="sp2"></div></div></body></html>
