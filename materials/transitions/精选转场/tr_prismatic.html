<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>棱镜色散转场</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#05070d;display:flex;align-items:center;justify-content:center}
.ly{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9vh;font-weight:900;letter-spacing:.2em;mix-blend-mode:screen}
.r{color:#ff0040;animation:pr 3.6s cubic-bezier(.7,0,.3,1) infinite}
.g{color:#00ff88;animation:pr 3.6s cubic-bezier(.7,0,.3,1) infinite;animation-delay:.06s}
.b{color:#2080ff;animation:pr 3.6s cubic-bezier(.7,0,.3,1) infinite;animation-delay:.12s}
@keyframes pr{0%,100%{transform:translateX(0);opacity:.9}45%{transform:translateX(-11vw) skewX(-7deg);opacity:1}55%{transform:translateX(9vw) skewX(5deg);opacity:1}62%{transform:translateX(0);opacity:.9}}
.scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 4px,#ffffff08 4px 5px);pointer-events:none}
</style></head>
<body><div id="stage"><div class="ly r">PRISM</div><div class="ly g">PRISM</div><div class="ly b">PRISM</div><div class="scan"></div></div></body></html>
