<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>光幕扫过</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#131722;display:grid;place-items:center;overflow:hidden}
.sc{position:absolute;inset:-20% -60%;background:linear-gradient(100deg,#0000 30%,#7ee8fa55 46%,#eec0ff66 50%,#7ee8fa55 54%,#0000 70%);transform:translateX(-70%) skewX(-12deg);animation:sw 3.6s cubic-bezier(.6,0,.4,1) infinite;filter:blur(1vh)}
.wt{position:absolute;color:#fff;font-size:8vh;font-weight:800;letter-spacing:.3em;background:linear-gradient(90deg,#fff,#9be7ff,#fff);-webkit-background-clip:text;color:transparent;background-size:200% 100%;animation:sh 3.6s ease-in-out infinite;opacity:0}
@keyframes sw{0%{transform:translateX(-70%) skewX(-12deg)}48%,60%{transform:translateX(70%) skewX(-12deg)}100%{transform:translateX(70%) skewX(-12deg)}}
@keyframes sh{0%{opacity:0;background-position:200% 0}40%,74%{opacity:1;background-position:0 0}100%{opacity:0;background-position:-200% 0}}
</style></head>
<body><div id="stage"><div class="sc"></div><div class="wt">SHINE</div></div></body></html>
