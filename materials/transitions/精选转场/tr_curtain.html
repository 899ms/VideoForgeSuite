<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>幕布转场</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0}
.p{position:absolute;left:0;width:100%;height:50%;background:linear-gradient(180deg,#0ea5e9,#6366f1)}
.t{top:0;transform-origin:top;animation:op 4s cubic-bezier(.7,0,.3,1) infinite}
.b{bottom:0;transform-origin:bottom;animation:op 4s cubic-bezier(.7,0,.3,1) infinite}
.p:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,#ffffff10 0 2vh,transparent 2vh 6vh)}
.wd{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:9vh;font-weight:900;color:#fff;opacity:0;animation:tx 4s ease infinite;letter-spacing:.2em}
@keyframes op{0%,12%{transform:scaleY(1)}30%,62%{transform:scaleY(0)}80%,100%{transform:scaleY(1)}}
@keyframes tx{0%,18%{opacity:0;transform:scale(.8)}30%,60%{opacity:1;transform:scale(1)}74%,100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="p t"></div><div class="p b"></div><div class="wd">SCENE 02</div></div></body></html>
