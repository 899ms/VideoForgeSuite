<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>像素排序溶解</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#101828;overflow:hidden}
.im{position:absolute;inset:0;display:grid;grid-template-rows:repeat(14,1fr)}
.im div{background:linear-gradient(90deg,#0ea5e9,#8b5cf6);animation:ps 4s steps(26) infinite;transform:scaleX(0);transform-origin:left}
.im div:nth-child(even){background:linear-gradient(90deg,#f59e0b,#ef4444);animation-delay:.35s}
.t2{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:8vh;font-weight:900;letter-spacing:.2em;opacity:0;animation:tt 4s steps(1) infinite}
@keyframes ps{0%{transform:scaleX(0) translateX(-6%)}30%,55%{transform:scaleX(1) translateX(0)}80%,100%{transform:scaleX(0) translateX(6%);transform-origin:right}}
@keyframes tt{0%,28%{opacity:0}40%,70%{opacity:1}78%,100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="im"><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div><div class="t2">NEXT</div></div></body></html>
