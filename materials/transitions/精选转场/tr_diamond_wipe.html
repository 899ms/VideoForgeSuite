<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>菱形擦除</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;grid-template-columns:repeat(10,10%);grid-template-rows:repeat(6,16.66%);background:#0a0f1c}
#stage i{background:linear-gradient(135deg,#0ea5e9,#7c3aed);clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);transform:scale(0);animation:dw 3.6s cubic-bezier(.7,0,.3,1) infinite;animation-delay:calc((var(--r) + var(--c))*.06s)}
@keyframes dw{0%{transform:scale(0)}14%,56%{transform:scale(1.1)}70%,100%{transform:scale(0)}}
</style></head>
<body><div id="stage"><i style="--r:0;--c:0"></i><i style="--r:0;--c:1"></i><i style="--r:0;--c:2"></i><i style="--r:0;--c:3"></i><i style="--r:0;--c:4"></i><i style="--r:0;--c:5"></i><i style="--r:0;--c:6"></i><i style="--r:0;--c:7"></i><i style="--r:0;--c:8"></i><i style="--r:0;--c:9"></i><i style="--r:1;--c:0"></i><i style="--r:1;--c:1"></i><i style="--r:1;--c:2"></i><i style="--r:1;--c:3"></i><i style="--r:1;--c:4"></i><i style="--r:1;--c:5"></i><i style="--r:1;--c:6"></i><i style="--r:1;--c:7"></i><i style="--r:1;--c:8"></i><i style="--r:1;--c:9"></i><i style="--r:2;--c:0"></i><i style="--r:2;--c:1"></i><i style="--r:2;--c:2"></i><i style="--r:2;--c:3"></i><i style="--r:2;--c:4"></i><i style="--r:2;--c:5"></i><i style="--r:2;--c:6"></i><i style="--r:2;--c:7"></i><i style="--r:2;--c:8"></i><i style="--r:2;--c:9"></i><i style="--r:3;--c:0"></i><i style="--r:3;--c:1"></i><i style="--r:3;--c:2"></i><i style="--r:3;--c:3"></i><i style="--r:3;--c:4"></i><i style="--r:3;--c:5"></i><i style="--r:3;--c:6"></i><i style="--r:3;--c:7"></i><i style="--r:3;--c:8"></i><i style="--r:3;--c:9"></i><i style="--r:4;--c:0"></i><i style="--r:4;--c:1"></i><i style="--r:4;--c:2"></i><i style="--r:4;--c:3"></i><i style="--r:4;--c:4"></i><i style="--r:4;--c:5"></i><i style="--r:4;--c:6"></i><i style="--r:4;--c:7"></i><i style="--r:4;--c:8"></i><i style="--r:4;--c:9"></i><i style="--r:5;--c:0"></i><i style="--r:5;--c:1"></i><i style="--r:5;--c:2"></i><i style="--r:5;--c:3"></i><i style="--r:5;--c:4"></i><i style="--r:5;--c:5"></i><i style="--r:5;--c:6"></i><i style="--r:5;--c:7"></i><i style="--r:5;--c:8"></i><i style="--r:5;--c:9"></i></div></body></html>
