<!doctype html><html lang=zh><head><meta charset=utf-8>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:'Segoe UI',system-ui,sans-serif}
.sc{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:900;letter-spacing:6px}
.a{background:linear-gradient(135deg,#334155,#0f172a);color:#94a3b8;z-index:1}
.bwrap{position:absolute;inset:0;z-index:2;display:grid;grid-template-columns:repeat(10,1fr)}
.bl{background:linear-gradient(135deg,#22d3ee,#0ea5e9);display:flex;align-items:center;justify-content:center;color:#fff;font-size:40px;font-weight:900;letter-spacing:4px;transform:scaleY(0);animation:bl 1.4s cubic-bezier(.65,0,.35,1) forwards}
@keyframes bl{55%{transform:scaleY(1.03)}100%{transform:scaleY(1)}}
.lt{position:absolute;z-index:4;font-size:15px;color:#fff;letter-spacing:5px;bottom:11%;left:50%;transform:translateX(-50%);opacity:0;animation:lt .5s ease 2.1s forwards}
@keyframes lt{to{opacity:1}}</style></head><body>
<div class="sc a">BLINDS</div>
<div class=bwrap id=w></div>
<div class=lt>BLINDS 百叶窗转场</div>
<script>
var w=document.getElementById('w');
for(var i=0;i<10;i++){var d=document.createElement('div');d.className='bl';d.style.animationDelay=(i*0.06+0.3)+'s';
d.textContent=(i===4)?'百叶窗':'';w.appendChild(d);}
setTimeout(function(){try{document.getAnimations().forEach(function(x){x.pause()})}catch(e){}},2200);</script></body></html>
