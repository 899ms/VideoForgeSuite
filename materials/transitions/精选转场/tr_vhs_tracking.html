<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>VHS磁迹</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#0a0f0a;display:grid;place-items:center;overflow:hidden}
.sx{position:absolute;inset:0;background:linear-gradient(135deg,#1b5e20,#0d3311);display:grid;place-items:center;color:#c8e6c9;font-size:7vh;font-weight:800;letter-spacing:.4em}
.bar{position:absolute;left:0;right:0;height:16vh;background:repeating-linear-gradient(0deg,#fff2 0 1vh,#0000 1vh 2.4vh);filter:blur(.4vh);animation:tr 2.8s steps(20) infinite;top:-20%}
.gl{position:absolute;inset:0;background:linear-gradient(90deg,#0000 46%,#ffffff22 50%,#0000 54%);mix-blend-mode:screen;animation:gg 2.8s steps(4) infinite}
@keyframes tr{0%{top:-20%}55%{top:104%}100%{top:104%}}
@keyframes gg{0%,60%{opacity:0}62%,68%{opacity:1}70%,100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="sx">PLAY ▶</div><div class="bar"></div><div class="gl"></div></div></body></html>
