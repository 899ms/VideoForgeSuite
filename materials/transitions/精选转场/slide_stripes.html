<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>条纹滑入</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
.bg{position:fixed;inset:0;background:radial-gradient(70% 70% at 50% 45%,#7C6CF5cc 0%,transparent 72%),radial-gradient(55% 55% at 18% 82%,#FF5C8Aaa 0%,transparent 70%),radial-gradient(55% 55% at 82% 18%,#43E97Baa 0%,transparent 70%),linear-gradient(135deg,#2b2542,#171428);animation:hue 22s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}canvas{width:100%;height:100%;display:block}
.txt{color:#fff;font-weight:900;text-align:center}
</style></head>
<body><div class="bg"></div><div id="stage"><canvas id="cv"></canvas></div>
<script>var cv=document.getElementById('cv'),x=cv.getContext('2d');
function rs(){cv.width=innerWidth;cv.height=innerHeight;}rs();addEventListener('resize',rs);var t=0;(function loop(){requestAnimationFrame(loop);t=(t+0.01)%1;x.fillStyle='#0e0c16';x.fillRect(0,0,cv.width,cv.height);var n=10,sh=cv.height/n;for(var i=0;i<n;i++){var off=((t+i*0.13)%1)*cv.width;var hue=(i*36)%360;x.fillStyle='hsl('+hue+',80%,60%)';x.fillRect(off-sh,i*sh,sh*1.4,sh);}})();</script></body></html>
