<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}canvas{width:100vw;height:100vh}</style></head><body><canvas id="cv" width="1920" height="1080"></canvas><script>const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),CX=24,CY=14,W=80,H=Math.ceil(1080/14);let grid=[],phase=0;function reset(){grid=Array.from({length:CY},()=>Array(CX).fill(phase%2))}reset();(function f(){if(Math.random()<.35){for(let i=0;i<26;i++)grid[Math.floor(Math.random()*CY)][Math.floor(Math.random()*CX)]=phase%2;if(Math.random()<.02)phase++;}for(let y=0;y<CY;y++)for(let x=0;x<CX;x++){ctx.fillStyle=grid[y][x]?"#7c3aed":"#f472b6";ctx.fillRect(x*W,y*H,W-2,H-2)}requestAnimationFrame(f)})()</script></body></html>
