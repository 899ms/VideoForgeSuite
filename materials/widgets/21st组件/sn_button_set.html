<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#09090b;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}.r{display:flex;gap:2vw;flex-wrap:wrap;justify-content:center;max-width:70vw}.b{padding:2vh 3vw;border-radius:10px;font-size:1.8vw;font-weight:600;border:0;cursor:pointer;animation:pu 3s ease-in-out infinite}.b.p{background:#fff;color:#18181b}.b.s{background:#18181b;color:#fff;border:1px solid #27272a}.b.o{background:transparent;color:#a1a1aa;border:1px solid #3f3f46}.b.d{background:linear-gradient(135deg,#7c3aed,#db2777);color:#fff}.b:nth-child(2){animation-delay:.4s}.b:nth-child(3){animation-delay:.8s}.b:nth-child(4){animation-delay:1.2s}@keyframes pu{50%{transform:translateY(-1vh)}}</style></head><body><div class="r"><button class="b p">Primary</button><button class="b s">Secondary</button><button class="b o">Outline</button><button class="b d">Gradient</button></div><script></script></body></html>
