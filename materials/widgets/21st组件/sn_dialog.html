<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:rgba(9,9,11,.001);display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}body{background:linear-gradient(135deg,#111,#1c1917)}.ov{position:absolute;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}.d{width:44vw;border-radius:18px;background:#18181b;border:1px solid #2a2a2e;padding:4vh 2.8vw;color:#fafafa;animation:po 4s ease-in-out infinite;box-shadow:0 40px 100px rgba(0,0,0,.7)}.d h3{font-size:2.2vw;margin-bottom:1.4vh}.d p{color:#a1a1aa;font-size:1.4vw;line-height:1.6}.d .row{display:flex;gap:1.4vw;justify-content:flex-end;margin-top:3.4vh}.d .btn{padding:1.6vh 2.2vw;border-radius:10px;font-size:1.5vw;font-weight:600;border:0;cursor:pointer}.d .g{background:#27272a;color:#fff}.d .p{background:#fff;color:#18181b}@keyframes po{0%,100%{transform:scale(.92);opacity:.6}20%,80%{transform:scale(1);opacity:1}}</style></head><body><div class="ov"><div class="d"><h3>Delete project?</h3><p>This action cannot be undone. This will permanently delete the project and all of its data.</p><div class="row"><button class="btn g">Cancel</button><button class="btn p">Delete</button></div></div></div><script></script></body></html>
