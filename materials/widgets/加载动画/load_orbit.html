<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>轨道加载</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#0b0f1e;display:grid;place-items:center}
.ob{position:relative;width:34vh;height:34vh}
.core2{position:absolute;left:50%;top:50%;width:8vh;height:8vh;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle at 35% 30%,#7ea8ff,#2c4bcc);box-shadow:0 0 4vh #4c6cf766}
.orb{position:absolute;inset:0;border:.25vh solid #2c3550;border-radius:50%;transform:rotate(xdeg)}
.sat{position:absolute;width:2.4vh;height:2.4vh;border-radius:50%;background:#7ef0ff;box-shadow:0 0 2vh #7ef0ff;top:-1.2vh;left:calc(50% - 1.2vh)}
</style></head>
<body><div id="stage"><div class="ob"><div class="orb" style="inset:8%;transform:rotate(0deg);animation:sp1 2.2s linear infinite"><span class="sat" style="background:#fb7185;box-shadow:0 0 2vh #fb7185"></span></div><div class="orb" style="inset:17%;transform:rotate(60deg);animation:sp2 2.9000000000000004s linear infinite"><span class="sat" style="background:#7ef0ff;box-shadow:0 0 2vh #7ef0ff"></span></div><div class="orb" style="inset:26%;transform:rotate(120deg);animation:sp1 3.6s linear infinite"><span class="sat" style="background:#fb7185;box-shadow:0 0 2vh #fb7185"></span></div><style>@keyframes sp1{to{transform:rotate(360deg)}}@keyframes sp2{to{transform:rotate(-360deg)}}</style><div class="core2"></div></div></div></body></html>
