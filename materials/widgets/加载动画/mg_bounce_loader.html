<!doctype html><html lang=zh><head><meta charset=utf-8>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#fdf6ec;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif}
.wrap{text-align:center}
.ball{width:64px;height:64px;border-radius:50% 50% 46% 54%;background:radial-gradient(circle at 32% 28%,#fca5a5,#ef4444 62%,#b91c1c);margin:0 auto;
animation:jump 1.1s cubic-bezier(.36,0,.64,1) infinite alternate, squash 1.1s cubic-bezier(.36,0,.64,1) infinite alternate}
@keyframes jump{from{transform:translateY(-90px)}to{transform:translateY(26px)}}
@keyframes squash{0%,100%{scale:1 1}90%{scale:1.18 .84}}
.shadow{width:70px;height:14px;border-radius:50%;background:#0002;margin:8px auto 18px;filter:blur(3px);animation:sh 1.1s cubic-bezier(.36,0,.64,1) infinite alternate}
@keyframes sh{from{transform:scaleX(.55);opacity:.35}to{transform:scaleX(1.05);opacity:.7}}
.t{font-size:24px;font-weight:900;color:#44403c;letter-spacing:4px}
</style></head><body><div class=wrap>
<div class=ball></div><div class=shadow></div><div class=t>Lottie 风格 MG 动画</div>
</div></body></html>
