<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>搜索展开</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#0d1220}
.sr{display:flex;align-items:center;gap:2vh;background:#1a2440;border:1px solid #2b3a5e;border-radius:99vh;padding:2.4vh 3.4vh;animation:xp 5s ease-in-out infinite alternate;box-shadow:0 2vh 6vh #0008}
.sr .ic{font-size:3.6vh;color:#7ef0ff}
.sr .tx{color:#8ea0c0;font-size:2.8vh;white-space:nowrap;overflow:hidden;max-width:0;animation:tx 5s ease-in-out infinite alternate}
.sr .cur{width:.4vh;height:3vh;background:#7ef0ff;animation:bl 1s steps(1) infinite}
@keyframes xp{from{padding:2.4vh 3.4vh}to{padding:2.4vh 4.6vh;box-shadow:0 0 0 .5vh #7ef0ff33,0 2vh 6vh #0008}}
@keyframes tx{from{max-width:0;opacity:0}40%,100%{max-width:26vh;opacity:1}}
@keyframes bl{50%{opacity:0}}
</style></head>
<body><div id="stage"><div class="sr"><span class="ic">🔍</span><span class="tx">AI 视频特效素材库</span><span class="cur"></span></div></div></body></html>
