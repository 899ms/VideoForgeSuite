<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>客服对话</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#eceff4;display:grid;place-items:center}
.chat{width:44vw;background:#fff;border-radius:2.4vh;box-shadow:0 2vh 5vh #00000018;padding:3.4vh;display:flex;flex-direction:column;gap:1.8vh}
.ms{max-width:72%;padding:1.8vh 2.6vh;border-radius:1.8vh;font-size:2.9vh;opacity:0;animation:ci 6s steps(1) infinite}
.ms.u{background:#e3f2fd;align-self:flex-start;border-bottom-left-radius:.6vh}
.ms.m{background:#4285f4;color:#fff;align-self:flex-end;border-bottom-right-radius:.6vh}
.ms:nth-of-type(2){animation-delay:1.2s}.ms:nth-of-type(3){animation-delay:2.6s}.ms:nth-of-type(4){animation-delay:4s}
@keyframes ci{0%{opacity:0;transform:translateY(1.6vh) scale(.94)}10%,90%{opacity:1;transform:none}100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="chat"><div class="ms u">视频导出失败怎么办？</div><div class="ms m">请检查磁盘剩余空间 ≥ 10GB 哦</div><div class="ms u">还是不行…</div><div class="ms m">已为您转接人工客服 👩‍💼</div></div></div></body></html>
