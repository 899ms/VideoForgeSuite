<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>面包屑导航</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#f7f8fa;display:grid;place-items:center}
.bc{display:flex;align-items:center;gap:1.6vh;font-size:3.2vh;color:#8a93a6}
.bc i{font-style:normal;opacity:0;animation:bi 4.4s steps(1) infinite}
.bc i.on{color:#1a73e8;font-weight:700}
.bc .sep:after{content:"/"}
.bc i:nth-of-type(1){animation-delay:.2s}.bc i:nth-of-type(2){animation-delay:.9s}.bc i:nth-of-type(3){animation-delay:1.6s}.bc i:nth-of-type(4){animation-delay:2.3s}
@keyframes bi{0%{opacity:0;transform:translateY(1vh)}10%,88%{opacity:1;transform:none}100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="bc"><i class="sep">首页</i><i class="sep">素材库</i><i class="sep">转场</i><i class="on">蜂巢填充</i></div></div></body></html>
