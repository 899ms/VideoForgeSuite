<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>拖拽上传</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#f4f6fb;display:grid;place-items:center}
.up{width:44vw;height:44vh;border:.5vh dashed #93a4c8;border-radius:2.6vh;display:grid;place-items:center;color:#7a86a2;font-size:3.2vh;gap:1.4vh;text-align:center;transition:.3s;background:#fff8;animation:dz 3.6s ease-in-out infinite}
.up .ic{font-size:8vh;animation:fd 2.4s ease-in-out infinite}
@keyframes dz{50%{border-color:#5b7cfa;background:#f0f4ff;transform:scale(1.02)}}
@keyframes fd{50%{transform:translateY(-1.6vh)}}
</style></head>
<body><div id="stage"><div class="up"><div class="ic">📁</div>把视频素材拖到这里<br><small>支持 MP4 / MOV · 单文件 ≤ 4GB</small></div></div></body></html>
