<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#09090b;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}.tl{position:relative;width:56vw;height:80vh}.ln{position:absolute;left:50%;top:0;bottom:0;width:2px;background:#27272a}.fl{position:absolute;left:50%;top:0;bottom:0;width:2px;background:linear-gradient(180deg,#a78bfa,#f472b6);transform-origin:top;animation:gr 5s ease-in-out infinite alternate}@keyframes gr{from{transform:scaleY(.1)}to{transform:scaleY(1)}}.nd{position:absolute;left:50%;transform:translateX(-50%);width:2.4vh;height:2.4vh;border-radius:50%;background:#a78bfa;box-shadow:0 0 18px #a78bfa}.nd:nth-child(4){top:8%}.nd:nth-child(5){top:48%}.nd:nth-child(6){top:88%}.bx{position:absolute;width:20vw;padding:2vh;background:#111114;border:1px solid #27272a;border-radius:12px;color:#d4d4d8;font-size:1.5vw}.bx:nth-child(7){left:8%;top:4%}.bx:nth-child(8){right:8%;top:44%}.bx:nth-child(9){left:8%;top:84%}</style></head><body><div class="tl"><div class="ln"></div><div class="fl"></div><div class="nd"></div><div class="nd"></div><div class="nd"></div><div class="bx">Phase 1 — Setup</div><div class="bx">Phase 2 — Build</div><div class="bx">Phase 3 — Launch</div></div><script></script></body></html>
