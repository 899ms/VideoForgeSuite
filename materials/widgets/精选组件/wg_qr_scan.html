<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>扫码识别</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#0c0f14;display:grid;place-items:center}
.qr{position:relative;width:40vh;height:40vh;border-radius:2vh;background:#151b24;display:grid;place-items:center;font-size:20vh}
.qr:after{content:"将二维码放入框内";position:absolute;bottom:-6vh;width:max-content;color:#7a869a;font-size:2.6vh}
.ln{position:absolute;left:6%;right:6%;height:.5vh;background:#22d3ee;box-shadow:0 0 2.4vh #22d3ee;animation:sc 2.6s ease-in-out infinite}
.cr{position:absolute;width:6vh;height:6vh;border:.6vh solid #22d3ee}
.c1{left:2vh;top:2vh;border-right:none;border-bottom:none;border-radius:1.4vh 0 0 0}
.c2{right:2vh;top:2vh;border-left:none;border-bottom:none;border-radius:0 1.4vh 0 0}
.c3{left:2vh;bottom:2vh;border-right:none;border-top:none;border-radius:0 0 0 1.4vh}
.c4{right:2vh;bottom:2vh;border-left:none;border-top:none;border-radius:0 0 1.4vh 0}
@keyframes sc{0%,100%{top:8%}50%{top:88%}}
</style></head>
<body><div id="stage"><div class="qr">▦<div class="ln"></div><div class="cr c1"></div><div class="cr c2"></div><div class="cr c3"></div><div class="cr c4"></div></div></div></body></html>
