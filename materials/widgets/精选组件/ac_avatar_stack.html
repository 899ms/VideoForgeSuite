<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0a;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}.s{display:flex;align-items:center}.s .a{width:11vh;height:11vh;border-radius:50%;border:4px solid #0a0a0a;margin-left:-3vh;background:linear-gradient(135deg,var(--a),var(--b));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:3vh;animation:pn 3s ease-in-out infinite;animation-delay:var(--d)}@keyframes pn{0%,100%{transform:translateX(0)}50%{transform:translateX(-1.6vh)}}.s .plus{background:#27272a;color:#a1a1aa}</style></head><body><div class="s"><div class="a" style="--a:#f472b6;--b:#db2777;--d:0s">A</div><div class="a" style="--a:#38bdf8;--b:#0369a1;--d:.12s">B</div><div class="a" style="--a:#34d399;--b:#047857;--d:.24s">C</div><div class="a" style="--a:#fbbf24;--b:#b45309;--d:.36s">D</div><div class="a plus" style="--d:.48s">+9</div></div><script></script></body></html>
