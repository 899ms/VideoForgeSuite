<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>星级评分</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#0f1420}
.stars{display:flex;gap:1.6vh}
.stars span{font-size:9vh;filter:grayscale(1) brightness(.5);animation:li 5s steps(1) infinite;animation-delay:calc(var(--i)*.4s)}
@keyframes li{0%{filter:grayscale(1) brightness(.5);transform:scale(1)}8%,80%{filter:none;transform:scale(1.18);text-shadow:0 0 3vh #ffd166}84%,100%{filter:grayscale(1) brightness(.5);transform:scale(1)}}
</style></head>
<body><div id="stage"><div class="stars"><span style="--i:0">★</span><span style="--i:1">★</span><span style="--i:2">★</span><span style="--i:3">★</span><span style="--i:4">★</span></div></div></body></html>
