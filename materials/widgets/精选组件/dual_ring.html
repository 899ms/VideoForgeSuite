<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>双环旋转</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
.bg{position:fixed;inset:0;background:radial-gradient(70% 70% at 50% 45%,#29D3E6cc 0%,transparent 72%),radial-gradient(55% 55% at 18% 82%,#FF5C8Aaa 0%,transparent 70%),radial-gradient(55% 55% at 82% 18%,#7C6CF5aa 0%,transparent 70%),linear-gradient(135deg,#2b2542,#171428);animation:hue 22s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}canvas{width:100%;height:100%;display:block}
.txt{color:#fff;font-weight:900;text-align:center}
@keyframes rt{to{transform:rotate(360deg)}}.r1,.r2{position:absolute;border-radius:50%}.r1{width:200px;height:200px;border:10px solid #29D3E6;border-top-color:transparent;animation:rt 1.6s linear infinite}.r2{width:140px;height:140px;border:10px solid #FF5C8A;border-bottom-color:transparent;animation:rt 1.1s linear infinite reverse}</style></head>
<body><div class="bg"></div><div id="stage"><div class="r1"></div><div class="r2"></div></div>
<script></script></body></html>
