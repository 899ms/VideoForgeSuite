<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>电竞排行榜</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#0d0f1a;display:grid;place-items:center;gap:2vh}
.rk{width:60vw;display:flex;flex-direction:column;gap:1.6vh}
.tm{display:flex;align-items:center;gap:2.4vh;background:linear-gradient(90deg,#171b2e,#12141f);border:.1vh solid #ffffff12;border-radius:1.4vh;padding:2vh 3vh;color:#fff}
.tm .pos{font-size:4vh;font-weight:900;width:5vh;color:#6b7280}
.tm.gold .pos{color:#fbbf24}.tm.silver .pos{color:#cbd5e1}.tm.bronze .pos{color:#d97706}
.tm .nm{flex:1;font-size:3.2vh;font-weight:700}
.tm .sc{font-size:3.2vh;color:#22d3ee;font-weight:800}
.tm{transform-origin:left;animation:ti 4.6s steps(1) infinite}
.tm:nth-child(2){animation-delay:.3s}.tm:nth-child(3){animation-delay:.6s}.tm:nth-child(4){animation-delay:.9s}
@keyframes ti{0%{transform:scaleX(0);opacity:0}12%,90%{transform:scaleX(1);opacity:1}100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="rk"><div class="tm gold"><span class="pos">1</span><span class="nm">⚡ HERMES</span><span class="sc">2480</span></div><div class="tm silver"><span class="pos">2</span><span class="nm">CODEX</span><span class="sc">2415</span></div><div class="tm bronze"><span class="pos">3</span><span class="nm">CLAUDE</span><span class="sc">2390</span></div><div class="tm"><span class="pos">4</span><span class="nm">OPENCLAW</span><span class="sc">2322</span></div></div></div></body></html>
