<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>选座选票</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#101418;display:grid;place-items:center}
.sx{display:grid;grid-template-rows:repeat(4,1fr);grid-auto-flow:column;gap:1.2vh}
.st{width:4.6vh;height:4.6vh;border-radius:1vh 1vh .4vh .4vh;background:#2a3342;animation:ss 5s steps(1) infinite}
.st.sel{background:#ffb300;box-shadow:0 0 1.6vh #ffb30088}
.st.off{background:#1b212c}
.scr{position:absolute;top:10%;left:30%;right:30%;height:1vh;background:#ffffff55;border-radius:50%;box-shadow:0 1vh 3vh #ffffff33}
.tip{position:absolute;bottom:14%;color:#fff;font-size:3vh;background:#ffb300;color:#111;padding:1vh 2.6vh;border-radius:2vh;opacity:0;animation:tp 5s steps(1) 1.2s infinite}
@keyframes ss{0%{opacity:.5}12%,90%{opacity:1}100%{opacity:.5}}
@keyframes tp{0%,14%{opacity:0}24%,88%{opacity:1}100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="scr"></div><div class="sx"><div class="st " style="animation-delay:0.0s"></div><div class="st " style="animation-delay:0.04s"></div><div class="st " style="animation-delay:0.08s"></div><div class="st off" style="animation-delay:0.12s"></div><div class="st " style="animation-delay:0.16s"></div><div class="st " style="animation-delay:0.2s"></div><div class="st " style="animation-delay:0.24s"></div><div class="st " style="animation-delay:0.28s"></div><div class="st " style="animation-delay:0.32s"></div><div class="st sel" style="animation-delay:0.36s"></div><div class="st sel" style="animation-delay:0.4s"></div><div class="st " style="animation-delay:0.44s"></div><div class="st " style="animation-delay:0.48s"></div><div class="st " style="animation-delay:0.52s"></div><div class="st " style="animation-delay:0.56s"></div><div class="st " style="animation-delay:0.6s"></div><div class="st " style="animation-delay:0.64s"></div><div class="st off" style="animation-delay:0.68s"></div><div class="st " style="animation-delay:0.72s"></div><div class="st " style="animation-delay:0.76s"></div><div class="st " style="animation-delay:0.8s"></div><div class="st " style="animation-delay:0.84s"></div><div class="st " style="animation-delay:0.88s"></div><div class="st " style="animation-delay:0.92s"></div><div class="st off" style="animation-delay:0.96s"></div><div class="st " style="animation-delay:1.0s"></div><div class="st " style="animation-delay:1.04s"></div><div class="st " style="animation-delay:1.08s"></div><div class="st " style="animation-delay:1.12s"></div><div class="st " style="animation-delay:1.16s"></div><div class="st " style="animation-delay:1.2s"></div><div class="st off" style="animation-delay:1.24s"></div></div><div class="tip">已选 J7 · J8 · ¥86</div></div></body></html>
