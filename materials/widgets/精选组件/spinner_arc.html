<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>弧形加载器</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
.bg{position:fixed;inset:0;background:radial-gradient(70% 70% at 50% 45%,#7C6CF5cc 0%,transparent 72%),radial-gradient(55% 55% at 18% 82%,#29D3E6aa 0%,transparent 70%),radial-gradient(55% 55% at 82% 18%,#FF5C8Aaa 0%,transparent 70%),linear-gradient(135deg,#2b2542,#171428);animation:hue 22s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}canvas{width:100%;height:100%;display:block}
.txt{color:#fff;font-weight:900;text-align:center}
#s{animation:sp 1.4s cubic-bezier(.6,0,.4,1) infinite}@keyframes sp{0%{stroke-dashoffset:289}50%{stroke-dashoffset:70}100%{stroke-dashoffset:289}0%{transform:rotate(-90 60 60)}100%{transform:rotate(270 60 60)}}</style></head>
<body><div class="bg"></div><div id="stage"><svg viewBox="0 0 120 120" width="55%" height="55%"><circle cx="60" cy="60" r="46" fill="none" stroke="#ffffff22" stroke-width="10"/><circle id="s" cx="60" cy="60" r="46" fill="none" stroke="#7C6CF5" stroke-width="10" stroke-linecap="round" stroke-dasharray="289" transform="rotate(-90 60 60)"/></svg></div>
<script></script></body></html>
