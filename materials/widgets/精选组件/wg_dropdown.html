<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>下拉菜单</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#fff;display:grid;place-items:center}
.menu{position:relative}
.trg{padding:2vh 4.4vh;border-radius:1.4vh;background:#111827;color:#fff;font-size:3.2vh;display:flex;gap:1.6vh;align-items:center}
.trg:after{content:"▾"}
.dd{position:absolute;left:0;right:0;top:calc(100% + 1.2vh);background:#fff;border-radius:1.6vh;box-shadow:0 2vh 5vh #0002;overflow:hidden;border:.2vh solid #eef}
.dd i{display:block;padding:1.8vh 3vh;font-size:2.9vh;color:#374151;font-style:normal;opacity:0;transform:translateY(-1.4vh);animation:di 4.6s steps(1) infinite}
.dd i:hover{background:#f3f4f6}
.dd i:nth-of-type(1){animation-delay:.3s}.dd i:nth-of-type(2){animation-delay:.5s}.dd i:nth-of-type(3){animation-delay:.7s}
@keyframes di{0%{opacity:0;transform:translateY(-1.4vh)}10%,86%{opacity:1;transform:none}96%,100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="menu"><div class="trg">导出视频</div><div class="dd"><i>1080P · MP4</i><i>4K · MOV</i><i>GIF 动图</i></div></div></div></body></html>
