<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>前后对比</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0f1c}
.cmp{position:relative;width:70vh;height:44vh;border-radius:1.6vh;overflow:hidden;box-shadow:0 3vh 7vh #000b}
.b,.a{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:6vh;font-weight:900;color:#fff}
.b{background:linear-gradient(135deg,#1e293b,#0f172a)}
.a{background:linear-gradient(135deg,#0891b2,#7c3aed);clip-path:inset(0 0 0 50%);animation:sw 5s ease-in-out infinite alternate}
.tag{position:absolute;top:2vh;font-size:2.2vh;font-weight:800;color:#fff;background:#0009;padding:.8vh 2vh;border-radius:99vh}
.l{left:2vh}.r{right:2vh}
.hd{position:absolute;top:0;bottom:0;left:50%;width:.6vh;background:#fff;box-shadow:0 0 2vh #fff9;animation:hd 5s ease-in-out infinite alternate}
.hd:after{content:"◀▶";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:#fff;color:#0f172a;font-size:2vh;font-weight:900;padding:1vh 1.4vh;border-radius:99vh;white-space:nowrap}
@keyframes sw{to{clip-path:inset(0 0 0 18%)}}
@keyframes hd{to{left:18%}}
</style></head>
<body><div id="stage"><div class="cmp"><div class="b">BEFORE</div><div class="a">AFTER</div><span class="tag l">原始</span><span class="tag r">AI 增强</span><div class="hd"></div></div></div></body></html>
