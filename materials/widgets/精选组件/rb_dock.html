<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#0b0b10;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}.d{position:fixed;bottom:8vh;left:50%;transform:translateX(-50%);display:flex;gap:1.6vw;align-items:flex-end}.i{width:5vw;height:5vw;border-radius:1.2vw;background:linear-gradient(135deg,var(--a),var(--b));transition:transform .1s linear}</style></head><body><div class="d" id="d"></div><script>const C=[["#f472b6","#a78bfa"],[['#38bdf8', '#818cf8'], ['#34d399', '#10b981'], ['#fbbf24', '#f59e0b'], ['#fb7185', '#ef4444'], ['#a78bfa', '#6d28d9'], ['#22d3ee', '#0891b2'], ['#e879f9', '#c026d3']]];const d=document.getElementById("d");d.innerHTML=C.map(c=>`<div class="i" style="--a:${c[0]};--b:${c[1]}"></div>`).join("");const is=[...d.children];(function f(){const c=(Math.sin(performance.now()/1600)*.5+.5)*(is.length-1);is.forEach((el,i)=>{const k=1+.75*Math.exp(-((i-c)**2)/1.6);el.style.transform=`scale(${k}) translateY(${-(k-1)*2.2}vw)`});requestAnimationFrame(f)})()</script></body></html>
