<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#050505;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}.wrap{position:relative;width:60vw;height:100vh}.beam{position:absolute;left:50%;top:0;width:2px;height:100%;background:#1e293b}.dot{position:absolute;left:50%;width:2px;height:12vh;background:linear-gradient(180deg,transparent,#38bdf8);animation:tr 6s ease-in-out infinite}@keyframes tr{0%{top:-14vh}70%,100%{top:104%}}.ln{position:absolute;left:12%;width:76%;height:20vh;border-radius:16px;background:#0f172a;border:1px solid #1e293b}.ln:nth-child(3){top:12%}.ln:nth-child(4){top:40%}.ln:nth-child(5){top:68%}</style></head><body><div class="wrap"><div class="beam"></div><div class="dot"></div><div class="ln"></div><div class="ln"></div><div class="ln"></div></div><script></script></body></html>
