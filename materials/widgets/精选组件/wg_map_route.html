<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>行程路线</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#0e1420;display:grid;place-items:center}
.rt{width:60vw;height:44vh}
.rt path.r{fill:none;stroke:#22d3ee;stroke-width:.5vh;stroke-dasharray:10 14;animation:dm 3s linear infinite;filter:drop-shadow(0 0 1.4vh #22d3ee)}
.rt path.base{fill:none;stroke:#22d3ee33;stroke-width:.5vh}
.pin{position:absolute;font-size:4.6vh;opacity:0;animation:pn 4s steps(1) infinite}
.p1{left:14%;top:66%}.p2{left:78%;top:22%;animation-delay:1.2s}
@keyframes dm{to{stroke-dashoffset:-24}}
@keyframes pn{0%,10%{opacity:0;transform:translateY(-2vh)}22%,88%{opacity:1;transform:none}100%{opacity:0}}
</style></head>
<body><div id="stage"><svg class="rt" viewBox="0 0 400 220"><path class="base" d="M40 170 C120 170 130 60 220 60 C300 60 300 60 360 50"/><path class="r" d="M40 170 C120 170 130 60 220 60 C300 60 300 60 360 50"/></svg><div class="pin p1">📍北京</div><div class="pin p2">📍三亚</div></div></body></html>
