<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>音乐播放器</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:linear-gradient(140deg,#1a1a2e,#16213e);display:grid;place-items:center}
.pl{width:36vw;border-radius:3vh;background:#ffffff0f;border:.1vh solid #ffffff22;backdrop-filter:blur(2vh);padding:4vh;display:flex;flex-direction:column;gap:2.4vh;color:#fff}
.cv{width:14vh;height:14vh;border-radius:2vh;background:linear-gradient(135deg,#e94560,#533483);display:grid;place-items:center;font-size:6vh;animation:sp 8s linear infinite}
.pl .tt{font-size:3.4vh;font-weight:700}
.pl .ar{font-size:2.4vh;opacity:.7}
.pgb{height:.8vh;border-radius:1vh;background:#ffffff26;position:relative;overflow:hidden}
.pgb i{position:absolute;left:0;top:0;bottom:0;width:38%;background:#e94560;animation:pg 6s linear infinite}
.ctl{display:flex;justify-content:center;gap:4vh;font-size:4.4vh}
@keyframes sp{to{transform:rotate(1turn)}}
@keyframes pg{to{width:100%}}
</style></head>
<body><div id="stage"><div class="pl"><div class="cv">🎵</div><div class="tt">夜行者</div><div class="ar">Hermes Beats · 03:24</div><div class="pgb"><i></i></div><div class="ctl"><span>⏮</span><span>⏸</span><span>⏭</span></div></div></div></body></html>
