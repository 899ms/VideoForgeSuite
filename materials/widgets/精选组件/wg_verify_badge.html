<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>认证徽章</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#0f1115;display:grid;place-items:center}
.bg{position:relative;display:flex;align-items:center;gap:2vh;background:#171a22;border:.1vh solid #ffffff1c;border-radius:5vh;padding:2vh 4vh 2vh 2vh;color:#fff;font-size:3.4vh;font-weight:700}
.bg .av{width:7vh;height:7vh;border-radius:50%;background:#3b82f6;display:grid;place-items:center;font-size:3.4vh}
.bd{width:4vh;height:4vh;border-radius:50%;background:#1d9bf0;display:grid;place-items:center;font-size:2.6vh;color:#fff;animation:pp 2.6s cubic-bezier(.3,1.6,.4,1) infinite}
.bd:before{content:"✓"}
.sh{position:absolute;inset:-1vh;border-radius:6vh;border:.2vh solid #1d9bf066;animation:sh 2.6s ease-out infinite}
@keyframes pp{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes sh{0%{transform:scale(.9);opacity:1}100%{transform:scale(1.25);opacity:0}}
</style></head>
<body><div id="stage"><div class="bg"><div class="sh"></div><div class="av">📺</div>Hermes 官方号<div class="bd"></div></div></div></body></html>
