<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>社媒数据卡</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#fff;display:grid;place-items:center}
.sc{width:38vw;border:.2vh solid #e5e7eb;border-radius:2.4vh;padding:3.4vh;display:grid;grid-template-columns:repeat(3,1fr);gap:2vh;text-align:center}
.sc div b{display:block;font-size:5vh;font-weight:900;color:#111827;animation:cu 3.6s steps(18) infinite}
.sc div span{font-size:2.4vh;color:#9ca3af}
.sc i{font-style:normal;font-size:2.2vh;color:#059669}
@keyframes cu{0%{opacity:0;transform:translateY(1.6vh)}12%,88%{opacity:1;transform:none}100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="sc"><div><b>12.8w</b><span>粉丝</span><i>+2.1%</i></div><div><b>4.6w</b><span>本周播放</span><i>+18%</i></div><div><b>46%</b><span>完播率</span><i>+3%</i></div></div></div></body></html>
