<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>个人名片</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#101828;display:grid;place-items:center;perspective:100vh}
.cd{width:30vw;height:44vh;position:relative;transform-style:preserve-3d;animation:fl 6s cubic-bezier(.7,0,.3,1) infinite}
.fa,.bk{position:absolute;inset:0;border-radius:2.4vh;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4vh}
.fa{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.bk{background:#fff;transform:rotateY(180deg);color:#222b3a}
.av{width:12vh;height:12vh;border-radius:50%;background:#ffffff55;display:grid;place-items:center;font-size:6vh}
.fa h3{font-size:3.6vh}.fa span{font-size:2.4vh;opacity:.85}
.bk p{font-size:2.5vh;line-height:1.9;padding:0 3vh}
@keyframes fl{0%,18%{transform:rotateY(0)}45%,70%{transform:rotateY(180deg)}100%{transform:rotateY(360deg)}}
</style></head>
<body><div id="stage"><div class="cd"><div class="fa"><div class="av">🐱</div><h3>讲效率的猫</h3><span>AI 工具测评 · 每周三更新</span></div><div class="bk"><p>「让观众 30 秒学会一个效率技巧」<br><br>粉丝 12.8w · 完播率 46%</p></div></div></div></body></html>
