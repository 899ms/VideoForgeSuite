<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:linear-gradient(135deg,#7dd3fc,#c4b5fd,#f9a8d4);display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}.p{display:flex;gap:3vw}.g{width:17vh;height:17vh;border-radius:26px;background:rgba(255,255,255,.16);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.45);display:flex;align-items:center;justify-content:center;font-size:7vh;box-shadow:0 16px 40px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.5);animation:ft 4s ease-in-out infinite}.g:nth-child(2){animation-delay:.6s}.g:nth-child(3){animation-delay:1.2s}@keyframes ft{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-3.4vh) rotate(3deg)}}</style></head><body><div class="p"><div class="g">🧊</div><div class="g">💎</div><div class="g">🔮</div></div><script></script></body></html>
