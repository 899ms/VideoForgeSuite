<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>音量滑条</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#171a21;display:grid;place-items:center;gap:2vh}
.vc{width:48vw;display:flex;align-items:center;gap:2.4vh;color:#e5e9f0;font-size:4.4vh}
.tr{flex:1;height:1.2vh;background:#2a2f3a;border-radius:1vh;position:relative}
.tr i{position:absolute;left:0;top:0;bottom:0;border-radius:inherit;background:linear-gradient(90deg,#8b5cf6,#ec4899);animation:vw 3.6s ease-in-out infinite alternate}
.tr b{position:absolute;top:50%;width:3vh;height:3vh;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 .4vh 1.6vh #0008;animation:vw2 3.6s ease-in-out infinite alternate}
.vlv{font-size:3vh;color:#a5adc2;width:8vh}
@keyframes vw{from{width:20%}to{width:80%}}
@keyframes vw2{from{left:20%}to{left:80%}}
</style></head>
<body><div id="stage"><div class="vc"><span>🔈</span><div class="tr"><i></i><b></b></div><span class="vlv">65</span><span>🔊</span></div></div></body></html>
