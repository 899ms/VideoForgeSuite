<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>均衡器条</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
.bg{position:fixed;inset:0;background:radial-gradient(70% 70% at 50% 45%,#FF6A00cc 0%,transparent 72%),radial-gradient(55% 55% at 18% 82%,#FF2D95aa 0%,transparent 70%),radial-gradient(55% 55% at 82% 18%,#FFD200aa 0%,transparent 70%),linear-gradient(135deg,#2b2542,#171428);animation:hue 22s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}canvas{width:100%;height:100%;display:block}
.txt{color:#fff;font-weight:900;text-align:center}
</style></head>
<body><div class="bg"></div><div id="stage"><canvas id="cv"></canvas></div>
<script>var cv=document.getElementById('cv'),x=cv.getContext('2d');
function rs(){cv.width=innerWidth;cv.height=innerHeight;}rs();addEventListener('resize',rs);var t=0;(function loop(){requestAnimationFrame(loop);t+=0.08;x.clearRect(0,0,cv.width,cv.height);var n=28,bw=cv.width/n;for(var i=0;i<n;i++){var h=(Math.abs(Math.sin(t+i*0.3))*0.6+Math.abs(Math.sin(t*1.7+i*0.7))*0.4)*cv.height*0.6;var g=x.createLinearGradient(0,cv.height,0,cv.height-h);g.addColorStop(0,'#FF6A00');g.addColorStop(1,'#FFD200');x.fillStyle=g;x.fillRect(i*bw+bw*0.15,cv.height-h,bw*0.7,h);}x.fillStyle='#FF2D95';x.fillRect(0,cv.height-3,cv.width,3);})();</script></body></html>
