<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>成功对勾</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
.bg{position:fixed;inset:0;background:radial-gradient(70% 70% at 50% 45%,#2ECC71cc 0%,transparent 72%),radial-gradient(55% 55% at 18% 82%,#23D5ABaa 0%,transparent 70%),radial-gradient(55% 55% at 82% 18%,#A8FF60aa 0%,transparent 70%),linear-gradient(135deg,#2b2542,#171428);animation:hue 22s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}canvas{width:100%;height:100%;display:block}
.txt{color:#fff;font-weight:900;text-align:center}
#c{animation:cd 1.2s ease forwards}#k{animation:kd 0.6s 0.9s ease forwards;stroke-dashoffset:120}@keyframes cd{to{stroke-dashoffset:0}}@keyframes kd{to{stroke-dashoffset:0}}</style></head>
<body><div class="bg"></div><div id="stage"><svg viewBox="0 0 120 120" width="55%" height="55%"><circle cx="60" cy="60" r="50" fill="none" stroke="#2ECC71" stroke-width="8" stroke-dasharray="314" id="c"/><path d="M38 62 L54 78 L84 44" fill="none" stroke="#2ECC71" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="120" id="k"/></svg></div>
<script></script></body></html>
