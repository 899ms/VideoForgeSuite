<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>视频控制条</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#000;display:grid;place-items:center;overflow:hidden}
.vd{position:absolute;inset:0;background:linear-gradient(120deg,#263238,#0d1b1e);opacity:.9}
.ctl{position:absolute;left:5%;right:5%;bottom:8%;background:#000000aa;border-radius:1.6vh;padding:2vh 3vh;color:#fff}
.ctl .bar{height:.8vh;background:#ffffff33;border-radius:1vh;position:relative;margin-bottom:1.6vh}
.ctl .bar i{position:absolute;left:0;top:0;bottom:0;width:46%;background:#ff5252;border-radius:inherit}
.ctl .bar i:after{content:"";position:absolute;right:-1vh;top:50%;transform:translateY(-50%);width:2.2vh;height:2.2vh;border-radius:50%;background:#ff5252}
.ctl .row{display:flex;align-items:center;gap:2.4vh;font-size:3.2vh}
.tme{font-size:2.2vh;opacity:.8}
@keyframes bw{to{width:46%}}
</style></head>
<body><div id="stage"><div class="vd"></div><div class="ctl"><div class="bar"><i style="animation:bw 8s ease-in-out infinite alternate"></i></div><div class="row"><span>▶</span><span>🔊</span><span class="tme">02:14 / 04:52</span><span style="margin-left:auto">⚙ ⛶</span></div></div></div></body></html>
