<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>众筹目标</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#14161c;display:grid;place-items:center;gap:2vh}
.cf{width:50vw;color:#fff}
.cf .tt{display:flex;justify-content:space-between;font-size:3vh;margin-bottom:1.4vh}
.cf .tt b{color:#ffb300}
.bar{height:2.6vh;background:#242833;border-radius:2vh;overflow:hidden;position:relative}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#ffb300,#ff8f00);border-radius:inherit;animation:fd 4s steps(24) infinite}
.mk{position:absolute;right:12%;top:-1vh;bottom:-1vh;width:.4vh;background:#ffffff44}
.sup{position:absolute;right:0;top:-6vh;font-size:2.6vh;color:#a5adc2;opacity:0;animation:sp 4s steps(1) infinite}
@keyframes fd{to{width:88%}}
@keyframes sp{0%,30%{opacity:0}42%,86%{opacity:1}100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="cf"><div class="tt"><span>已筹 <b>¥352,000</b></span><span>目标 ¥400,000</span></div><div class="bar"><div class="mk"></div><i></i></div><div class="sup">1,024 人支持 · 还剩 3 天</div></div></div></body></html>
