<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>抽奖转盘</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(70% 70% at 50% 42%,#241b3a,#0d0a1a)}
.wheel{position:relative;width:58vh;height:58vh;border-radius:50%;border:1.4vh solid #fbbf24;box-shadow:0 0 6vh #fbbf2455,0 3vh 6vh #000a;background:conic-gradient(#fb7185 0deg 45deg,#334155 45deg 90deg,#22d3ee 90deg 135deg,#f59e0b 135deg 180deg,#8b5cf6 180deg 225deg,#334155 225deg 270deg,#34d399 270deg 315deg,#334155 315deg 360deg);animation:spin 9s cubic-bezier(.2,.9,.25,1) infinite}
.wheel span{position:absolute;left:50%;top:50%;transform-origin:0 0;color:#fff;font-size:2.5vh;font-weight:900;text-shadow:0 .2vh .8vh #000}
.hub{position:absolute;left:50%;top:50%;width:10vh;height:10vh;margin:-5vh;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#cbd5e1 60%,#64748b);box-shadow:0 .6vh 2vh #000a;z-index:2}
.ptr{position:absolute;left:50%;top:-2.4vh;transform:translateX(-50%);width:0;height:0;border:3vh solid transparent;border-top:6vh solid #f43f5e;filter:drop-shadow(0 .4vh 1vh #000);z-index:3}
@keyframes spin{0%{rotate:0deg}55%{rotate:1520deg}72%{rotate:1440deg}78%{rotate:1462deg}84%,100%{rotate:1440deg}}
</style></head>
<body><div id="stage"><div class="wheel"><span style="transform:rotate(22deg) translateY(-16vh)">一等奖</span><span style="transform:rotate(68deg) translateY(-16vh)">谢谢参与</span><span style="transform:rotate(112deg) translateY(-16vh)">再抽一次</span><span style="transform:rotate(158deg) translateY(-16vh)">优惠券</span><span style="transform:rotate(202deg) translateY(-16vh)">神秘礼盒</span><span style="transform:rotate(248deg) translateY(-16vh)">谢谢参与</span><span style="transform:rotate(292deg) translateY(-16vh)">积分×2</span><span style="transform:rotate(338deg) translateY(-16vh)">谢谢参与</span><div class="hub"></div><div class="ptr"></div></div></div></body></html>
