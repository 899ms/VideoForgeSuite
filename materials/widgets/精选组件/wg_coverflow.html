<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>3D轮播</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(70% 80% at 50% 40%,#151d33,#090c16);perspective:120vh}
.fl{display:flex;align-items:center;transform-style:preserve-3d;animation:mv 8s ease-in-out infinite}
.cv{width:22vh;height:30vh;margin:0 -3.5vh;border-radius:1.6vh;background:linear-gradient(160deg,var(--c),#0008 90%);display:flex;align-items:flex-end;justify-content:center;color:#fff;font-size:3.4vh;font-weight:900;padding-bottom:1.6vh;box-shadow:0 2.4vh 5vh #000a;transform-style:preserve-3d;border:1px solid #fff2}
.cv span{transform:translateZ(2vh)}
@keyframes mv{0%,100%{transform:rotateY(24deg)}50%{transform:rotateY(-24deg)}}
</style></head>
<body><div id="stage"><div class="fl"><div class="cv" style="--i:0;--c:#0ea5e9"><span>01</span></div><div class="cv" style="--i:1;--c:#8b5cf6"><span>02</span></div><div class="cv" style="--i:2;--c:#f59e0b"><span>03</span></div><div class="cv" style="--i:3;--c:#10b981"><span>04</span></div><div class="cv" style="--i:4;--c:#f43f5e"><span>05</span></div><div class="cv" style="--i:5;--c:#6366f1"><span>06</span></div></div></div></body></html>
