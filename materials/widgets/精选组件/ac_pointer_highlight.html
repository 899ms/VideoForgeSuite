<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0a;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}.t{font-size:7vw;font-weight:800;color:#52525b;letter-spacing:.2vw}.t span{transition:color .25s, text-shadow .25s}.t span.on{color:#fff;text-shadow:0 0 30px rgba(167,139,250,.9)}</style></head><body><div class="t" id="t">HIGHLIGHT TEXT</div><script>const el=document.getElementById("t");el.innerHTML=[...el.textContent].map(c=>`<span>${c==" "?"&nbsp;":c}</span>`).join("");const ss=[...el.children];let i=0;setInterval(()=>{ss.forEach(s=>s.classList.remove("on"));for(let k=0;k<3;k++)ss[(i+k)%ss.length]?.classList.add("on");i=(i+1)%ss.length},120)</script></body></html>
