<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#020617;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}.f{position:relative;width:64vw;height:64vh;border:1px solid rgba(34,211,238,.25)}.c{position:absolute;width:5vw;height:5vh;border:0.5vh solid #22d3ee;animation:pp 2.4s ease-in-out infinite}.c.tl{top:-2px;left:-2px;border-right:0;border-bottom:0}.c.tr{top:-2px;right:-2px;border-left:0;border-bottom:0}.c.bl{bottom:-2px;left:-2px;border-right:0;border-top:0}.c.br{bottom:-2px;right:-2px;border-left:0;border-top:0}@keyframes pp{50%{transform:scale(1.06);filter:drop-shadow(0 0 8px #22d3ee)}}.mid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#22d3ee;font-family:Consolas,monospace;font-size:1.6vw;letter-spacing:.6vw}</style></head><body><div class="f"><div class="c tl"></div><div class="c tr"></div><div class="c bl"></div><div class="c br"></div><div class="mid">TARGET LOCKED</div></div><script></script></body></html>
