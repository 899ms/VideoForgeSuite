<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#020617;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}canvas{width:100vw;height:100vh}</style></head><body><canvas id="cv" width="1920" height="1080"></canvas><script>const cv=document.getElementById("cv"),ctx=cv.getContext("2d");function f(t){ctx.fillStyle="#020617";ctx.fillRect(0,0,1920,1080);ctx.translate(960,540);const B=64;for(let i=0;i<B;i++){const a=Math.PI*2*i/B,h=30+Math.abs(Math.sin(t/300+i*.4))*150+Math.abs(Math.sin(t/130+i))*60,x1=Math.cos(a)*130,y1=Math.sin(a)*130,x2=Math.cos(a)*(130+h),y2=Math.sin(a)*(130+h);ctx.strokeStyle=`hsla(${280+i*3},85%,62%,.9)`;ctx.lineWidth=5;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}ctx.setTransform(1,0,0,1,0,0);requestAnimationFrame(f)}requestAnimationFrame(f)</script></body></html>
