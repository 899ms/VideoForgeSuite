<!doctype html><html lang=zh><head><meta charset=utf-8>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#1c1917;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:40px;font-family:'Segoe UI',system-ui,sans-serif}
.tg{width:120px;height:62px;border-radius:999px;background:linear-gradient(180deg,#1e3a8a,#0c4a6e);position:relative;box-shadow:inset 0 4px 12px rgba(0,0,0,.5);animation:day 4s ease-in-out infinite alternate}
.sun{position:absolute;top:7px;left:8px;width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fef08a,#f59e0b);box-shadow:0 0 20px #fbbf24;animation:sunmv 4s ease-in-out infinite alternate}
@keyframes day{to{background:linear-gradient(180deg,#0f172a,#1e1b4b)}}
@keyframes sunmv{to{transform:translateX(56px);background:radial-gradient(circle at 35% 35%,#e2e8f0,#94a3b8);box-shadow:0 0 18px #cbd5e1}}
.s{font-size:13px;color:#a8a29e;letter-spacing:6px}</style></head><body>
<div class=tg><div class=sun></div></div><div class=s>UIVERSE · DAY / NIGHT TOGGLE</div>
<script>setTimeout(function(){try{document.getAnimations().forEach(function(x){x.pause()})}catch(e){}},2300);</script></body></html>
