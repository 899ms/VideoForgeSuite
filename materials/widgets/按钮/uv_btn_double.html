<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#0f172a;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}.b{position:relative;padding:2.6vh 5vw;font-size:2.2vw;font-weight:800;color:#fbbf24;background:#0f172a;border:2px solid #fbbf24;border-radius:10px;cursor:pointer;transition:.2s;animation:dv 3s ease-in-out infinite}@keyframes dv{0%,100%{box-shadow:0.6vw 0.6vw 0 #b45309,0.6vw 0.6vw 0 2px #0f172a}50%{box-shadow:1.1vw 1.1vw 0 #b45309,1.1vw 1.1vw 0 2px #0f172a}}</style></head><body><button class="b">DOUBLE SHADOW</button><script></script></body></html>
