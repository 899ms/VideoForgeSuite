<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#0f172a;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}.w{position:relative;width:30vh;height:30vh}.svg{width:100%;height:100%;transform:rotate(-90deg)}.bgc{fill:none;stroke:#1e293b;stroke-width:14}.val{fill:none;stroke:#f472b6;stroke-width:14;stroke-linecap:round;stroke-dasharray:502;stroke-dashoffset:502;animation:lo 3.6s ease-in-out infinite;filter:drop-shadow(0 0 8px #f472b6)}@keyframes lo{40%,60%{stroke-dashoffset:100}100%{stroke-dashoffset:502}}.tx{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#f472b6;font-size:3.4vw;font-weight:900}</style></head><body><div class="w"><svg class="svg" viewBox="0 0 180 180"><circle class="bgc" cx="90" cy="90" r="80"/><circle class="val" cx="90" cy="90" r="80"/></svg><div class="tx">80%</div></div><script></script></body></html>
