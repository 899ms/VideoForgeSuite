<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#0f172a;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}.w{display:flex;flex-direction:column;gap:3vh;width:46vw}.r{display:flex;flex-direction:column;gap:1vh}.lb{display:flex;justify-content:space-between;color:#94a3b8;font-size:1.3vw}.tr{height:2.2vh;border-radius:999px;background:#1e293b;overflow:hidden}.fl{height:100%;border-radius:999px;animation:gw 3.4s ease-in-out infinite alternate}@keyframes gw{from{width:18%}to{width:var(--w)}}</style></head><body><div class="w"><div class="r"><div class="lb"><span>Design</span><span>86%</span></div><div class="tr"><div class="fl" style="--w:86%;background:#f472b6"></div></div></div><div class="r"><div class="lb"><span>Development</span><span>64%</span></div><div class="tr"><div class="fl" style="--w:64%;background:#38bdf8;animation-delay:.4s"></div></div></div><div class="r"><div class="lb"><span>Testing</span><span>42%</span></div><div class="tr"><div class="fl" style="--w:42%;background:#34d399;animation-delay:.8s"></div></div></div></div><script></script></body></html>
