<!doctype html><html lang=zh><head><meta charset=utf-8>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#fafaf9;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif}
.w{text-align:center}
.steps{display:flex;align-items:center;gap:0}
.node{width:52px;height:52px;border-radius:50%;background:#e7e5e4;color:#a8a29e;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;position:relative;z-index:1;animation:fillin .5s ease forwards;opacity:0}
.node.ok{background:#10b981;color:#fff;box-shadow:0 6px 18px rgba(16,185,129,.4)}
.node:nth-child(1){animation-delay:.3s}.node:nth-child(3){animation-delay:1.1s}.node:nth-child(5){animation-delay:1.9s}
@keyframes fillin{to{opacity:1}}
.line{width:76px;height:6px;background:#e7e5e4;overflow:hidden}
.line i{display:block;height:100%;background:#10b981;transform:scaleX(0);transform-origin:left}
.l1 i{animation:grow .7s ease .85s forwards}.l2 i{animation:grow .7s ease 1.65s forwards}
@keyframes grow{to{transform:scaleX(1)}}
.s{margin-top:36px;font-size:13px;color:#78716c;letter-spacing:5px}</style></head><body><div class=w>
<div class=steps>
<div class="node ok">✓</div><div class="line l1"><i></i></div>
<div class="node ok">✓</div><div class="line l2"><i></i></div>
<div class=node>3</div>
</div><div class=s>UIVERSE · STEP PROGRESS</div></div>
<script>setTimeout(function(){try{document.getAnimations().forEach(function(x){x.pause()})}catch(e){}},2400);</script></body></html>
