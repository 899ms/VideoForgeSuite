<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>矩形树图</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#111;display:grid;place-items:center}
.tm{width:70vw;height:60vh;display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:.8vh}
.tm div{border-radius:.8vh;display:grid;place-items:center;color:#fff;font-size:3vh;font-weight:700;transform:scale(0);animation:tz 3.8s steps(1) infinite}
.a{background:#ef5350}.b{background:#42a5f5}.c{background:#66bb6a}.d{background:#ffca28;color:#333}.e{background:#ab47bc}
@keyframes tz{0%{transform:scale(0)}14%,84%{transform:scale(1)}92%,100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="tm"><div class="a" style="grid-row:1/3">A 42%</div><div class="b">B 18%</div><div class="c">C 15%</div><div class="d">D 14%</div><div class="e">E 11%</div></div></div></body></html>
