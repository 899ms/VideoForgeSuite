<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>极坐标玫瑰</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#101820;display:grid;place-items:center}
.pr{width:52vh;height:52vh;position:relative;animation:rt 14s linear infinite}
.pr i{position:absolute;left:50%;top:50%;width:.4vh;background:linear-gradient(#26c6da,#0288d1);transform-origin:bottom;border-radius:.4vh;transform:translate(-50%,-100%) rotate(calc(var(--r)*1deg));animation:gz 4s steps(18) infinite}
@keyframes gz{0%{height:0;opacity:0}26%{height:calc(var(--h)*1%);opacity:1}82%{height:calc(var(--h)*1%)}100%{opacity:0}}
@keyframes rt{to{transform:rotate(1turn)}}
</style></head>
