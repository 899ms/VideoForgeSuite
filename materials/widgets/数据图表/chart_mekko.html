<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>马赛克图</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#fafafa;display:grid;place-items:center}
.mk{display:flex;gap:1vh;height:46vh;width:60vw;align-items:stretch}
.col{display:flex;flex-direction:column;gap:1vh;animation:gu 3.8s cubic-bezier(.2,.8,.3,1) infinite;transform-origin:bottom}
.col div{border-radius:.6vh}
@keyframes gu{0%{transform:scaleY(0)}40%,88%{transform:scaleY(1)}100%{transform:scaleY(0);opacity:0}}
</style></head>
<body><div id="stage"><div class="mk"><div class="col" style="flex:30;animation-delay:0.0s"><div style="flex:60;background:#1e88e5"></div><div style="flex:40;background:#90caf9"></div></div><div class="col" style="flex:45;animation-delay:0.15s"><div style="flex:35;background:#e53935"></div><div style="flex:45;background:#ef9a9a"></div><div style="flex:20;background:#ffcdd2"></div></div><div class="col" style="flex:25;animation-delay:0.3s"><div style="flex:50;background:#43a047"></div><div style="flex:50;background:#a5d6a7"></div></div></div></div></body></html>
