<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>K线图</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#131722;display:grid;place-items:center;gap:2vh}
.kl{display:flex;align-items:center;gap:2.4vw;height:48vh}
.k{width:2.6vh;position:relative;height:100%;display:flex;align-items:center}
.k i{position:absolute;left:50%;transform:translateX(-50%);width:2.6vh;border-radius:.2vh;transform-origin:bottom;animation:kk 4s steps(1) infinite}
.up{background:#26a69a;box-shadow:0 0 0 .2vh #26a69a}
.dn{background:#ef5350}
.k b{position:absolute;left:50%;transform:translateX(-50%);width:.4vh;background:#26a69a;bottom:20%;top:8%}
.k.red b{background:#ef5350}
@keyframes kk{0%{transform:translateX(-50%) scaleY(0)}28%,84%{transform:translateX(-50%) scaleY(1)}100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="kl"><div class="k"><i class="up" style="height:30%;bottom:20%"></i><b></b></div><div class="k red"><i class="dn" style="height:22%;bottom:38%"></i><b></b></div><div class="k"><i class="up" style="height:38%;bottom:26%"></i><b></b></div><div class="k red"><i class="dn" style="height:16%;bottom:52%"></i><b></b></div></div></div></body></html>
