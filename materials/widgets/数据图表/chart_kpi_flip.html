<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#09090b;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}.r{display:flex;gap:2.4vw}.c{text-align:center;color:#fff}.n{font-size:6.4vw;font-weight:900;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#fff,#94a3b8);-webkit-background-clip:text;color:transparent;animation:fl 1s ease-in-out infinite}.c:nth-child(2) .n{animation-delay:.33s}.c:nth-child(3) .n{animation-delay:.66s}.lb{margin-top:1vh;color:#71717a;font-size:1.4vw;letter-spacing:.3vw}@keyframes fl{0%,100%{transform:rotateX(0)}50%{transform:rotateX(12deg)}}</style></head><body><div class="r"><div class="c"><div class="n" id="n1">0</div><div class="lb">VIEWS</div></div><div class="c"><div class="n" id="n2">0</div><div class="lb">LIKES</div></div><div class="c"><div class="n" id="n3">0</div><div class="lb">SHARES</div></div></div><script>function roll(id,t,d){const e=document.getElementById(id);(function f(){const p=(performance.now()%4600)/4600;e.textContent=Math.floor((1-Math.pow(1-p,3))*t).toLocaleString();requestAnimationFrame(f)})()}roll("n1",98400);roll("n2",12800);roll("n3",5600)</script></body></html>
