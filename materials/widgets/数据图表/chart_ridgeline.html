<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>山脊图</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#0f1b2d;display:grid;place-items:center;overflow:hidden}
.rd{position:relative;width:60vw;height:56vh}
.rd svg{position:absolute;left:0;right:0;width:100%;height:16vh;overflow:visible}
.rd path{fill:#1b2f4a;stroke:#4fc3f7;stroke-width:.4vh;stroke-dasharray:600;stroke-dashoffset:600;animation:dw 4.4s ease-in-out infinite}
@keyframes dw{0%{stroke-dashoffset:600}55%,86%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
</style></head>
<body><div id="stage"><div class="rd"><svg style="top:0%" viewBox="0 0 600 100" preserveAspectRatio="none"><path d="M0,100 L0,70 C60,30 120,75 200,45 C280,15 360,80 440,40 C500,18 560,60 600,50 L600,100 Z"/></svg><svg style="top:17%" viewBox="0 0 600 100" preserveAspectRatio="none"><path d="M0,100 L0,62 C60,25 120,69 200,41 C280,12 360,73 440,36 C500,16 560,55 600,50 L600,100 Z"/></svg><svg style="top:34%" viewBox="0 0 600 100" preserveAspectRatio="none"><path d="M0,100 L0,54 C60,20 120,63 200,37 C280,9 360,66 440,32 C500,14 560,50 600,50 L600,100 Z"/></svg><svg style="top:51%" viewBox="0 0 600 100" preserveAspectRatio="none"><path d="M0,100 L0,46 C60,15 120,57 200,33 C280,6 360,59 440,28 C500,12 560,45 600,50 L600,100 Z"/></svg></div></div></body></html>
