<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>漏斗图</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#1e1e2e;display:grid;place-items:center;gap:1.4vh}
.fd{display:flex;flex-direction:column;align-items:center;gap:1.2vh}
.fn{height:7vh;background:linear-gradient(90deg,#5c6bc0,#7986cb);clip-path:polygon(6% 0,94% 0,88% 100%,12% 100%);transform-origin:center;animation:fn 4s steps(16) infinite;display:grid;place-items:center;color:#fff;font-size:2.6vh}
.fn2{width:78%;background:#7e57c2;clip-path:polygon(8% 0,92% 0,84% 100%,16% 100%);animation-delay:.3s}
.fn3{width:56%;background:#9575cd;clip-path:polygon(10% 0,90% 0,80% 100%,20% 100%);animation-delay:.6s}
.fn4{width:34%;background:#b39ddb;clip-path:polygon(12% 0,88% 0,74% 100%,26% 100%);animation-delay:.9s}
@keyframes fn{0%{transform:scaleX(0);opacity:0}30%,84%{transform:scaleX(1);opacity:1}100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="fd"><div class="fn">曝光 100 万</div><div class="fn fn2">点击 32 万</div><div class="fn fn3">加购 9.8 万</div><div class="fn fn4">成交 2.1 万</div></div></div></body></html>
