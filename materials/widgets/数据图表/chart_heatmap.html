<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0a;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}.g{display:grid;grid-template-columns:repeat(14,2.6vh);gap:0.7vh}.c{width:2.6vh;height:2.6vh;border-radius:5px;animation:pu 3s ease-in-out infinite}@keyframes pu{50%{filter:brightness(1.7);transform:scale(1.15)}}</style></head><body><div class="g" id="g"></div><script>const g=document.getElementById("g");let html="";for(let i=0;i<98;i++){const v=Math.random();html+=`<div class="c" style="background:rgba(34,197,94,${0.08+v*0.9});animation-delay:${(i%14)*0.12+Math.floor(i/14)*0.08}s"></div>`}g.innerHTML=html</script></body></html>
