<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>弦图</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#0e1626;display:grid;place-items:center}
.ch{position:relative;width:52vh;height:52vh}
.nd{position:absolute;width:3vh;height:3vh;border-radius:50%;background:#4fc3f7;box-shadow:0 0 1.6vh #4fc3f7}
.ch svg{position:absolute;inset:0;width:100%;height:100%}
.ch path{fill:none;stroke:#7C6CF5;stroke-width:.5vh;stroke-dasharray:300;stroke-dashoffset:300;animation:dw 4s ease-in-out infinite}
.ch path:nth-child(2){stroke:#f472b6;animation-delay:.5s}
.ch path:nth-child(3){stroke:#34d399;animation-delay:1s}
@keyframes dw{0%{stroke-dashoffset:300}55%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:300;opacity:0}}
</style></head>
<body><div id="stage"><div class="ch"><svg viewBox="0 0 100 100"><path d="M50,6 C20,20 20,80 50,94"/><path d="M50,6 C80,20 80,80 50,94"/><path d="M10,50 C30,80 70,80 90,50"/></svg><span class="nd" style="left:calc(50% - 1.5vh);top:-1.5vh"></span><span class="nd" style="left:calc(50% - 1.5vh);bottom:-1.5vh"></span><span class="nd" style="left:-1.5vh;top:calc(50% - 1.5vh)"></span><span class="nd" style="right:-1.5vh;top:calc(50% - 1.5vh)"></span></div></div></body></html>
