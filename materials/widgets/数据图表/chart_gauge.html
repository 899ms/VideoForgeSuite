<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#0f172a;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}.g{position:relative;width:44vh;height:24vh;overflow:hidden}.g svg{width:100%;height:200%}.arc{fill:none;stroke:#1e293b;stroke-width:30;stroke-linecap:round}.val{fill:none;stroke:#34d399;stroke-width:30;stroke-linecap:round;stroke-dasharray:420;stroke-dashoffset:420;filter:drop-shadow(0 0 8px #34d399);animation:gm 3.4s ease-in-out infinite alternate}@keyframes gm{to{stroke-dashoffset:120}}.lb{position:absolute;bottom:0;width:100%;text-align:center;color:#34d399;font-size:3vw;font-weight:900}</style></head><body><div class="g"><svg viewBox="0 0 200 110"><path class="arc" d="M20 100 A80 80 0 0 1 180 100"/><path class="val" d="M20 100 A80 80 0 0 1 180 100"/></svg><div class="lb" id="v">0%</div></div><script>const v=document.getElementById("v");(function f(){const p=(performance.now()%3400)/3400,e=p<.5?p*2:1;v.textContent=Math.floor(e*73)+"%";requestAnimationFrame(f)})()</script></body></html>
