<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>面积图</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#101828;display:grid;place-items:center;padding:10vh}
.ar{width:64vw;height:50vh;position:relative;overflow:hidden;border-bottom:.3vh solid #334155}
.ar svg{position:absolute;inset:0;width:100%;height:100%}
.ar path.f{fill:url(#gr);animation:fu 4s steps(1) infinite;opacity:0}
.ar path.l{fill:none;stroke:#38bdf8;stroke-width:.5vh;stroke-dasharray:900;stroke-dashoffset:900;animation:ln 4s steps(40) infinite}
@keyframes fu{0%,20%{opacity:0}36%,80%{opacity:1}100%{opacity:0}}
@keyframes ln{0%{stroke-dashoffset:900}50%,86%{stroke-dashoffset:0}100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="ar"><svg viewBox="0 0 400 200" preserveAspectRatio="none"><defs><linearGradient id="gr" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#38bdf8" stop-opacity=".5"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></linearGradient></defs><path class="f" d="M0 160 L50 130 L100 140 L150 90 L200 100 L250 60 L300 70 L350 30 L400 40 L400 200 L0 200 Z"/><path class="l" d="M0 160 L50 130 L100 140 L150 90 L200 100 L250 60 L300 70 L350 30 L400 40"/></svg></div></div></body></html>
