<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>双轴对比</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#101828;display:grid;place-items:center}
.ch{position:relative;width:64vw;height:48vh;border-left:.3vh solid #334155;border-bottom:.3vh solid #334155;display:flex;align-items:flex-end;justify-content:space-around;padding:0 4vw}
.bar{width:4vh;background:#7c6cff;transform-origin:bottom;animation:bu 4s steps(20) infinite}
.bar2{width:4vh;background:#00e5ff88;margin-left:1vh;transform-origin:bottom;animation:bu 4s steps(20) .2s infinite}
.pr{position:absolute;inset:0;display:flex;align-items:center}
.pr svg{width:100%;height:100%}
.pr path{fill:none;stroke:#ffb300;stroke-width:.5vh;stroke-dasharray:600;stroke-dashoffset:600;animation:lp 4s steps(30) infinite}
@keyframes bu{0%{transform:scaleY(0)}38%,84%{transform:scaleY(1)}100%{opacity:0}}
@keyframes lp{0%{stroke-dashoffset:600}48%,86%{stroke-dashoffset:0}100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="ch"><div style="display:flex;gap:1vh;align-items:flex-end;height:60%"><div class="bar" style="height:100%"></div><div class="bar2" style="height:40%"></div></div><div style="display:flex;gap:1vh;align-items:flex-end;height:80%"><div class="bar" style="height:100%"></div><div class="bar2" style="height:64%"></div></div><div style="display:flex;gap:1vh;align-items:flex-end;height:44%"><div class="bar" style="height:100%"></div><div class="bar2" style="height:78%"></div></div><div class="pr"><svg viewBox="0 0 400 200" preserveAspectRatio="none"><path d="M20 150 L120 110 L220 130 L320 60 L390 40"/></svg></div></div></div></body></html>
