<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>甘特图</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b1020}
.bd{width:84vh}
.hd{display:flex;justify-content:space-between;color:#475569;font-size:1.9vh;padding:0 0 1.4vh 18vh;letter-spacing:.2em}
.row{display:flex;align-items:center;gap:1.4vh;margin-bottom:2vh}
.nm{width:16vh;text-align:right;color:#94a3b8;font-weight:700;font-size:2.4vh}
.trk{flex:1;height:3.6vh;position:relative}
.trk:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 calc(25% - 1px),#1e293b calc(25% - 1px) 25%)}
.tk{position:absolute;top:0;height:100%;border-radius:.8vh;background:linear-gradient(90deg,var(--c),#ffffff33);box-shadow:0 0 2vh var(--c);width:0;left:var(--s);animation:gw 5s cubic-bezier(.22,1,.36,1) infinite alternate;animation-delay:calc(var(--i)*.4s)}
@keyframes gw{0%{width:0}55%,80%{width:var(--w)}100%{width:calc(var(--w)*.55)}}
</style></head>
<body><div id="stage"><div class="bd"><div class="hd"><span>W1</span><span>W2</span><span>W3</span><span>W4</span></div><div class="row"><span class="nm">脚本</span><div class="trk"><div class="tk" style="--s:0%;--w:28%;--c:#22d3ee;--i:0"></div></div></div><div class="row"><span class="nm">分镜</span><div class="trk"><div class="tk" style="--s:18%;--w:30%;--c:#8b5cf6;--i:1"></div></div></div><div class="row"><span class="nm">配音</span><div class="trk"><div class="tk" style="--s:40%;--w:22%;--c:#f59e0b;--i:2"></div></div></div><div class="row"><span class="nm">剪辑</span><div class="trk"><div class="tk" style="--s:52%;--w:34%;--c:#34d399;--i:3"></div></div></div><div class="row"><span class="nm">发布</span><div class="trk"><div class="tk" style="--s:80%;--w:20%;--c:#fb7185;--i:4"></div></div></div></div></div></body></html>
