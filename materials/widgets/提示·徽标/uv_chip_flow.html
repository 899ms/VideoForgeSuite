<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#0f172a;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}.r{display:flex;flex-wrap:wrap;gap:1.4vw;justify-content:center;max-width:66vw}.c{padding:1.4vh 2vw;border-radius:999px;font-size:1.5vw;font-weight:600;color:#fff;background:var(--bg);animation:pp 2.8s ease-in-out infinite;animation-delay:var(--d)}@keyframes pp{0%,100%{transform:scale(1);filter:brightness(1)}50%{transform:scale(1.1);filter:brightness(1.35)}}</style></head><body><div class="r"><span class="c" style="--bg:#0891b2;--d:0.0s">React</span><span class="c" style="--bg:#059669;--d:0.18s">Vue</span><span class="c" style="--bg:#ea580c;--d:0.36s">Svelte</span><span class="c" style="--bg:#7c3aed;--d:0.54s">Solid</span><span class="c" style="--bg:#65a30d;--d:0.72s">Qwik</span><span class="c" style="--bg:#dc2626;--d:0.8999999999999999s">Angular</span><span class="c" style="--bg:#f59e0b;--d:1.08s">Lit</span><span class="c" style="--bg:#67e8f9;--d:1.26s">Preact</span></div><script></script></body></html>
