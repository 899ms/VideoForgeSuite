<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#fafafa;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}.w{position:relative;display:inline-block}.b{padding:2.2vh 4vw;border:0;border-radius:12px;background:#18181b;color:#fff;font-size:2vw;font-weight:600}.tp{position:absolute;bottom:120%;left:50%;transform:translateX(-50%) translateY(1.5vh);background:#18181b;color:#fff;padding:1.4vh 1.8vw;border-radius:10px;font-size:1.5vw;white-space:nowrap;opacity:0;animation:tp 3.2s ease-in-out infinite}.tp::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:0.9vh solid transparent;border-top-color:#18181b}@keyframes tp{0%,15%{opacity:0;transform:translateX(-50%) translateY(1.5vh)}25%,75%{opacity:1;transform:translateX(-50%) translateY(0)}85%,100%{opacity:0;transform:translateX(-50%) translateY(1.5vh)}}</style></head><body><div class="w"><button class="b">Hover me</button><span class="tp">👋 Hi, I am a tooltip!</span></div><script></script></body></html>
