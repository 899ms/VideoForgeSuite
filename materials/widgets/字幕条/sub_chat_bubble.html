<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>聊天气泡</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;gap:2vh;padding:0 8vh;background:linear-gradient(160deg,#0b1220,#0a0f1e)}
.bub{max-width:70%;padding:2.2vh 3vh;border-radius:2.4vh;font-size:2.9vh;line-height:1.5;color:var(--fg);background:var(--bg);opacity:0;transform:translateY(2.4vh) scale(.92);animation:pop .6s cubic-bezier(.34,1.56,.64,1) forwards;animation-delay:calc(var(--i)*1.2s + .3s);box-shadow:0 1vh 3vh #0008}
.l{align-self:flex-start;border-bottom-left-radius:.7vh}
.r{align-self:flex-end;border-bottom-right-radius:.7vh}
@keyframes pop{to{opacity:1;transform:none}}
</style></head>
<body><div id="stage"><div class="bub l" style="--i:0;--bg:#263048;--fg:#e2e8f0">在吗？看看刚生成的故事板</div><div class="bub r" style="--i:0.9;--bg:#3b82f6;--fg:#fff">来了来了，第 3 镜转场换成星形擦除</div><div class="bub l" style="--i:1.8;--bg:#263048;--fg:#e2e8f0">妙啊，配乐也换成了 8-bit</div><div class="bub r" style="--i:2.7;--bg:#3b82f6;--fg:#fff">那就这么定了，晚上出片 🎬</div></div></body></html>
