<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>星战爬升字幕</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;overflow:hidden;background:#000;perspective:46vh}
.stars{position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1.6px),radial-gradient(#fff8 1px,transparent 1.6px);background-size:14vh 14vh,9vh 9vh;background-position:0 0,4vh 6vh;opacity:.5}
.crawl{position:absolute;left:50%;bottom:-8%;width:90vh;transform-origin:50% 100%;transform:translateX(-50%) rotateX(58deg);color:#ffd166;font-size:4.6vh;font-weight:800;line-height:1.8;text-align:center;animation:up 14s linear infinite}
@keyframes up{from{bottom:-30%}to{bottom:120%}}
</style></head>
<body><div id="stage"><div class="stars"></div><div class="crawl">
很久以前，在遥远的银河系……<br><br>
素材军火库已经完成第 9 批扩充。<br>
两百多个特效整装待发，从翻牌时钟到
弹幕流，从蒸汽波到万花筒。<br><br>
这一次，没有任何重复的机制。
每一件武器，都独一无二。
</div></div></body></html>
