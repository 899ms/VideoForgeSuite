<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>聚光字幕</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#000;display:grid;place-items:center;overflow:hidden}
.lz{position:absolute;inset:-40%;background:radial-gradient(circle at 50% 52%,transparent 16vh,#000 34vh);animation:mv 5s ease-in-out infinite}
.tx{position:relative;font-size:6vh;font-weight:900;color:#fff;letter-spacing:.1em;animation:tx 5s ease-in-out infinite;opacity:0}
.tx b{color:#ffd54f}
@keyframes mv{50%{transform:translateX(-8%)}}
@keyframes tx{0%{opacity:0;transform:scale(.9)}14%,86%{opacity:1;transform:scale(1)}100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="lz"></div><div class="tx">重点只有<b>一句话</b></div></div></body></html>
