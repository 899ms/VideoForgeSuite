<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>弹幕流</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:linear-gradient(180deg,#0f172a,#020617)}
.dm{position:absolute;top:calc(var(--r)*16% + 4%);left:100%;color:var(--c);font-size:3.4vh;font-weight:700;white-space:nowrap;text-shadow:0 .2vh 1vh #000;animation:fly var(--d) linear infinite}
@keyframes fly{to{transform:translateX(-120vw)}}
</style></head>
<body><div id="stage"><span class="dm" style="--r:0;--d:8s;--c:#fff">前方高能！！</span><span class="dm" style="--r:1;--d:13s;--c:#7ef0ff">这效果绝了</span><span class="dm" style="--r:2;--d:10s;--c:#ffd166">666666</span><span class="dm" style="--r:3;--d:15s;--c:#fff">学到了学到了</span><span class="dm" style="--r:4;--d:11s;--c:#fb7185">收藏=学会</span><span class="dm" style="--r:5;--d:14s;--c:#fff">一键三连</span><span class="dm" style="--r:0;--d:17s;--c:#a5b4fc">AI 做的视频？</span><span class="dm" style="--r:2;--d:12s;--c:#fff">up主加油</span><span class="dm" style="--r:4;--d:9s;--c:#34d399">太顶了</span><span class="dm" style="--r:1;--d:16s;--c:#fff">循环播放中</span><span class="dm" style="--r:3;--d:10s;--c:#fbbf24">前排围观</span><span class="dm" style="--r:5;--d:13s;--c:#fff">next level</span></div></body></html>
