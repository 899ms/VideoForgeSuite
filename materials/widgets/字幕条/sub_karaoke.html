<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#09090b;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}.k{font-size:3.4vw;font-weight:800;color:#52525b;letter-spacing:.2vw}.k span{color:#22d3ee;animation:ka 2.8s linear infinite}@keyframes ka{from{color:#22d3ee}to{color:#52525b}}</style></head><body><div class="k" id="k"></div><script>const T="像专业剪辑师一样思考";document.getElementById("k").innerHTML=[...T].map((c,i)=>`<span style="animation-delay:${i*0.18}s">${c}</span>`).join("")</script></body></html>
