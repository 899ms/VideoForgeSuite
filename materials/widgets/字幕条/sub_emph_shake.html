<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>强调抖动字幕</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#101418;display:grid;place-items:center}
.tx{font-size:4.6vh;font-weight:900;color:#e8eaed;letter-spacing:.06em}
.tx b{display:inline-block;color:#ff5252;animation:sk 3.6s steps(1) infinite}
@keyframes sk{0%,42%{transform:none}46%{transform:translate(-.6vh,0) rotate(-2deg) scale(1.25)}50%{transform:translate(.6vh,-.4vh) rotate(2deg) scale(1.25)}54%{transform:translate(-.5vh,.3vh) rotate(-1deg) scale(1.25)}58%{transform:translate(.5vh,0) rotate(1deg) scale(1.25)}62%,88%{transform:scale(1.18)}100%{transform:none}}
</style></head>
<body><div id="stage"><div class="tx">这一步千万别 <b>跳过</b>，否则全白做</div></div></body></html>
