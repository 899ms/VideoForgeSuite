<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>地图雷达定位</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#07101d;overflow:hidden}
.grid{position:absolute;inset:-2%;background-image:linear-gradient(#1b3a5a55 1px,transparent 1px),linear-gradient(90deg,#1b3a5a55 1px,transparent 1px);background-size:8vh 8vh;transform:perspective(60vh) rotateX(24deg) scale(1.3)}
.roads{position:absolute;inset:0;opacity:.5}
.roads i{position:absolute;background:#2b527a;height:.5vh;border-radius:99vh}
.roads i:nth-child(1){left:-5%;top:30%;width:70%;transform:rotate(-9deg)}
.roads i:nth-child(2){left:30%;top:60%;width:80%;transform:rotate(6deg)}
.roads i:nth-child(3){left:12%;top:12%;width:.5vh;height:90%}
.sweep{position:absolute;left:34%;top:30%;width:44vh;height:44vh;margin:-22vh;border-radius:50%;background:conic-gradient(#22d3ee22,transparent 60deg);animation:rot 5s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.pin{position:absolute;width:2.2vh;height:2.2vh;border-radius:50%;background:var(--c);box-shadow:0 0 2.4vh var(--c)}
.pin:before{content:"";position:absolute;inset:-1.4vh;border-radius:50%;border:.3vh solid var(--c);opacity:0;animation:wave 2.4s ease-out infinite;animation-delay:calc(var(--i)*.6s)}
.pin:after{content:"";position:absolute;left:50%;top:100%;width:.3vh;height:3vh;background:linear-gradient(var(--c),transparent);transform:translateX(-50%)}
@keyframes wave{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(3.2)}}
</style></head>
<body><div id="stage"><div class="grid"></div><div class="roads"><i></i><i></i><i></i></div><div class="sweep"></div><span class="pin" style="left:30%;top:34%;--c:#22d3ee;--i:0"></span><span class="pin" style="left:58%;top:22%;--c:#f59e0b;--i:1"></span><span class="pin" style="left:44%;top:58%;--c:#34d399;--i:2"></span><span class="pin" style="left:66%;top:46%;--c:#fb7185;--i:3"></span></div></body></html>
