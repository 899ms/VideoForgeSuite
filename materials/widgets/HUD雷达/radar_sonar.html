<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#020617;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}.r{position:relative;width:50vh;height:50vh}.c{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(56,189,248,.5);animation:ex 3s ease-out infinite}.c:nth-child(2){animation-delay:1s}.c:nth-child(3){animation-delay:2s}@keyframes ex{from{transform:scale(.2);opacity:1}to{transform:scale(1.15);opacity:0}}.core{position:absolute;top:50%;left:50%;width:3vh;height:3vh;margin:-1.5vh;border-radius:50%;background:#38bdf8;box-shadow:0 0 22px #38bdf8}</style></head><body><div class="r"><div class="c"></div><div class="c"></div><div class="c"></div><div class="core"></div></div><script></script></body></html>
