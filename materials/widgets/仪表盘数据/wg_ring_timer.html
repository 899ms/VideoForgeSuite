<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>圆环倒计时</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0c1220}
.wrap{position:relative;width:42vh;height:42vh}
svg{transform:rotate(-90deg)}
.ring{fill:none;stroke:#1c2940;stroke-width:10}
.bar{fill:none;stroke:url(#gg);stroke-width:10;stroke-linecap:round;stroke-dasharray:565;animation:dn 8s linear infinite}
@keyframes dn{from{stroke-dashoffset:0}to{stroke-dashoffset:565}}
.num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13vh;font-weight:900;color:#7ef0ff;text-shadow:0 0 4vh #22d3ee88;font-variant-numeric:tabular-nums}
.lbl{position:absolute;bottom:2vh;width:100%;text-align:center;color:#5b7ba6;letter-spacing:.6em;font-size:2vh}
</style></head>
<body><div id="stage">
<div class="wrap"><svg viewBox="0 0 200 200"><defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs>
<circle class="ring" cx="100" cy="100" r="90"/><circle class="bar" cx="100" cy="100" r="90"/></svg>
<div class="num">10</div><div class="lbl">COUNTDOWN</div></div>
</div></body></html>
