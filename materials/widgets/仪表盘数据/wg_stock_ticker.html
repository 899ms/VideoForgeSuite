<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;gap:2.4vh;background:#0a0e14;padding:0 6vh;overflow:hidden}
.tk{display:flex;gap:6vh;white-space:nowrap;animation:mq 14s linear infinite;font-size:3.2vh;font-weight:700}
.tk.rev{animation-direction:reverse;animation-duration:17s}
.it b{color:#e8eefc;margin-right:1.6vh}
.up{color:#22c55e}.dn{color:#f43f5e}
@keyframes mq{to{transform:translateX(-50%)}}
</style></head>
