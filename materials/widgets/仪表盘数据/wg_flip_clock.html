<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>翻牌时钟</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:flex;gap:2vh;align-items:center;justify-content:center;background:radial-gradient(80% 80% at 50% 40%,#1d2438,#0b0e18)}
.card{width:14vh;height:19vh;position:relative;perspective:40vh}
.half{position:absolute;left:0;width:100%;height:9.5vh;overflow:hidden;background:linear-gradient(#2c3550,#1c2338);color:#eaf2ff;font-size:11vh;font-weight:800;display:flex;justify-content:center;line-height:19vh;border-radius:1vh .1;box-shadow:0 .6vh 2vh #000a}
.top{top:0;border-radius:1vh 1vh 0 0;border-bottom:.2vh solid #0b0e18}
.bot{bottom:0;line-height:0;border-radius:0 0 1vh 1vh}
.flip{position:absolute;left:0;top:0;width:100%;height:9.5vh;background:linear-gradient(#39456a,#2c3550);color:#eaf2ff;font-size:11vh;font-weight:800;display:flex;justify-content:center;line-height:19vh;border-radius:1vh 1vh 0 0;transform-origin:bottom;animation:fl 4s cubic-bezier(.6,0,.4,1) infinite;backface-visibility:hidden}
@keyframes fl{0%,14%{transform:rotateX(0)}26%,100%{transform:rotateX(-180deg)}}
.colon{color:#5b8cff;font-size:9vh;font-weight:900;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:.15}}
</style></head>
<body><div id="stage"><div class="card"><div class="half top">0</div><div class="half bot">0</div><div class="flip" style="animation-delay:0s"></div></div><div class="card"><div class="half top">8</div><div class="half bot">8</div><div class="flip" style="animation-delay:0s"></div></div><div class="colon">:</div><div class="card"><div class="half top">4</div><div class="half bot">4</div><div class="flip" style="animation-delay:1.1s"></div></div><div class="card"><div class="half top">2</div><div class="half bot">2</div><div class="flip" style="animation-delay:2.2s"></div></div><div class="colon">:</div><div class="card"><div class="half top">5</div><div class="half bot">5</div><div class="flip" style="animation-delay:3.3s"></div></div><div class="card"><div class="half top">9</div><div class="half bot">9</div><div class="flip" style="animation-delay:4.4s"></div></div></div></body></html>
