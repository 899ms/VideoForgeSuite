<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>直播人数</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;gap:3vh;background:radial-gradient(70% 70% at 50% 40%,#1c1024,#0b0710)}
.live{display:flex;align-items:center;gap:1.6vh;padding:1.6vh 3vh;border-radius:99vh;background:#f43f5e;color:#fff;font-size:3.4vh;font-weight:900;letter-spacing:.1em;animation:ld 1.6s ease-in-out infinite}
.live i{width:1.8vh;height:1.8vh;border-radius:50%;background:#fff;animation:bl 1s steps(1) infinite}
@keyframes ld{50%{box-shadow:0 0 0 1.2vh #f43f5e44}}
@keyframes bl{50%{opacity:.2}}
.cnt{font-size:9vh;font-weight:900;color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 0 4vh #f43f5e66}
.cnt:after{content:" 人正在看";font-size:3vh;font-weight:700;color:#c9a0d4;display:block;text-align:center}
</style></head>
<body><div id="stage"><div class="live"><i></i>LIVE</div><div class="cnt">12,847</div></div></body></html>
