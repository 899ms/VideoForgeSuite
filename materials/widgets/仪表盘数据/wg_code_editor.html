<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>代码编辑器</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0d1117}
.ed{width:74vh;background:#161b22;border:1px solid #30363d;border-radius:1.4vh;overflow:hidden;box-shadow:0 3vh 8vh #000c}
.hd{display:flex;gap:.8vh;padding:1.4vh 1.8vh;background:#1c2128}
.hd i{width:1.4vh;height:1.4vh;border-radius:50%}
.hd i:nth-child(1){background:#ff5f57}.hd i:nth-child(2){background:#febc2e}.hd i:nth-child(3){background:#28c840}
.bd{padding:2vh 0;font-family:Consolas,monospace;font-size:2.3vh;line-height:3.4vh}
.ln{opacity:0;transform:translateY(1.4vh);animation:rise .5s forwards;animation-delay:calc(var(--i)*.5s)}
.ln:nth-child(odd){background:#1b2129}
.no{display:inline-block;width:5vh;color:#484f58;text-align:right;padding-right:1.6vh;user-select:none}
.kw{color:#ff7b72}.fn{color:#d2a8ff}.st{color:#a5d6ff}.nm{color:#79c0ff}
.cur{display:inline-block;width:1.2vh;height:2.6vh;background:#58a6ff;vertical-align:middle;animation:bl 1s steps(1) infinite}
@keyframes rise{to{opacity:1;transform:none}}
@keyframes bl{50%{opacity:0}}
</style></head>
<body><div id="stage"><div class="ed"><div class="hd"><i></i><i></i><i></i></div><div class="bd"><div class="ln" style="--i:0"><span class="no">1</span><code><span class="kw">const</span> <span class="fn">render</span> = <span class="kw">async</span> () =&gt; {</code></div><div class="ln" style="--i:1"><span class="no">2</span><code>&nbsp;&nbsp;<span class="kw">const</span> scene = <span class="kw">await</span> <span class="fn">load</span>(<span class="st">"city.glb"</span>);</code></div><div class="ln" style="--i:2"><span class="no">3</span><code>&nbsp;&nbsp;scene.<span class="fn">traverse</span>(o =&gt; o.<span class="fn">glow</span>());</code></div><div class="ln" style="--i:3"><span class="no">4</span><code>&nbsp;&nbsp;<span class="kw">return</span> <span class="fn">composer</span>.<span class="fn">bloom</span>(scene, <span class="nm">0.8</span>);</code></div><div class="ln" style="--i:4"><span class="no">5</span><code>};</code></div><div class="ln" style="--i:5"><span class="no">6</span><code><span class="cur"></span></code></div></div></div></div></body></html>
