<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>九宫格抽奖</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#1a0a2e}
.gr{display:grid;grid-template-columns:repeat(3,13vh);gap:1.4vh}
.ce{height:13vh;border-radius:1.6vh;background:#2d1b4e;border:.4vh solid #4c1d95;display:grid;place-items:center;font-size:5vh;box-shadow:0 1vh 2.6vh #0006}
.ce.on{background:linear-gradient(150deg,#fbbf24,#d97706);border-color:#fde68a;box-shadow:0 0 3.6vh #fbbf24aa;transform:scale(1.08)}
.ce.go{background:linear-gradient(150deg,#e879f9,#a21caf);border-color:#f5d0fe;font-size:2.6vh;font-weight:900;color:#fff}
@keyframes noop{0%,100%{transform:none}}
</style></head>
<body><div id="stage"><div class="gr"><div class="ce " data-i="0">🎁</div><div class="ce " data-i="1">🏆</div><div class="ce " data-i="2">💎</div><div class="ce " data-i="3">🍀</div><div class="ce go" data-i="4">GO!</div><div class="ce " data-i="5">⚡</div><div class="ce " data-i="6">⭐</div><div class="ce " data-i="7">🎲</div><div class="ce " data-i="8">👑</div></div><style>@keyframes hit0{0,10.0%{box-shadow:none}10.6%,14.0%{background:linear-gradient(150deg,#fbbf24,#d97706);border-color:#fde68a;box-shadow:0 0 3.6vh #fbbf24aa;transform:scale(1.1)}15.0%{transform:none}} .ce[data-i="0"]{animation:hit0 5s linear infinite} @keyframes hit1{0,14.6%{box-shadow:none}15.2%,18.6%{background:linear-gradient(150deg,#fbbf24,#d97706);border-color:#fde68a;box-shadow:0 0 3.6vh #fbbf24aa;transform:scale(1.1)}19.6%{transform:none}} .ce[data-i="1"]{animation:hit1 5s linear infinite} @keyframes hit2{0,19.2%{box-shadow:none}19.8%,23.2%{background:linear-gradient(150deg,#fbbf24,#d97706);border-color:#fde68a;box-shadow:0 0 3.6vh #fbbf24aa;transform:scale(1.1)}24.2%{transform:none}} .ce[data-i="2"]{animation:hit2 5s linear infinite} @keyframes hit3{0,23.8%{box-shadow:none}24.4%,27.8%{background:linear-gradient(150deg,#fbbf24,#d97706);border-color:#fde68a;box-shadow:0 0 3.6vh #fbbf24aa;transform:scale(1.1)}28.8%{transform:none}} .ce[data-i="3"]{animation:hit3 5s linear infinite} @keyframes hit4{0,28.4%{box-shadow:none}29.0%,32.4%{background:linear-gradient(150deg,#fbbf24,#d97706);border-color:#fde68a;box-shadow:0 0 3.6vh #fbbf24aa;transform:scale(1.1)}33.4%{transform:none}} .ce[data-i="4"]{animation:hit4 5s linear infinite} @keyframes hit5{0,33.0%{box-shadow:none}33.6%,37.0%{background:linear-gradient(150deg,#fbbf24,#d97706);border-color:#fde68a;box-shadow:0 0 3.6vh #fbbf24aa;transform:scale(1.1)}38.0%{transform:none}} .ce[data-i="5"]{animation:hit5 5s linear infinite} @keyframes hit6{0,37.6%{box-shadow:none}38.2%,41.6%{background:linear-gradient(150deg,#fbbf24,#d97706);border-color:#fde68a;box-shadow:0 0 3.6vh #fbbf24aa;transform:scale(1.1)}42.6%{transform:none}} .ce[data-i="6"]{animation:hit6 5s linear infinite} @keyframes hit7{0,42.2%{box-shadow:none}42.8%,46.2%{background:linear-gradient(150deg,#fbbf24,#d97706);border-color:#fde68a;box-shadow:0 0 3.6vh #fbbf24aa;transform:scale(1.1)}47.2%{transform:none}} .ce[data-i="7"]{animation:hit7 5s linear infinite} @keyframes hit8{0,46.8%{box-shadow:none}47.4%,50.8%{background:linear-gradient(150deg,#fbbf24,#d97706);border-color:#fde68a;box-shadow:0 0 3.6vh #fbbf24aa;transform:scale(1.1)}51.8%{transform:none}} .ce[data-i="8"]{animation:hit8 5s linear infinite} </style></div></body></html>
