<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>扭蛋机</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(160deg,#fdf2f8,#fce7f3 55%,#fbcfe8);gap:0}
.mc{position:relative;width:22vh;height:34vh;display:grid;justify-items:center;animation:sh 4.4s ease-in-out infinite}
.gl{width:16vh;height:16vh;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fff9,transparent 42%),linear-gradient(160deg,#f9a8d4,#ec4899);border:.8vh solid #fff;box-shadow:0 1.4vh 4vh #ec489955,inset 0 -1vh 2vh #be185d55;overflow:hidden}
.gl i{position:absolute;width:7.6vh;height:7.6vh;border-radius:50%;background:radial-gradient(circle at 32% 28%,#ffffffcc,#f472b6 60%);box-shadow:0 .6vh 1.6vh #9d174d66;animation:bl 1.6s ease-in-out infinite alternate}
@keyframes bl{to{transform:translate(2.4vh,1.8vh)}}
.dl{width:7vh;height:9vh;background:linear-gradient(#fbcfe8,#f472b6);border-radius:0 0 3vh 3vh;margin-top:-1.2vh;border:.5vh solid #fff}
.eg{position:absolute;bottom:-3vh;width:5.4vh;height:5.4vh;border-radius:50%;background:radial-gradient(circle at 32% 28%,#fff,#fbbf24 65%);box-shadow:0 .8vh 2vh #b4530955;opacity:0;animation:eg 4.4s ease-in infinite}
@keyframes sh{0%,28%{transform:rotate(0)}34%{transform:rotate(-7deg)}40%{transform:rotate(7deg)}46%{transform:rotate(-5deg)}52%{transform:rotate(0)}}
@keyframes eg{0%,55%{transform:translateY(-16vh) scale(.8);opacity:0}62%{opacity:1}80%,96%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(6vh);opacity:0}}
</style></head>
<body><div id="stage"><div class="mc"><div class="gl"><i style="left:1.4vh;top:2vh"></i><i style="left:6.4vh;top:5.4vh;animation-delay:.5s;background:radial-gradient(circle at 32% 28%,#fff,#a78bfa 65%)"></i><i style="left:3vh;top:7.6vh;animation-delay:1s;background:radial-gradient(circle at 32% 28%,#fff,#34d399 65%)"></i></div><div class="dl"></div><div class="eg"></div></div></div></body></html>
