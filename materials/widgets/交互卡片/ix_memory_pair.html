<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>翻牌配对</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#0c1220}
.gr{display:grid;grid-template-columns:repeat(4,10vh);gap:1.4vh}
.cr{position:relative;height:13vh;perspective:50vh;animation:fv 5.2s ease-out infinite;transform-style:preserve-3d}
.cr .a,.cr .b{position:absolute;inset:0;border-radius:1.2vh;display:grid;place-items:center;backface-visibility:hidden;box-shadow:0 .8vh 2vh #0006}
.cr .a{background:repeating-linear-gradient(45deg,#312e81 0 2.2vh,#4338ca 2.2vh 4.4vh);border:.3vh solid #475569}
.cr .b{background:linear-gradient(150deg,#f8fafc,#cbd5e1);transform:rotateY(180deg);font-size:4.4vh}
@keyframes fv{0%,26%{transform:rotateY(0)}32%,78%{transform:rotateY(180deg)}86%,100%{transform:rotateY(0)}}
</style></head>
<body><div id="stage"><div class="gr"><div class="cr" style="animation-delay:0s"><div class="a"></div><div class="b">🍜</div></div><div class="cr" style="animation-delay:0.15s"><div class="a"></div><div class="b">🍜</div></div><div class="cr" style="animation-delay:0.3s"><div class="a"></div><div class="b">🚀</div></div><div class="cr" style="animation-delay:0.45s"><div class="a"></div><div class="b">🚀</div></div><div class="cr" style="animation-delay:0.6s"><div class="a"></div><div class="b">🌸</div></div><div class="cr" style="animation-delay:0.75s"><div class="a"></div><div class="b">🌸</div></div><div class="cr" style="animation-delay:0.9s"><div class="a"></div><div class="b">⚡</div></div><div class="cr" style="animation-delay:1.05s"><div class="a"></div><div class="b">⚡</div></div></div></div></body></html>
