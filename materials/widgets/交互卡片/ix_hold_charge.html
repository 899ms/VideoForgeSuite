<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>长按蓄力</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#08080e}
.wr{position:relative;width:24vh;height:24vh;display:grid;place-items:center}
.rg{position:absolute;inset:0;border-radius:50%%;background:conic-gradient(#22d3ee var(--p,0%%),#1e293b 0);-webkit-mask:radial-gradient(circle,transparent 62%%,#000 63%%);mask:radial-gradient(circle,transparent 62%%,#000 63%%);animation:ch 3.8s ease-in-out infinite}
@property --p{syntax:'<percentage>';initial-value:0%%;inherits:false}
@keyframes ch{0%%,18%%{--p:0%%}58%%,78%%{--p:100%%}100%%{--p:0%%}}
.ic{font-size:7vh;filter:drop-shadow(0 0 2vh #22d3ee66);animation:ic 3.8s steps(1) infinite}
@keyframes ic{0%%,55%%{transform:scale(1)}62%%,80%%{transform:scale(1.22)}100%%{transform:scale(1)}}
.pc{position:absolute;bottom:-6vh;color:#22d3ee;font-family:monospace;font-size:2.8vh;font-weight:800}
</style></head>
<body><div id="stage"><div class="wr"><div class="rg"></div><span class="ic">🔥</span><span class="pc">蓄力 100%%</span></div></div></body></html>
