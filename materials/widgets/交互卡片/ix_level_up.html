<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>LV UP</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(55% 55% at 50% 50%,#064e3b,#01120c);overflow:hidden}
.lv{text-align:center;animation:lv 4.2s cubic-bezier(.2,1.3,.4,1) infinite;position:relative;z-index:2}
.lv .t{font-size:11vh;font-weight:900;font-style:italic;background:linear-gradient(180deg,#a7f3d0,#10b981 60%,#047857);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 2.4vh #10b98177)}
.lv .s{color:#6ee7b7;font-size:3vh;letter-spacing:.4em;margin-top:1vh}
.ring{position:absolute;width:20vh;height:20vh;border-radius:50%;border:.6vh solid #34d399;opacity:0;animation:rg 4.2s ease-out infinite}
@keyframes lv{0%,10%{transform:scale(.4);opacity:0}22%,82%{transform:scale(1);opacity:1}30%{transform:scale(1.12)}36%{transform:scale(1)}94%,100%{opacity:0}}
@keyframes rg{0%,20%{transform:scale(.3);opacity:1}55%,100%{transform:scale(3.4);opacity:0}}
</style></head>
<body><div id="stage"><div class="ring" style="left:calc(50% - 10vh);top:calc(50% - 10vh)"></div><div class="ring" style="left:calc(50% - 10vh);top:calc(50% - 10vh);animation-delay:.25s"></div><div class="lv"><div class="t">LV.12</div><div class="s">LEVEL UP !</div></div></div></body></html>
