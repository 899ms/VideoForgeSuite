<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>保底天井</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#0a0814}
.wr{display:grid;gap:2vh;justify-items:center}
.ba{width:52vh;height:4.6vh;border-radius:99vh;background:#1e1b31;overflow:hidden;border:.3vh solid #4c1d95}
.fl2{height:100%;border-radius:99vh;background:linear-gradient(90deg,#7c3aed,#e879f9);box-shadow:0 0 2.4vh #a855f7;animation:fl 4.8s cubic-bezier(.3,.9,.3,1) infinite}
@keyframes fl{0%,12%{width:3%}55%,86%{width:94%}100%{width:3%}}
.tx{color:#c4b5fd;font-size:2.8vh;font-weight:700;letter-spacing:.1em}
.tx b{color:#fbbf24;font-size:3.6vh;font-family:monospace}
.gp{color:#fbbf24;font-size:2.4vh;letter-spacing:.3em;animation:gp 1.2s steps(1) infinite}
@keyframes gp{50%{opacity:.25}}
</style></head>
<body><div id="stage"><div class="wr"><div class="ba"><div class="fl2"></div></div><div class="tx">距离保底还剩 <b>8</b> 抽</div><div class="gp">★ UP 角色 待命中 ★</div></div></div></body></html>
