<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>卡组洗牌</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#0c0a18}
.st{position:relative;width:18vh;height:25vh}
.st i{position:absolute;inset:0;border-radius:1.4vh;background:repeating-linear-gradient(45deg,#312e81 0 2.2vh,#4338ca 2.2vh 4.4vh);border:.4vh solid #818cf8;box-shadow:0 1.2vh 3vh #0007}
.st i:nth-child(1){animation:s1 3.6s ease-in-out infinite}
.st i:nth-child(2){animation:s2 3.6s ease-in-out infinite}
.st i:nth-child(3){animation:s3 3.6s ease-in-out infinite}
@keyframes s1{0%,100%{transform:translate(0,0) rotate(0)}25%{transform:translate(-9vh,-2vh) rotate(-14deg)}50%{transform:translate(-9vh,-2vh) rotate(-14deg)}}
@keyframes s2{0%,100%{transform:translate(0,0) rotate(0)}45%{transform:translate(9vh,2vh) rotate(12deg)}70%{transform:translate(9vh,2vh) rotate(12deg)}}
@keyframes s3{0%,100%{transform:translate(0,0) rotate(0)}55%{transform:translate(0,0) rotate(0)}}
</style></head>
<body><div id="stage"><div class="st"><i></i><i></i><i></i></div></div></body></html>
