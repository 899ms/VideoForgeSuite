<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>UR卡揭晓</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(65% 60% at 50% 45%,#3b0764,#05010f);overflow:hidden}
.ck{width:24vh;height:33vh;border-radius:2vh;position:relative;background:linear-gradient(160deg,#f0abfc,#a21caf 55%,#4a044e);border:.5vh solid #f5d0fe;box-shadow:0 0 8vh #d946ef99,inset 0 0 3vh #fff8;display:grid;place-items:center;color:#fff;font-weight:900;font-size:4.6vh;text-shadow:0 .4vh 1.6vh #0008;animation:up 4.6s cubic-bezier(.2,1.2,.4,1) infinite;z-index:2}
.ck small{position:absolute;bottom:1.6vh;font-size:2vh;letter-spacing:.4em;color:#f5d0fe}
.rays{position:absolute;width:120vh;height:120vh;background:repeating-conic-gradient(from 0deg,#e879f922 0 9deg,transparent 9deg 18deg);border-radius:50%;animation:rt 14s linear infinite;mask:radial-gradient(circle,#000 30%,transparent 68%);-webkit-mask:radial-gradient(circle,#000 30%,transparent 68%)}
@keyframes rt{to{transform:rotate(360deg)}}
@keyframes up{0%{transform:translateY(24vh) scale(.6) rotate(-6deg);opacity:0}22%,88%{transform:none;opacity:1}100%{transform:scale(1.1);opacity:0}}
.fl{position:absolute;width:1vh;height:1vh;border-radius:50%;background:#f0abfc;box-shadow:0 0 1.2vh #e879f9;animation:fs 2.6s linear infinite}
@keyframes fs{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-52vh);opacity:0}}
</style></head>
<body><div id="stage"><div class="rays"></div><i class="fl" style="left:5%;bottom:12vh;animation-delay:0.0s"></i><i class="fl" style="left:34%;bottom:12vh;animation-delay:0.5s"></i><i class="fl" style="left:63%;bottom:12vh;animation-delay:1.0s"></i><i class="fl" style="left:92%;bottom:12vh;animation-delay:1.5s"></i><i class="fl" style="left:31%;bottom:12vh;animation-delay:2.0s"></i><i class="fl" style="left:60%;bottom:12vh;animation-delay:2.5s"></i><i class="fl" style="left:89%;bottom:12vh;animation-delay:0.3999999999999999s"></i><i class="fl" style="left:28%;bottom:12vh;animation-delay:0.8999999999999999s"></i><i class="fl" style="left:57%;bottom:12vh;animation-delay:1.4s"></i><i class="fl" style="left:86%;bottom:12vh;animation-delay:1.9s"></i><i class="fl" style="left:25%;bottom:12vh;animation-delay:2.4s"></i><div class="ck">UR<small>◆ 月下咏叹 ◆</small></div></div></body></html>
