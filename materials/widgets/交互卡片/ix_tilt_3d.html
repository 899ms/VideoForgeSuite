<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>3D倾斜卡</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#101018;perspective:90vh}
.tl{width:28vh;height:38vh;border-radius:2.2vh;position:relative;transform-style:preserve-3d;animation:tl 6s ease-in-out infinite;background:linear-gradient(150deg,#312e81,#1e1b4b);box-shadow:-2vh 3vh 6vh #0009;border:.3vh solid #4f46e5}
.tl .g{position:absolute;inset:0;border-radius:2.2vh;background:radial-gradient(circle at var(--mx,60%%) var(--my,30%%),#818cf866,transparent 55%%)}
.tl .m{position:absolute;inset:0;display:grid;place-items:center;font-size:9vh;transform:translateZ(6vh)}
.tl .n{position:absolute;left:2vh;bottom:1.6vh;color:#c7d2fe;font-weight:900;letter-spacing:.15em;transform:translateZ(4vh);font-size:2.6vh}
@keyframes tl{0%%,100%%{transform:rotateY(-16deg) rotateX(6deg)}25%%{transform:rotateY(10deg) rotateX(-4deg)}50%%{transform:rotateY(16deg) rotateX(8deg)}75%%{transform:rotateY(-8deg) rotateX(-6deg)}}
</style></head>
<body><div id="stage"><div class="tl"><div class="g"></div><div class="m">🐉</div><div class="n">PARALLAX · 03</div></div></div></body></html>
