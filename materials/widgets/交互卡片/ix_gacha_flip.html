<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>抽卡翻牌</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(70% 70% at 50% 38%,#221c4d,#0a081c)}
.dk{position:relative;width:20vh;height:28vh;perspective:80vh;animation:fl 4.2s cubic-bezier(.3,1.2,.4,1) infinite;transform-style:preserve-3d}
.face{position:absolute;inset:0;border-radius:1.6vh;backface-visibility:hidden;box-shadow:0 2vh 5vh #0009;display:grid;place-items:center;color:#fff;font-weight:900;font-size:3.4vh}
.bk{background:repeating-linear-gradient(45deg,#312e81 0 2.2vh,#4338ca 2.2vh 4.4vh);border:.5vh solid #818cf8}
.bk:after{content:"✦";font-size:7vh;color:#c7d2fe}
.fr{background:linear-gradient(150deg,#fbbf24,#d97706);transform:rotateY(180deg);color:#4c1d95;flex-direction:column;gap:1vh}
.fr small{font-size:2vh;letter-spacing:.3em}
@keyframes fl{0%,22%{transform:rotateY(0) translateX(0)}38%,72%{transform:rotateY(180deg) translateX(0)}86%,100%{transform:rotateY(180deg) translateX(60vw);opacity:0}}
</style></head>
<body><div id="stage"><div class="dk"><div class="face bk"></div><div class="face fr">SSR<small>★ 夏夜流火 ★</small></div></div></div></body></html>
