<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>成就解锁</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#0d1321;align-content:center;gap:2vh}
.to{display:flex;align-items:center;gap:2.4vh;padding:2.4vh 4vh;border-radius:1.8vh;background:linear-gradient(120deg,#1e293b,#0f172a);border:.3vh solid #f59e0b66;box-shadow:0 2vh 6vh #000a,0 0 3vh #f59e0b33;animation:si 4.8s cubic-bezier(.2,1.1,.3,1) infinite}
.bd2{width:9vh;height:9vh;border-radius:50%;background:radial-gradient(circle at 34% 30%,#fde68a,#d97706);display:grid;place-items:center;font-size:4.6vh;box-shadow:0 0 2.6vh #f59e0b88;animation:bd 4.8s ease infinite}
.tt2{color:#fbbf24;font-size:2.2vh;letter-spacing:.3em;font-weight:800}
.nm{color:#f1f5f9;font-size:3vh;font-weight:900;margin-top:.6vh}
@keyframes si{0%{transform:translateX(50vw);opacity:0}12%,84%{transform:none;opacity:1}94%,100%{transform:translateX(-50vw);opacity:0}}
@keyframes bd{0%,12%{transform:rotate(-180deg) scale(.4)}22%,84%{transform:none}94%,100%{transform:scale(.6);opacity:0}}
</style></head>
<body><div id="stage"><div class="to"><div class="bd2">🏅</div><div><div class="tt2">ACHIEVEMENT</div><div class="nm">初出茅庐 · 首战告捷</div></div></div></div></body></html>
