<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>签到打卡</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(150deg,#111827,#1f2937)}
.cl{display:grid;grid-template-columns:repeat(7,6.4vh);gap:1.2vh}
.dy{height:6.4vh;border-radius:1.2vh;background:#111827;border:.3vh solid #374151;display:grid;place-items:center;color:#6b7280;font-size:2vh;font-weight:700}
.dy.h{background:linear-gradient(150deg,#f59e0b,#d97706);border-color:#fbbf24;color:#fff;box-shadow:0 0 1.6vh #f59e0b66;animation:pt 4.2s steps(1) infinite}
.dy.t{border-color:#fbbf24;color:#fbbf24;animation:ps 4.2s steps(1) infinite}
@keyframes pt{0%,88%{transform:none}94%,100%{transform:none}}
@keyframes ps{0%,84%{box-shadow:none;border-color:#374151;color:#6b7280}90%,100%{box-shadow:0 0 2vh #fbbf2488;border-color:#fbbf24;color:#fbbf24;transform:scale(1.1)}}
</style></head>
<body><div id="stage"><div class="cl"><div class="dy h">1</div><div class="dy h">2</div><div class="dy h">3</div><div class="dy h">4</div><div class="dy h">5</div><div class="dy h">6</div><div class="dy h">7</div><div class="dy t">8</div><div class="dy">9</div><div class="dy">10</div><div class="dy">11</div><div class="dy">12</div><div class="dy">13</div><div class="dy">14</div><div class="dy">15</div><div class="dy">16</div><div class="dy">17</div><div class="dy">18</div><div class="dy">19</div><div class="dy">20</div><div class="dy">21</div><div class="dy">22</div><div class="dy">23</div><div class="dy">24</div><div class="dy">25</div><div class="dy">26</div><div class="dy">27</div><div class="dy">28</div></div></div></body></html>
