<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>SSR光柱</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(60% 50% at 50% 60%,#1e1b4b,#050310);overflow:hidden}
.bm{position:absolute;bottom:14vh;width:14vh;height:80vh;background:linear-gradient(to top,#fbbf24cc,#fbbf2400 78%);clip-path:polygon(38%% 0,62%% 0,100%% 100%%,0 100%%);filter:blur(.6vh);animation:bm 4.4s ease-out infinite;transform-origin:bottom}
.bd{position:relative;width:18vh;height:25vh;border-radius:1.6vh;background:linear-gradient(160deg,#fef3c7,#f59e0b 55%,#b45309);border:.5vh solid #fde68a;box-shadow:0 0 6vh #fbbf2488,inset 0 0 3vh #fff7;display:grid;place-items:center;color:#78350f;font-weight:900;font-size:4vh;animation:cd 4.4s ease-out infinite;z-index:2}
.pt{position:absolute;width:1.4vh;height:1.4vh;border-radius:50%;background:#fde68a;bottom:26vh;animation:pt 2.4s linear infinite;box-shadow:0 0 1.4vh #fbbf24}
@keyframes bm{0%%,14%%{opacity:0;transform:scaleY(.2)}34%%,84%%{opacity:1;transform:scaleY(1)}100%%{opacity:0}}
@keyframes cd{0%%,14%%{transform:translateY(30vh) scale(.7);opacity:0}36%%,84%%{transform:none;opacity:1}100%%{opacity:0}}
@keyframes pt{to{transform:translateY(-46vh);opacity:0}}
</style></head>
<body><div id="stage"><div class="bm"></div><i class="pt" style="left:10%;animation-delay:0.0s"></i><i class="pt" style="left:33%;animation-delay:0.4s"></i><i class="pt" style="left:56%;animation-delay:0.8s"></i><i class="pt" style="left:79%;animation-delay:1.2000000000000002s"></i><i class="pt" style="left:22%;animation-delay:1.6s"></i><i class="pt" style="left:45%;animation-delay:2.0s"></i><i class="pt" style="left:68%;animation-delay:4.440892098500626e-16s"></i><i class="pt" style="left:11%;animation-delay:0.40000000000000036s"></i><i class="pt" style="left:34%;animation-delay:0.8000000000000003s"></i><div class="bd">SSR</div></div></body></html>
