<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>技能冷却</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#09090f;gap:0}
.sk{position:relative;width:20vh;height:20vh;border-radius:50%;background:linear-gradient(150deg,#1e3a5f,#0c1a2e);border:.5vh solid #38bdf8;box-shadow:0 0 3vh #38bdf855;display:grid;place-items:center;font-size:7vh}
.cd{position:absolute;inset:-.5vh;border-radius:50%;background:conic-gradient(#000000b3 var(--c,0%),transparent 0);animation:cd 4s linear infinite}
@property --c{syntax:'<percentage>';initial-value:0%;inherits:false}
@keyframes cd{0%{--c:100%}72%,100%{--c:0%}}
.tm{position:absolute;color:#7dd3fc;font-family:monospace;font-size:2.6vh;font-weight:800;animation:tm 4s steps(1) infinite;text-shadow:0 .3vh 1vh #000;opacity:0}
@keyframes tm{0%,72%{opacity:0}78%,96%{opacity:1}100%{opacity:0}}
.ic{animation:ic 4s steps(1) infinite;filter:drop-shadow(0 0 1.6vh #38bdf888)}
@keyframes ic{0%,70%{filter:grayscale(.9) brightness(.6)}75%,100%{filter:none;transform:scale(1.15)}}
</style></head>
<body><div id="stage"><div class="sk"><div class="ic">❄️</div><div class="cd"></div><span class="tm">READY</span></div></div></body></html>
