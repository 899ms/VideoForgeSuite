<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>反应堆核心</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#05070c;display:grid;place-items:center}
.rx{position:relative;width:44vh;height:44vh}
.ring{position:absolute;inset:0;border-radius:50%;border:.4vh solid transparent;border-top-color:#4dd0e1;border-bottom-color:#4dd0e1;animation:sp 3s linear infinite}
.ring.r2{inset:10%;border-top-color:#ffd166;border-bottom-color:#ffd166;animation:sp 2s linear infinite reverse}
.ring.r3{inset:20%;border-left-color:#ff5252;border-right-color:#ff5252;animation:sp 1.4s linear infinite}
.core{position:absolute;inset:34%;border-radius:50%;background:radial-gradient(circle,#b2ebf2,#00acc1 60%,#006064);box-shadow:0 0 6vh #00acc1aa;animation:pu 1.6s ease-in-out infinite}
.rd{position:absolute;right:-8vh;top:50%;transform:translateY(-50%);color:#4dd0e1;font-family:monospace;font-size:2.8vh}
@keyframes sp{to{transform:rotate(1turn)}}
@keyframes pu{50%{box-shadow:0 0 9vh #00acc1}}
</style></head>
<body><div id="stage"><div class="rx"><div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div><div class="core"></div></div><div class="rd">OUTPUT<br>98.4 TW</div></div></body></html>
