<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>六边形护盾</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#020a14;display:grid;place-items:center}
.sh{display:grid;grid-template-columns:repeat(7,10vh);gap:.4vh;animation:fl 4s ease-in-out infinite}
.hx{aspect-ratio:1;clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);background:#22d3ee14;border:0;animation:tw 2.4s steps(1) infinite}
@keyframes tw{0%,70%{background:#22d3ee14}75%,85%{background:#22d3ee66}90%,100%{background:#22d3ee14}}
@keyframes fl{50%{transform:scale(1.04)}}
</style></head>
<body><div id="stage"><div class="sh"><div class="hx" style="animation-delay:0.0s"></div><div class="hx" style="animation-delay:1.56s"></div><div class="hx" style="animation-delay:0.84s"></div><div class="hx" style="animation-delay:0.12s"></div><div class="hx" style="animation-delay:1.68s"></div><div class="hx" style="animation-delay:0.96s"></div><div class="hx" style="animation-delay:0.24s"></div><div class="hx" style="animation-delay:1.7999999999999998s"></div><div class="hx" style="animation-delay:1.08s"></div><div class="hx" style="animation-delay:0.36s"></div><div class="hx" style="animation-delay:1.92s"></div><div class="hx" style="animation-delay:1.2s"></div><div class="hx" style="animation-delay:0.48s"></div><div class="hx" style="animation-delay:2.04s"></div><div class="hx" style="animation-delay:1.3199999999999998s"></div><div class="hx" style="animation-delay:0.6s"></div><div class="hx" style="animation-delay:2.16s"></div><div class="hx" style="animation-delay:1.44s"></div><div class="hx" style="animation-delay:0.72s"></div><div class="hx" style="animation-delay:0.0s"></div><div class="hx" style="animation-delay:1.56s"></div><div class="hx" style="animation-delay:0.84s"></div><div class="hx" style="animation-delay:0.12s"></div><div class="hx" style="animation-delay:1.68s"></div><div class="hx" style="animation-delay:0.96s"></div><div class="hx" style="animation-delay:0.24s"></div><div class="hx" style="animation-delay:1.7999999999999998s"></div><div class="hx" style="animation-delay:1.08s"></div><div class="hx" style="animation-delay:0.36s"></div><div class="hx" style="animation-delay:1.92s"></div><div class="hx" style="animation-delay:1.2s"></div><div class="hx" style="animation-delay:0.48s"></div><div class="hx" style="animation-delay:2.04s"></div><div class="hx" style="animation-delay:1.3199999999999998s"></div><div class="hx" style="animation-delay:0.6s"></div></div></div></body></html>
