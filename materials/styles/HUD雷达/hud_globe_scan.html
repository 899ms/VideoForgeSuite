<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>全球扫描</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#050a12;display:grid;place-items:center;overflow:hidden}
.gl{width:60vh;height:60vh;border-radius:50%;border:.3vh solid #22d3ee44;position:relative;overflow:hidden;background:radial-gradient(circle at 34% 30%,#0e3550,#041018 70%)}
.gl:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#22d3ee22 0 .2vh,transparent .2vh 10%),repeating-linear-gradient(90deg,#22d3ee22 0 .2vh,transparent .2vh 10%);border-radius:50%;animation:rt 12s linear infinite}
.sw{position:absolute;left:0;right:0;height:34%;top:-34%;background:linear-gradient(#22d3ee00,#22d3ee44 70%,#22d3ee00);animation:sc 3.4s linear infinite}
.pi{position:absolute;width:1.4vh;height:1.4vh;border-radius:50%;background:#ff5252;box-shadow:0 0 1.6vh #ff5252;animation:pp 3.4s steps(1) infinite}
@keyframes rt{to{background-position:0 -60vh,60vh 0}}
@keyframes sc{to{top:110%}}
@keyframes pp{0%,42%{opacity:0}50%,86%{opacity:1}100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="gl"><div class="sw"></div><div class="pi" style="left:30%;top:38%"></div><div class="pi" style="left:64%;top:56%;animation-delay:.6s"></div></div></div></body></html>
