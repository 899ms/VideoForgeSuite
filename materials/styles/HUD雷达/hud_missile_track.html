<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>弹道追踪</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#0a0d12;display:grid;place-items:center;overflow:hidden;font-family:monospace}
.tr{position:absolute;left:20%;bottom:24%;width:2vh;height:2vh;border-radius:50%;background:#ff5252;box-shadow:0 0 3vh #ff5252;animation:fl 3.4s cubic-bezier(.2,.9,.4,1) infinite}
.tr:after{content:"";position:absolute;inset:0;border-radius:50%;background:#ff5252;filter:blur(2vh)}
.ln{position:absolute;left:20%;bottom:24%;width:52vw;height:.3vh;background:linear-gradient(90deg,#ff525266,#ff525200);transform-origin:left;transform:rotate(-26deg);animation:ln 3.4s steps(1) infinite}
.tg{position:absolute;right:16%;top:22%;color:#ff8a80;font-size:2.4vh;border:.2vh solid #ff5252;border-radius:.6vh;padding:.8vh 1.4vh;opacity:0;animation:tg 3.4s steps(1) infinite}
@keyframes fl{0%{transform:translate(0,0)}70%,90%{transform:translate(46vw,-24vh)}100%{opacity:0}}
@keyframes ln{0%{opacity:0}20%,60%{opacity:1}100%{opacity:0}}
@keyframes tg{0%,64%{opacity:0}72%,90%{opacity:1}100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="ln"></div><div class="tr"></div><div class="tg">HIT T+3.4s</div></div></body></html>
