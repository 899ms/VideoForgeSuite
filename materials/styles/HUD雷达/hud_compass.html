<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>罗盘导航</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#070b12;display:grid;place-items:center}
.cp{width:46vh;height:46vh;border-radius:50%;border:.3vh solid #ffb30055;position:relative;animation:sw 5s cubic-bezier(.6,0,.4,1) infinite}
.cp:before{content:"N";position:absolute;left:50%;top:-2vh;transform:translateX(-50%);color:#ffb300;font-size:3vh;font-weight:900}
.t1{position:absolute;inset:0;animation:sp 5s cubic-bezier(.6,0,.4,1) infinite}
.t1:before{content:"";position:absolute;left:50%;top:6%;transform:translateX(-50%);border-left:1.4vh solid transparent;border-right:1.4vh solid transparent;border-bottom:7vh solid #ff5252}
.nd{position:absolute;left:50%;top:50%;width:2vh;height:2vh;border-radius:50%;background:#ffb300;transform:translate(-50%,-50%);box-shadow:0 0 2vh #ffb300}
.deg{position:absolute;bottom:-6vh;width:max-content;left:50%;transform:translateX(-50%);color:#ffb300;font-family:monospace;font-size:3vh}
@keyframes sp{0%{transform:rotate(0)}60%,100%{transform:rotate(146deg)}}
@keyframes sw{0%{transform:rotate(0)}60%,100%{transform:rotate(-146deg)}}
</style></head>
<body><div id="stage"><div class="cp"><div class="t1"></div><div class="nd"></div></div><div class="deg">HEADING 146°</div></div></body></html>
