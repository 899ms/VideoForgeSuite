<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>片盘旋转</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#0e0e12;display:grid;place-items:center}
.pj{display:flex;align-items:center;gap:3vh}
.rl{position:relative;width:18vh;height:18vh;border-radius:50%;border:1.2vh solid #444a52;background:radial-gradient(circle,#22262c 34%,#0e0e12 36%);animation:sp 2.6s linear infinite}
.rl:before{content:"";position:absolute;inset:34%;border-radius:50%;background:#5c6672}
.rl:after{content:"";position:absolute;inset:40%;border-radius:50%;background:#22262c}
.rl i{position:absolute;left:50%;top:6%;width:.9vh;height:2.4vh;background:#444a52;transform-origin:.45vh 8.1vh}
@keyframes sp{to{transform:rotate(360deg)}}
.pl{width:5vh;height:5vh;border-radius:50%;background:radial-gradient(circle at 35% 35%,#8d949e,#3c424a);box-shadow:0 0 2vh #000}
</style></head>
<body><div id="stage"><div class="pj"><div class="rl"><i style="transform:rotate(0deg)"></i><i style="transform:rotate(45deg)"></i><i style="transform:rotate(90deg)"></i><i style="transform:rotate(135deg)"></i><i style="transform:rotate(180deg)"></i><i style="transform:rotate(225deg)"></i><i style="transform:rotate(270deg)"></i><i style="transform:rotate(315deg)"></i></div><div class="pl"></div><div class="rl" style="animation-duration:2s"><i style="transform:rotate(0deg)"></i><i style="transform:rotate(45deg)"></i><i style="transform:rotate(90deg)"></i><i style="transform:rotate(135deg)"></i><i style="transform:rotate(180deg)"></i><i style="transform:rotate(225deg)"></i><i style="transform:rotate(270deg)"></i><i style="transform:rotate(315deg)"></i></div></div></div></body></html>
