<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>场记板</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#15181d}
.cb{width:52vw;transform:rotate(-3deg)}
.top{height:9vh;background:repeating-linear-gradient(-45deg,#111 0 4vh,#fff 4vh 8vh);border-radius:1vh 1vh 0 0;transform-origin:left bottom;animation:cp 3.4s steps(1) infinite}
.body{background:#111;border-radius:0 0 1vh 1vh;padding:3vh 4vh;color:#fff;font-family:monospace;font-size:3vh;line-height:1.9;letter-spacing:.1em;border:1vh solid #2a2e35;border-top:0}
@keyframes cp{0%,12%{transform:rotate(0)}5%{transform:rotate(-24deg)}}
</style></head>
<body><div id="stage"><div class="cb"><div class="top"></div><div class="body">SCENE 12 · TAKE 3<br>DIR: HERMES · CAM A<br>《AI 工具横评》EP.05</div></div></div></body></html>
