<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>胶片走带</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#0a0a0a;display:grid;place-items:center;overflow:hidden}
.strip{width:70vw;height:34vh;display:flex;gap:.8vh;animation:sl 6s linear infinite}
.fr{position:relative;flex:1;background:linear-gradient(150deg,#37474f,#1c262e);border-radius:.4vh}
.fr:after{content:"";position:absolute;left:10%;right:10%;top:8%;height:9%;background-image:radial-gradient(circle,#0a0a0a 38%,transparent 42%);background-size:2.4vh 100%}
.fr:before{content:"";position:absolute;left:10%;right:10%;bottom:8%;height:9%;background-image:radial-gradient(circle,#0a0a0a 38%,transparent 42%);background-size:2.4vh 100%}
.fr b{position:absolute;inset:16% 8%;display:grid;place-items:center;color:#78909c;font-size:3vh;font-weight:900;letter-spacing:.1em}
@keyframes sl{to{transform:translateX(-25%)}}
</style></head>
<body><div id="stage"><div class="strip"><div class="fr"><b>NO.01</b></div><div class="fr"><b>NO.02</b></div><div class="fr"><b>NO.03</b></div><div class="fr"><b>NO.04</b></div><div class="fr"><b>NO.05</b></div><div class="fr"><b>NO.06</b></div></div></div></body></html>
