<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>放映机光束</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#050505;overflow:hidden}
.beam{position:absolute;left:-6%;top:34%;width:80%;height:44%;background:linear-gradient(90deg,#fff5d6ee,#fff5d622);clip-path:polygon(0 42%,0 58%,100% 100%,100% 0);filter:blur(.4vh);animation:fl 4s ease-in-out infinite}
.dust{position:absolute;width:.7vh;height:.7vh;border-radius:50%;background:#fff8e1aa;animation:df 5s linear infinite}
@keyframes fl{50%{opacity:.75}}
@keyframes df{0%{transform:translate(0,0);opacity:0}12%{opacity:1}100%{transform:translate(46vw,-8vh);opacity:0}}
</style></head>
<body><div id="stage"><div class="beam"></div><i class="dust" style="left:4%;top:36%;animation-delay:0.0s"></i><i class="dust" style="left:21%;top:59%;animation-delay:0.5s"></i><i class="dust" style="left:38%;top:42%;animation-delay:1.0s"></i><i class="dust" style="left:55%;top:65%;animation-delay:1.5s"></i><i class="dust" style="left:12%;top:48%;animation-delay:2.0s"></i><i class="dust" style="left:29%;top:71%;animation-delay:2.5s"></i><i class="dust" style="left:46%;top:54%;animation-delay:3.0s"></i><i class="dust" style="left:63%;top:37%;animation-delay:3.5s"></i><i class="dust" style="left:20%;top:60%;animation-delay:4.0s"></i><i class="dust" style="left:37%;top:43%;animation-delay:4.5s"></i><i class="dust" style="left:54%;top:66%;animation-delay:0.0s"></i><i class="dust" style="left:11%;top:49%;animation-delay:0.5s"></i><i class="dust" style="left:28%;top:72%;animation-delay:1.0s"></i><i class="dust" style="left:45%;top:55%;animation-delay:1.5s"></i></div></body></html>
