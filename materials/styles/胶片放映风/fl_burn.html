<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>胶片烧帧</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#000}
.fr{position:relative;width:56vw;height:36vh;background:linear-gradient(140deg,#8d6e63,#4e342e);display:grid;place-items:center;color:#ffe0b2;font-size:3vh;letter-spacing:.2em}
.hole{position:absolute;left:50%;top:50%;width:0;height:0;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,#000 55%,#ff9800 62%,#ffd54f 68%,#000 78%);animation:br 3.6s steps(20) infinite;filter:blur(.2vh)}
@keyframes br{0%,12%{width:0;height:0}55%,82%{width:80vh;height:80vh}100%{width:80vh;height:80vh}}
</style></head>
<body><div id="stage"><div class="fr">FILM BURN · 35MM<div class="hole"></div></div></div></body></html>
