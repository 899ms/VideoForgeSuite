<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>双色调</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#0b1e3a;display:grid;place-items:center;overflow:hidden}
.ph{width:44vw;height:60vh;background:linear-gradient(135deg,#ff9966,#ff5e62);mix-blend-mode:screen;filter:contrast(1.1);position:relative;animation:dz 8s ease-in-out infinite alternate}
.ph:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,#3a86ff,#8338ec);mix-blend-mode:multiply}
.t{position:absolute;left:8%;bottom:8%;font-size:6vh;font-weight:900;color:#fff;mix-blend-mode:overlay;letter-spacing:.1em}
@keyframes dz{to{filter:contrast(1.2) hue-rotate(24deg)}}
</style></head>
<body><div id="stage"><div class="ph"><div class="t">DUOTONE</div></div></div></body></html>
