<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>铬金属字</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:radial-gradient(90% 80% at 50% 20%,#2a2f3a,#0b0d12);display:grid;place-items:center}
.ch{font-size:15vh;font-weight:900;letter-spacing:.04em;background:linear-gradient(180deg,#f8fbff 4%,#c9d6e8 22%,#5d6c85 46%,#e8eef7 54%,#8a97ad 72%,#38414f 96%);-webkit-background-clip:text;color:transparent;filter:drop-shadow(0 1.2vh 1.8vh #0009);animation:sg 6s ease-in-out infinite}
@keyframes sg{0%,100%{filter:drop-shadow(0 1.2vh 1.8vh #0009) hue-rotate(0)}50%{filter:drop-shadow(0 1.6vh 2.4vh #0009) hue-rotate(18deg)}}
</style></head>
<body><div id="stage"><div class="ch">CHROME</div></div></body></html>
