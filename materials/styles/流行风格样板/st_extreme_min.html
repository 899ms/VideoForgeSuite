<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>极端极简</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#ffffff;display:grid;place-items:center}
.dot{width:3vh;height:3vh;border-radius:50%;background:#111;animation:pp 4.8s cubic-bezier(.7,0,.3,1) infinite}
.word{position:absolute;left:50%;bottom:14vh;transform:translateX(-50%);font-size:2.4vh;letter-spacing:.6em;color:#999}
@keyframes pp{0%,100%{transform:scale(.6);opacity:.6}50%{transform:scale(1);opacity:1}}
</style></head>
<body><div id="stage"><div class="dot"></div><div class="word">LESS · IS · MORE</div></div></body></html>
