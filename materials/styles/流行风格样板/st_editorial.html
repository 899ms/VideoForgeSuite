<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>杂志编辑</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#faf7f2;display:grid;grid-template-columns:1fr 1fr;font-family:Georgia,'Noto Serif SC',serif}
.lf{padding:8vh 6vh;position:relative}
.lf h1{font-size:11vh;line-height:1.05;color:#14100c;font-weight:600}
.lf .no{position:absolute;top:6vh;right:6vh;font-size:2.6vh;letter-spacing:.3em;color:#8a7f6d}
.lf p{margin-top:3vh;font-size:2.8vh;line-height:2;color:#3c352b;max-width:34vw}
.rt{background:linear-gradient(160deg,#c9b393,#8a7350);position:relative;overflow:hidden}
.rt:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,#0000 0 2.6vh,#00000008 2.6vh 2.7vh);animation:ln 14s linear infinite}
@keyframes ln{to{background-position:0 100vh}}
</style></head>
<body><div id="stage"><div class="lf"><div class="no">ISSUE 042</div><h1>慢下来，<br>反而快。</h1><p>当所有内容都在加速，深度反而成了稀缺品。</p></div><div class="rt"></div></div></body></html>
