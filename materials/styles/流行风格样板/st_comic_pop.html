<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>漫画波普</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:repeating-radial-gradient(circle at 20% 30%,#ffe45e 0 3vh,#ffd23f 3vh 6vh);display:grid;place-items:center;overflow:hidden}
.bub{position:absolute;background:#fff;border:.6vh solid #111;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#111;box-shadow:1vh 1vh 0 #111;animation:fl 4s ease-in-out infinite alternate}
.b1{width:30vh;height:22vh;top:12%;left:12%;border-radius:50% 50% 50% 6%;font-size:5vh;--r:-4deg}
.b2{width:24vh;height:18vh;bottom:14%;right:12%;border-radius:50% 50% 6% 50%;font-size:4.4vh;--r:5deg;animation-delay:-2s}
.boom{font-size:13vh;font-weight:900;color:#ff5d3b;-webkit-text-stroke:.5vh #111;text-shadow:1vh 1vh 0 #111;transform:rotate(-6deg);animation:zm 2.8s cubic-bezier(.34,1.56,.64,1) infinite}
.dots{position:absolute;inset:0;background:radial-gradient(#1111 0 1.4px,#0000 1.9px);background-size:2vh 2vh;pointer-events:none}
@keyframes fl{to{transform:rotate(var(--r)) translateY(-2vh)}}
@keyframes zm{0%,100%{transform:rotate(-6deg) scale(1)}50%{transform:rotate(4deg) scale(1.12)}}
</style></head>
<body><div id="stage"><div class="dots"></div><div class="bub b1">WOW!</div><div class="bub b2">SO EASY</div><div class="boom">BOOM!</div></div></body></html>
