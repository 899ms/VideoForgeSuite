<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>工程蓝图</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#0d3b66;background-image:linear-gradient(#ffffff10 .1vh,transparent .1vh),linear-gradient(90deg,#ffffff10 .1vh,transparent .1vh);background-size:6vh 6vh;display:grid;place-items:center;overflow:hidden}
.bp{position:relative;width:44vw;height:30vw;border:.4vh solid #cfe3ff55}
.bp rect,.bp circle{fill:none;stroke:#cfe3ff;stroke-width:.5vh;stroke-dasharray:600;stroke-dashoffset:600;animation:dw 6s ease-in-out infinite}
.bp text{fill:#9fc5ff;font-size:2.4vh;font-family:monospace;opacity:0;animation:tx 6s steps(1) 2.4s infinite}
@keyframes dw{0%{stroke-dashoffset:600}55%,86%{stroke-dashoffset:0}100%{opacity:0}}
@keyframes tx{0%,40%{opacity:0}55%,86%{opacity:1}100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="bp"><svg viewBox="0 0 400 270" width="100%" height="100%"><rect x="40" y="40" width="320" height="190" rx="8"/><circle cx="200" cy="135" r="60"/><rect x="150" y="85" width="100" height="100"/><text x="150" y="250">MODULE-A / SCALE 1:20</text></svg></div></div></body></html>
