<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>黑白灰阶</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#e8e8e8;display:grid;place-items:center;font-family:Georgia,serif}
.big{font-size:17vh;font-weight:400;color:#111;letter-spacing:-.02em;animation:sl 6s ease-in-out infinite}
.big span{color:#b5b5b5}
.bar{position:absolute;left:0;right:0;height:1px;background:#111;opacity:.2}
@keyframes sl{0%,100%{letter-spacing:-.02em}50%{letter-spacing:.12em}}
</style></head>
<body><div id="stage"><div class="big">NOIR<span>.</span></div></div></body></html>
