<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>水墨</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:linear-gradient(#fbf8f1,#eee7d6);display:grid;place-items:center;overflow:hidden}
.mount{position:absolute;bottom:0;width:60vw;height:38vh;background:#1d2430;border-radius:48% 52% 0 0/100% 80% 0 0;filter:blur(.6vh);opacity:.85;animation:mk 12s ease-in-out infinite}
.mount.m2{left:24%;width:52vw;height:28vh;background:#39465c;opacity:.6;animation-delay:1.2s}
.seal{position:absolute;right:12%;top:16%;width:6.4vh;height:6.4vh;background:#b3352c;color:#fbf8f1;font-size:2.6vh;display:grid;place-items:center;border-radius:.8vh;writing-mode:vertical-rl;letter-spacing:.2em;opacity:0;animation:sl 12s steps(1) 3s infinite}
.vl{position:absolute;left:12%;top:18%;writing-mode:vertical-rl;font-size:4.6vh;color:#2b2b2b;font-family:'Noto Serif SC',serif;letter-spacing:.4em;opacity:0;animation:vv 12s steps(1) infinite}
@keyframes mk{50%{transform:translateY(-1.6vh)}}
@keyframes sl{0%,30%{opacity:0}38%,86%{opacity:1}100%{opacity:0}}
@keyframes vv{0%,10%{opacity:0}20%,86%{opacity:1}100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="mount m2" style="left:0"></div><div class="mount"></div><div class="vl">山水之间</div><div class="seal">墨韵</div></div></body></html>
