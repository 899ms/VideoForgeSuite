<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>烫金奢华</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:radial-gradient(80% 80% at 50% 30%,#171310,#0a0806);display:grid;place-items:center}
.gl{font-size:11vh;font-weight:700;font-family:Georgia,'Noto Serif SC',serif;letter-spacing:.14em;background:linear-gradient(100deg,#8a6a1f 8%,#f3d879 26%,#fff6d8 38%,#e9c25a 52%,#8a6a1f 78%);background-size:220% 100%;-webkit-background-clip:text;color:transparent;animation:sh 5s linear infinite}
.frame{position:absolute;inset:8%;border:.3vh solid #c9a44f;border-radius:1vh;box-shadow:inset 0 0 4vh #c9a44f22}
.frame:before{content:"";position:absolute;inset:1.4vh;border:.15vh solid #c9a44f66;border-radius:.6vh}
@keyframes sh{to{background-position:220% 0}}
</style></head>
<body><div id="stage"><div class="frame"></div><div class="gl">GOLD EDITION</div></div></body></html>
