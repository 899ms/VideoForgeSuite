<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>科普宇宙扁平</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#1b1f3a;overflow:hidden;display:grid;place-items:center}
.pl{width:30vh;height:30vh;border-radius:50%;background:radial-gradient(circle at 34% 30%,#7ec8e3,#2a6f97 58%,#14405c);position:relative;box-shadow:inset -2vh -3vh 0 #0003,0 0 8vh #2a6f9744;animation:bo 7s ease-in-out infinite}
.pl:after{content:"";position:absolute;inset:12% 6% auto auto;width:34%;height:20%;border-radius:50%;background:#ffd16688;filter:blur(1vh)}
.ring{position:absolute;left:50%;top:50%;width:46vh;height:12vh;border:.9vh solid #ffd166;border-radius:50%;transform:translate(-50%,-50%) rotate(-18deg);animation:rr 7s ease-in-out infinite}
.st{position:absolute;top:12%;width:100%;text-align:center;color:#eef;font-size:4.4vh;font-weight:800;letter-spacing:.06em}
.st s{text-decoration:none;color:#ffd166}
.st2{position:absolute;bottom:12%;color:#aeb8d8;font-size:2.8vh;opacity:0;animation:su 7s steps(1) 1.4s infinite}
@keyframes bo{50%{transform:translateY(-2vh)}}
@keyframes rr{50%{transform:translate(-50%,-50%) rotate(-18deg) scale(1.05)}}
@keyframes su{0%,20%{opacity:0}40%,86%{opacity:1}100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="ring"></div><div class="pl"></div><div class="st">一颗行星的<s>一分钟</s>历史</div><div class="st2">— Kurzgesagt style explainer —</div></div></body></html>
