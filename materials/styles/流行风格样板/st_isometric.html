<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>等距城市</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
@property --hh{syntax:'<length>';inherits:true;initial-value:0vh}
#stage{position:fixed;inset:0;background:linear-gradient(#0b1526,#122036);display:grid;grid-template-columns:repeat(4,12vh);gap:3.4vh;align-content:center;justify-content:center;perspective:160vh}
.bk{position:relative;width:12vh;height:12vh;transform-style:preserve-3d;transform:rotateX(56deg) rotateZ(45deg);animation:gr 6s ease-in-out infinite;animation-delay:calc(var(--i)*.22s)}
.bk i{position:absolute;left:0;top:0;width:12vh;height:12vh}
.bk .tp{background:linear-gradient(135deg,#3b5a8c,#2b4470);transform:translateZ(var(--hh))}
.bk .fr{top:100%;height:var(--hh);transform-origin:top;transform:rotateX(-90deg);background:linear-gradient(180deg,#1d8fb8,#125f7e);box-shadow:inset 0 -2vh 3vh #00000055}
.bk .rt{left:100%;width:var(--hh);transform-origin:left;transform:rotateY(90deg);background:linear-gradient(90deg,#46d6f5,#1d8fb8);box-shadow:0 0 3vh #3ec7e855}
.bk .rt:after,.bk .fr:after{content:"";position:absolute;inset:1.2vh;background:repeating-linear-gradient(90deg,#ffe9a366 0 1vh,transparent 1vh 3vh);opacity:.7}
@keyframes gr{0%{--hh:0vh}28%,78%{--hh:var(--h)}100%{--hh:0vh}}
</style></head>
<body><div id="stage"><div class="bk" style="--i:0;--h:9vh"><i class="tp"></i><i class="fr"></i><i class="rt"></i></div><div class="bk" style="--i:1;--h:21vh"><i class="tp"></i><i class="fr"></i><i class="rt"></i></div><div class="bk" style="--i:2;--h:15vh"><i class="tp"></i><i class="fr"></i><i class="rt"></i></div><div class="bk" style="--i:3;--h:18vh"><i class="tp"></i><i class="fr"></i><i class="rt"></i></div><div class="bk" style="--i:4;--h:12vh"><i class="tp"></i><i class="fr"></i><i class="rt"></i></div><div class="bk" style="--i:5;--h:24vh"><i class="tp"></i><i class="fr"></i><i class="rt"></i></div><div class="bk" style="--i:6;--h:10vh"><i class="tp"></i><i class="fr"></i><i class="rt"></i></div><div class="bk" style="--i:7;--h:17vh"><i class="tp"></i><i class="fr"></i><i class="rt"></i></div><div class="bk" style="--i:8;--h:20vh"><i class="tp"></i><i class="fr"></i><i class="rt"></i></div><div class="bk" style="--i:9;--h:13vh"><i class="tp"></i><i class="fr"></i><i class="rt"></i></div><div class="bk" style="--i:10;--h:22vh"><i class="tp"></i><i class="fr"></i><i class="rt"></i></div><div class="bk" style="--i:11;--h:11vh"><i class="tp"></i><i class="fr"></i><i class="rt"></i></div><div class="bk" style="--i:12;--h:16vh"><i class="tp"></i><i class="fr"></i><i class="rt"></i></div><div class="bk" style="--i:13;--h:19vh"><i class="tp"></i><i class="fr"></i><i class="rt"></i></div><div class="bk" style="--i:14;--h:14vh"><i class="tp"></i><i class="fr"></i><i class="rt"></i></div><div class="bk" style="--i:15;--h:23vh"><i class="tp"></i><i class="fr"></i><i class="rt"></i></div></div></body></html>
