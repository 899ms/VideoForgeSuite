<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>AI原生UI</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#0a0a12;display:grid;place-items:center;overflow:hidden}
.glow{position:absolute;width:60vh;height:60vh;border-radius:50%;background:conic-gradient(from 0deg,#6d5cff22,#00e0ff22,#ff6ac122,#6d5cff22);filter:blur(6vh);animation:rt 10s linear infinite}
.ask{position:relative;width:58vw;padding:3.4vh 4vh;border-radius:3vh;background:#ffffff10;border:.1vh solid #ffffff2e;backdrop-filter:blur(2vh);color:#eef;font-size:3.6vh;display:flex;justify-content:space-between;align-items:center}
.ask .cur{width:1.2vh;height:4vh;background:#7c6cff;animation:bl 1s steps(1) infinite}
.stream{position:absolute;bottom:16vh;font-size:3vh;color:#9aa;opacity:0;animation:sy 6s ease-in-out infinite}
@keyframes rt{to{transform:rotate(1turn)}}
@keyframes bl{50%{opacity:0}}
@keyframes sy{0%,20%{opacity:0;transform:translateY(2vh)}30%,70%{opacity:1;transform:none}80%,100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="glow"></div><div class="ask">帮我把这期视频剪成爆款…<div class="cur"></div></div><div class="stream">正在思考 ▍拆解脚本 ▍匹配素材 ▍生成时间线</div></div></body></html>
