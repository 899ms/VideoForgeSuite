<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#fff;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}.c{position:relative;width:52vw;height:60vh;background:#fff;overflow:hidden;border:4px solid #111}.c i{position:absolute;display:block}.c .z1{width:12vh;height:12vh;background:#ff006e;clip-path:polygon(50% 0,100% 100%,0 100%);left:8%;top:10%;animation:m1 4s ease-in-out infinite alternate}.c .z2{width:10vh;height:10vh;border:6px solid #111;border-radius:50%;right:12%;top:16%;animation:m2 5s ease-in-out infinite alternate}.c .z3{width:14vh;height:7vh;background:#00f5d4;border:6px solid #111;left:14%;bottom:12%;transform:rotate(-12deg);animation:m3 4.4s ease-in-out infinite alternate}.c .z4{width:8vh;height:8vh;background:#ffbe0b;left:46%;top:44%;transform:rotate(18deg);animation:m2 4s ease-in-out infinite alternate-reverse}.c h1{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-4deg);font-size:4.6vw;font-weight:900;color:#111;background:#fff;padding:1vh 2vw;border:5px solid #111;box-shadow:1vh 1vh 0 #ff006e;z-index:2}@keyframes m1{to{transform:translate(3vw,4vh) rotate(20deg)}}@keyframes m2{to{transform:translate(-3vw,3vh) scale(1.2)}}@keyframes m3{to{transform:rotate(8deg) translateX(2vw)}}</style></head><body><div class="c"><i class="z1"></i><i class="z2"></i><i class="z3"></i><i class="z4"></i><h1>MEMPHIS ✌ POP</h1></div><script></script></body></html>
