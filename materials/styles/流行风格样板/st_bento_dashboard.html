<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0a;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}.b{display:grid;grid-template-columns:repeat(3,13vw);grid-auto-rows:18vh;gap:1.2vw}.c{border-radius:18px;background:#141416;border:1px solid #26262a;padding:2vh 1.4vw;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;transition:.4s}.c.big{grid-column:span 2;grid-row:span 2;background:linear-gradient(160deg,#312e81,#0f0f12);justify-content:center}.c .v{font-size:2.6vw;font-weight:800}.c .l{font-size:1.1vw;color:#8e8e96}.c:hover{transform:translateY(-1vh)}.c:nth-child(2) .v{color:#4ade80}.c:nth-child(3) .v{color:#f472b6}.c:nth-child(4) .v{color:#38bdf8}</style></head><body><div class="b"><div class="c big"><div class="v" id="v">0</div><div class="l">Total Views — Bento Grid</div></div><div class="c"><div class="v">+24%</div><div class="l">Growth</div></div><div class="c"><div class="v">1.2s</div><div class="l">Load Time</div></div><div class="c"><div class="v">98</div><div class="l">Score</div></div><div class="c"><div class="v">∞</div><div class="l">Possibilities</div></div></div><script>const v=document.getElementById("v");(function f(){const p=(performance.now()%3800)/3800;v.textContent=Math.floor((1-Math.pow(1-p,3))*2840000).toLocaleString();requestAnimationFrame(f)})()</script></body></html>
