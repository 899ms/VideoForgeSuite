<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>印刷网点</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#f7f2e7;overflow:hidden}
.half{position:absolute;inset:0;background:radial-gradient(circle at 30% 40%,#ff5d3b55 0 2px,#0000 2.6px);background-size:1.6vh 1.6vh;mix-blend-mode:multiply;animation:mv1 12s ease-in-out infinite alternate}
.half.b{background-image:radial-gradient(circle at 68% 60%,#2b5cff55 0 2px,#0000 2.6px);animation-name:mv2}
.cir{position:absolute;left:28%;top:34%;width:26vh;height:26vh;border-radius:50%;background:#ff5d3b;mix-blend-mode:multiply;animation:fl 6s ease-in-out infinite alternate}
.cir.b{left:46%;top:44%;width:22vh;height:22vh;background:#2b5cff;animation-delay:-3s}
.t{position:absolute;bottom:10%;left:8%;font-size:7vh;font-weight:900;color:#1a1a1a;mix-blend-mode:multiply;line-height:1.05}
.t em{font-style:normal;color:#ff5d3b}
@keyframes mv1{to{background-position:3vh 2vh}}
@keyframes mv2{to{background-position:-3vh 3vh}}
@keyframes fl{to{transform:translate(4vh,-3vh)}}
</style></head>
<body><div id="stage"><div class="half"></div><div class="half b"></div><div class="cir"></div><div class="cir b"></div><div class="t">RISO<br><em>PRINT</em></div></div></body></html>
