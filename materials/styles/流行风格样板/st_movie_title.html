<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>电影片头</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#000;display:grid;place-items:center;overflow:hidden}
.ttl{color:#e8dcc0;font-family:Georgia,'Noto Serif SC',serif;font-size:9vh;letter-spacing:.34em;font-weight:500;opacity:0;animation:tt 9s ease-in-out infinite}
.sub{position:absolute;bottom:16%;width:100%;text-align:center;color:#8a8070;font-size:2.4vh;letter-spacing:.5em;opacity:0;animation:sb 9s ease-in-out infinite}
.fog{position:absolute;inset:0;background:radial-gradient(60% 50% at 50% 60%,#241f16 0%,#000 75%);animation:fg 9s ease-in-out infinite}
@keyframes tt{0%,14%{opacity:0;letter-spacing:.6em}36%,78%{opacity:1;letter-spacing:.34em}100%{opacity:0}}
@keyframes sb{0%,30%{opacity:0}46%,80%{opacity:.8}100%{opacity:0}}
@keyframes fg{50%{transform:scale(1.1)}}
</style></head>
<body><div id="stage"><div class="fog"></div><div class="ttl">沙 丘 之 下</div><div class="sub">A FILM BY HERMES</div></div></body></html>
