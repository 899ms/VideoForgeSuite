<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>车库朋克</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#7a1f1f;display:grid;place-items:center;overflow:hidden}
.tin{font-size:12vh;font-weight:900;color:#f2d43d;-webkit-text-stroke:.5vh #1a1a1a;letter-spacing:.04em;transform:rotate(-3deg);text-shadow:.8vh .8vh 0 #1a1a1a;animation:wt 2.8s steps(3) infinite}
.tape{position:absolute;width:26vw;height:7vh;background:#000000b0;color:#fff;display:grid;place-items:center;font-size:3.2vh;letter-spacing:.3em;transform:rotate(-8deg)}
.tape.t1{left:-4%;top:14%}.tape.t2{right:-4%;bottom:16%;transform:rotate(6deg);background:#1a1a1a}
@keyframes wt{50%{transform:rotate(-1.4deg) skewX(-2deg)}}
</style></head>
<body><div id="stage"><div class="tape t1">GARAGE SALE</div><div class="tin">PUNK!</div><div class="tape t2">EST.1987</div></div></body></html>
