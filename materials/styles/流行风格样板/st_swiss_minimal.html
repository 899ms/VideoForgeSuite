<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#fafafa;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}.c{width:52vw;height:60vh;background:#fff;position:relative;box-shadow:0 20px 60px rgba(0,0,0,.08)}.c .rd{position:absolute;width:16vh;height:16vh;border-radius:50%;background:#ff3300;right:10%;top:10%;animation:pl 4s ease-in-out infinite}@keyframes pl{50%{transform:scale(1.15)}}.c h1{position:absolute;left:8%;top:34%;font-size:5.2vw;font-weight:900;color:#111;line-height:1.05;letter-spacing:-.1vw}.c p{position:absolute;left:8%;bottom:12%;font-size:1.4vw;color:#555;max-width:34vw}.c .grid{position:absolute;inset:0;background-image:linear-gradient(#eee 1px,transparent 1px),linear-gradient(90deg,#eee 1px,transparent 1px);background-size:6.5vw 6.5vw;opacity:.5}</style></head><body><div class="c"><div class="grid"></div><div class="rd"></div><h1>LESS<br>IS MORE</h1><p>Swiss International Style — grid, whitespace, Helvetica discipline.</p></div><script></script></body></html>
