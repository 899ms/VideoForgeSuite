<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>空间UI</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:radial-gradient(100% 90% at 30% 20%,#3d4a63,#12141c 70%);display:grid;place-items:center;perspective:120vh;overflow:hidden}
.pane{position:absolute;width:26vw;height:34vh;border-radius:3.4vh;background:#ffffff14;backdrop-filter:blur(3vh);border:.1vh solid #ffffff3b;box-shadow:0 4vh 8vh #0006, inset 0 0 0 .1vh #ffffff10;animation:fy 9s ease-in-out infinite}
.pane.p2{width:32vw;height:40vh;left:50%;top:50%;transform:translate(-50%,-50%);display:grid;place-items:center;color:#fff;font-size:3.6vh;animation-delay:2s}
.dock{position:absolute;left:50%;bottom:8%;transform:translateX(-50%);display:flex;gap:2vh;padding:1.8vh 3vh;border-radius:5vh;background:#ffffff1c;backdrop-filter:blur(2.4vh);border:.1vh solid #ffffff30}
.dock i{width:5.4vh;height:5.4vh;border-radius:1.6vh;background:linear-gradient(135deg,hsl(calc(var(--h)*1),70%,60%),hsl(calc(var(--h)*1 + 40),70%,45%))}
@keyframes fy{0%,100%{transform:translateZ(-6vh) translate(6vw,4vh)}50%{transform:translateZ(-2vh) translate(-8vw,6vh)}}
</style></head>
<body><div id="stage"><div class="pane p1"></div><div class="pane p2">空间界面 · Spatial</div><div class="dock"><i style="--h:0"></i><i style="--h:40"></i><i style="--h:80"></i><i style="--h:120"></i><i style="--h:160"></i></div></div></body></html>
