<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>手绘涂鸦UI</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#fefcf3;display:grid;place-items:center;font-family:'Segoe Print','Comic Sans MS',cursive}
.bt{font-size:4.6vh;color:#222;border:.5vh solid #222;border-radius:2vh 1vh 2.4vh 1vh;padding:2.4vh 4.6vh;background:#fff;box-shadow:.9vh .9vh 0 #222;transform:rotate(-2deg);cursor:pointer;animation:hb 3.4s ease-in-out infinite}
.bt:active{transform:translate(.6vh,.6vh);box-shadow:.3vh .3vh 0 #222}
.sk2{position:absolute;left:16%;top:14%;font-size:5.4vh;transform:rotate(-6deg)}
.sk3{position:absolute;right:14%;bottom:16%;font-size:5vh;transform:rotate(5deg)}
@keyframes hb{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(1.4deg) scale(1.02)}}
</style></head>
<body><div id="stage"><div class="sk2">✎ 手绘风</div><div class="bt">点 我 呀</div><div class="sk3">→ 这不是模板</div></div></body></html>
