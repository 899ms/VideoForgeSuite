<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>极繁主义</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#f5e9d0;overflow:hidden;display:grid;place-items:center}
.stk{position:absolute;border-radius:50%;display:grid;place-items:center;font-weight:900;box-shadow:.6vh .6vh 0 #111;animation:fl 5s ease-in-out infinite alternate}
.s1{width:22vh;height:22vh;background:#ff5d8f;color:#fff;font-size:4vh;top:8%;left:8%;--r:-8deg}
.s2{width:16vh;height:16vh;background:#4cc9f0;color:#111;font-size:3vh;top:14%;right:10%;--r:10deg;animation-delay:-1.4s}
.s3{width:19vh;height:19vh;background:#ffd166;color:#111;font-size:3.4vh;bottom:12%;left:16%;--r:6deg;animation-delay:-2.6s}
.s4{width:14vh;height:14vh;background:#80ed99;color:#111;font-size:2.8vh;bottom:16%;right:14%;--r:-12deg;animation-delay:-3.4s}
.zig{position:absolute;inset:0;background:repeating-linear-gradient(45deg,#1111 0 2vh,transparent 2vh 5vh)}
h1{position:relative;font-size:11vh;font-weight:900;color:#111;text-transform:uppercase;letter-spacing:-.02em;transform:rotate(-3deg);text-shadow:.8vh .8vh 0 #ff5d8f,.8vh .8vh 0 #111;border:.8vh solid #111;background:#fff;padding:2vh 4vh;box-shadow:1.6vh 1.6vh 0 #111}
@keyframes fl{from{transform:rotate(var(--r)) translateY(0)}to{transform:rotate(calc(var(--r) * -1)) translateY(-2.4vh)}}
</style></head>
<body><div id="stage"><div class="zig"></div><div class="stk s1">WOW</div><div class="stk s2">NEW!</div><div class="stk s3">HOT</div><div class="stk s4">GO</div><h1>MAXI<br>MALISM</h1></div></body></html>
