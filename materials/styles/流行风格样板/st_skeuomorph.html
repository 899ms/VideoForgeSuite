<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>拟物开关</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:linear-gradient(#3a3f44,#23272b);display:grid;place-items:center}
.sw{width:22vh;height:11vh;border-radius:5.5vh;background:linear-gradient(#1c1f22,#2e3338);box-shadow:inset 0 .6vh 1.6vh #000c,0 1px 0 #ffffff22;position:relative}
.kn{position:absolute;top:1vh;left:1vh;width:9vh;height:9vh;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f5f6f7,#a9b0b6 70%,#6d747a);box-shadow:0 .8vh 1.8vh #000b,inset 0 -.6vh 1vh #0006;animation:tg 3.4s cubic-bezier(.6,-.28,.3,1.3) infinite}
.kn:after{content:"";position:absolute;inset:30%;border-radius:50%;background:radial-gradient(circle at 40% 35%,#ffffff88,#0000)}
@keyframes tg{0%,42%{left:1vh}58%,92%{left:12vh}100%{left:1vh}}
.led{position:absolute;right:4vh;top:4.6vh;width:2vh;height:2vh;border-radius:50%;background:#4caf50;box-shadow:0 0 1.6vh #4caf50;animation:ld 3.4s steps(1) infinite}
@keyframes ld{0%,44%{opacity:.2}50%,92%{opacity:1}100%{opacity:.2}}
</style></head>
<body><div id="stage"><div class="sw"><div class="kn"></div><div class="led"></div></div></div></body></html>
