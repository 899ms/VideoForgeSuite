<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:linear-gradient(120deg,#0ea5e9,#8b5cf6 55%,#ec4899);display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}.bg{position:absolute;inset:0;background:radial-gradient(circle at 25% 30%,rgba(255,255,255,.5),transparent 40%),radial-gradient(circle at 75% 65%,rgba(255,255,255,.35),transparent 45%)}.lg{position:relative;width:40vw;height:34vh;border-radius:28px;background:linear-gradient(135deg,rgba(255,255,255,.35),rgba(255,255,255,.08));backdrop-filter:blur(22px) saturate(1.5);border:1px solid rgba(255,255,255,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 24px 60px rgba(0,0,60,.25);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;animation:ft 5s ease-in-out infinite}.lg h3{font-size:2.6vw;text-shadow:0 2px 12px rgba(0,0,0,.25)}.lg p{font-size:1.4vw;opacity:.9;margin-top:1.2vh}@keyframes ft{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-2.6vh) rotate(1deg)}}</style></head><body><div class="bg"></div><div class="lg"><h3>🫧 Liquid Glass</h3><p>refraction · saturation · specular highlight</p></div><script></script></body></html>
