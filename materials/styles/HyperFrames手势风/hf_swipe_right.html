<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>右挥手切页</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#140e20;overflow:hidden}
.pg{position:absolute;inset:0;display:grid;place-items:center;font-size:8vh;font-weight:900;color:#fff}
.p1{background:linear-gradient(140deg,#8e24aa,#4a148c);animation:p1 4.2s steps(1) infinite}
.p2{background:linear-gradient(140deg,#fb8c00,#e65100);animation:p2 4.2s steps(1) infinite}
.hd{position:absolute;left:-14vh;bottom:10vh;font-size:14vh;transform:scaleX(-1);animation:hd 4.2s cubic-bezier(.4,0,.2,1) infinite}
@keyframes p1{0%,46%{opacity:1;transform:translateX(0)}58%,88%{opacity:1;transform:translateX(100%)}89%,100%{opacity:0}}
@keyframes p2{0%,46%{opacity:0;transform:translateX(-100%)}58%,88%{opacity:1;transform:translateX(0)}89%,100%{opacity:0}}
@keyframes hd{0%,30%{transform:scaleX(-1) translateX(0) rotate(8deg)}40%,56%{transform:scaleX(-1) translateX(-120vw) rotate(-10deg)}60%,100%{transform:scaleX(-1) translateX(-120vw) rotate(-10deg);opacity:0}}
</style></head>
<body><div id="stage"><div class="pg p1">上一页</div><div class="pg p2">下一页</div><div class="hd">🖐️</div></div></body></html>
