<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>指尖点击闪光</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#14181d;display:grid;place-items:center;overflow:hidden}
.bt{width:30vh;height:12vh;border-radius:2vh;background:linear-gradient(135deg,#7c4dff,#536dfe);display:grid;place-items:center;color:#fff;font-size:4vh;font-weight:900;box-shadow:0 1vh 3vh #536dfe66;animation:bt 3s steps(1) infinite}
.fd{position:absolute;font-size:7vh;animation:fd 3s cubic-bezier(.3,1.4,.5,1) infinite}
.ri{position:absolute;width:6vh;height:6vh;border-radius:50%;border:.6vh solid #7ef0ff;opacity:0;animation:ri 3s ease-out infinite}
.fl{position:absolute;inset:0;background:#fff;opacity:0;animation:fl 3s steps(1) infinite}
@keyframes bt{50%{transform:scale(.94)}}
@keyframes fd{0%,18%{transform:translate(4vh,10vh) scale(1.2)}30%{transform:translate(0,0) scale(1)}60%,100%{opacity:0}}
@keyframes ri{0%,26%{opacity:1;transform:scale(.2)}50%,100%{opacity:0;transform:scale(3.2)}}
@keyframes fl{0%,27%{opacity:0}30%{opacity:.75}36%,100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="fl"></div><div class="bt">开始生成</div><div class="ri"></div><div class="fd">👉</div></div></body></html>
