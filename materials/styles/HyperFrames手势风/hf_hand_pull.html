<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>手掌拉幕</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#0d1b12;overflow:hidden}
.bg{position:absolute;inset:0;display:grid;place-items:center;font-size:9vh;font-weight:900;color:#e8f5e9;letter-spacing:.1em}
.cur{position:absolute;inset:0;background:linear-gradient(140deg,#263238,#11181d);display:grid;place-items:center;font-size:6vh;color:#90a4ae;font-weight:700;transform-origin:right;animation:cu 4.4s cubic-bezier(.7,0,.3,1) infinite}
.hd{position:absolute;right:8vh;top:30%;font-size:12vh;animation:hd 4.4s cubic-bezier(.7,0,.3,1) infinite}
@keyframes cu{0%,30%{transform:scaleX(1)}55%,86%{transform:scaleX(0)}100%{transform:scaleX(0);opacity:0}}
@keyframes hd{0%,30%{opacity:1;transform:translateX(0)}50%,100%{opacity:0;transform:translateX(60vw)}}
</style></head>
<body><div id="stage"><div class="bg">揭晓时刻</div><div class="cur"><span>往右拉开 →</span></div><div class="hd">🫱</div></div></body></html>
