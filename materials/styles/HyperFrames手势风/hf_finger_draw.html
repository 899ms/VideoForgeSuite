<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>指尖划线揭示</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#0d1117;display:grid;place-items:center}
.ln{position:absolute;left:12%;top:50%;width:0;height:.6vh;background:linear-gradient(90deg,#7ef0ff,#4c6cf7);border-radius:99vh;box-shadow:0 0 2vh #7ef0ff88;animation:ln 4.2s cubic-bezier(.6,0,.3,1) infinite;transform-origin:left}
.fd{position:absolute;font-size:6vh;top:calc(50% - 8vh);animation:fd 4.2s cubic-bezier(.6,0,.3,1) infinite}
.tx{position:absolute;font-size:3.6vh;font-weight:700;color:#e8eaed;top:calc(50% + 3vh);opacity:0;animation:tx 4.2s steps(1) infinite}
@keyframes ln{0%,10%{width:0}55%,86%{width:76%}100%{width:76%;opacity:0}}
@keyframes fd{0%,10%{left:11%}55%,86%{left:84%}100%{left:84%;opacity:0}}
@keyframes tx{0%,50%{opacity:0}60%,86%{opacity:1}100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="ln"></div><div class="fd">☝️</div><div class="tx">跟着这条线，看懂全部流程</div></div></body></html>
