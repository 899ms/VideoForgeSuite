<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>挥手开场</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(70% 70% at 50% 40%,#1c2740,#0a0e18)}
.hi{position:absolute;font-size:15vh;animation:hi 3.6s ease-in-out infinite;transform-origin:70% 80%}
.tt{position:absolute;font-size:7vh;font-weight:900;color:#fff;letter-spacing:.12em;opacity:0;animation:tt 3.6s steps(1) infinite}
.tt b{color:#7ef0ff}
@keyframes hi{0%,12%{transform:rotate(0)}18%{transform:rotate(18deg)}26%{transform:rotate(-14deg)}34%{transform:rotate(18deg)}42%{transform:rotate(-14deg)}50%{transform:rotate(0)}66%,88%{transform:translateX(-70vw) rotate(-20deg)}100%{transform:translateX(-70vw);opacity:0}}
@keyframes tt{0%,52%{opacity:0;transform:translateY(4vh)}62%,88%{opacity:1;transform:none}100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="hi">👋</div><div class="tt">你好，我是 <b>Hermes</b></div></div></body></html>
