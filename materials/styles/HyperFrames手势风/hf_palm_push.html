<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>手掌推屏</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#101418;display:grid;place-items:center;overflow:hidden}
.card{width:56vw;height:60vh;background:linear-gradient(140deg,#eceff1,#b0bec5);border-radius:2vh;display:grid;place-items:center;font-size:6vh;font-weight:900;color:#455a64;box-shadow:0 2vh 5vh #0006;animation:cd 4s cubic-bezier(.5,0,.4,1) infinite}
.hd{position:absolute;left:6vh;font-size:13vh;animation:hd 4s cubic-bezier(.5,0,.4,1) infinite}
@keyframes cd{0%,28%{transform:translateX(0) rotateY(0)}44%{transform:translateX(80vw) rotateY(24deg);opacity:0}70%{transform:translateX(-80vw) rotateY(-24deg);opacity:0}82%,100%{transform:translateX(0) rotateY(0);opacity:1}}
@keyframes hd{0%,28%{left:6vh;opacity:1}44%,100%{left:80vw;opacity:0}}
</style></head>
<body><div id="stage"><div class="card">内容卡片</div><div class="hd">🫲</div></div></body></html>
