<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>水下光柱</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:linear-gradient(#01579b,#01243d);overflow:hidden}
.bm{position:absolute;top:-10%;width:10vw;height:130%;background:linear-gradient(#b3e5fc44,#b3e5fc00 80%);transform:skewX(-8deg);filter:blur(1.4vh);mix-blend-mode:screen;animation:sw 8s ease-in-out infinite alternate}
.m1{left:8%}.m2{left:26%;animation-delay:1s;width:7vw}.m3{left:47%;animation-delay:2s;width:13vw}.m4{left:70%;animation-delay:.5s}
.bub{position:absolute;border-radius:50%;border:.2vh solid #e1f5fe66;animation:fv 7s linear infinite;left:calc(var(--x)*1%);bottom:-6vh;width:calc(var(--s)*1vh);height:calc(var(--s)*1vh)}
@keyframes sw{to{transform:skewX(-2deg) translateX(2vw);opacity:.7}}
@keyframes fv{to{transform:translateY(-115vh) translateX(3vh)}}
</style></head>
<body><div id="stage"><div class="bm m1"></div><div class="bm m2"></div><div class="bm m3"></div><div class="bm m4"></div><div class="bub" style="--x:4;--s:1;animation-delay:0.0s"></div><div class="bub" style="--x:47;--s:2;animation-delay:0.9s"></div><div class="bub" style="--x:90;--s:3;animation-delay:1.8s"></div><div class="bub" style="--x:43;--s:4;animation-delay:2.7s"></div><div class="bub" style="--x:86;--s:1;animation-delay:3.6s"></div><div class="bub" style="--x:39;--s:2;animation-delay:4.5s"></div><div class="bub" style="--x:82;--s:3;animation-delay:5.4s"></div><div class="bub" style="--x:35;--s:4;animation-delay:0.2999999999999998s"></div><div class="bub" style="--x:78;--s:1;animation-delay:1.2000000000000002s"></div><div class="bub" style="--x:31;--s:2;animation-delay:2.0999999999999996s"></div><div class="bub" style="--x:74;--s:3;animation-delay:3.0s"></div><div class="bub" style="--x:27;--s:4;animation-delay:3.9000000000000004s"></div><div class="bub" style="--x:70;--s:1;animation-delay:4.800000000000001s"></div><div class="bub" style="--x:23;--s:2;animation-delay:5.700000000000001s"></div></div></body></html>
