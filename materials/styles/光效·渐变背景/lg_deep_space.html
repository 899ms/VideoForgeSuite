<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>深空星云</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#020208;overflow:hidden}
.nb{position:absolute;border-radius:50%;filter:blur(6vh);mix-blend-mode:screen;animation:fv 14s ease-in-out infinite alternate}
.n1{width:60vh;height:44vh;background:radial-gradient(#7c4dff44,#7c4dff00 70%);left:-8%;top:-6%}
.n2{width:70vh;height:50vh;background:radial-gradient(#00b8d433,#00b8d400 70%);right:-12%;top:12%;animation-delay:2s}
.n3{width:54vh;height:40vh;background:radial-gradient(#ff408122,#ff408100 70%);left:26%;bottom:-10%;animation-delay:4s}
.st{position:absolute;width:.4vh;height:.4vh;border-radius:50%;background:#fff;animation:tw 3s steps(2) infinite}
@keyframes fv{to{transform:translate(6vw,4vh) scale(1.15)}}
@keyframes tw{50%{opacity:.2}}
</style></head>
