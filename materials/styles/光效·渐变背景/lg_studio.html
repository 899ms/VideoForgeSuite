<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>影棚渐变</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#0d0d10;overflow:hidden}
.wl{position:absolute;left:50%;bottom:0;transform:translateX(-50%);width:120vw;height:70vh;background:radial-gradient(50% 100% at 50% 100%,#ffffff2e,#ffffff05 55%,transparent);animation:pu 6s ease-in-out infinite alternate}
.cl{position:absolute;left:50%;top:8%;transform:translateX(-50%);width:60vh;height:60vh;border-radius:50%;background:radial-gradient(circle,#ffffff1a,transparent 60%);filter:blur(2vh)}
@keyframes pu{to{opacity:.7}}
</style></head>
<body><div id="stage"><div class="cl"></div><div class="wl"></div></div></body></html>
