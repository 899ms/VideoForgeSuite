<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>绸缎波光</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:linear-gradient(140deg,#1a0b2e,#3d1a5c);overflow:hidden}
.sk{position:absolute;inset:-20%;background:conic-gradient(from 200deg at 50% 50%,#a855f700,#d946ef44,#a855f700 30%,#8b5cf655 55%,#a855f700 80%);filter:blur(5vh);animation:sp 16s linear infinite}
.sk2{position:absolute;inset:-10%;background:conic-gradient(from 40deg at 60% 40%,#ec489900,#f9a8d455 25%,#ec489900 50%,#c084fc44 75%,#ec489900);filter:blur(4vh);animation:sp 11s linear infinite reverse}
@keyframes sp{to{transform:rotate(1turn)}}
</style></head>
<body><div id="stage"><div class="sk"></div><div class="sk2"></div></div></body></html>
