<!doctype html><html lang=zh><head><meta charset=utf-8>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}
.w{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;z-index:3}
.t{font-size:50px;font-weight:900;color:#f8fafc;letter-spacing:5px;text-shadow:0 0 26px rgba(56,189,248,.55)}
.s{font-size:14px;color:#38bdf8;letter-spacing:6px;margin-top:12px}
.bg{position:absolute;inset:-20%;background:
repeating-linear-gradient(0deg,transparent 0 46px,rgba(56,189,248,.14) 46px 47px),
repeating-linear-gradient(90deg,transparent 0 46px,rgba(167,139,250,.14) 46px 47px);
animation:flow 2.4s linear infinite;mask-image:radial-gradient(ellipse at center,#000 20%,transparent 72%)}
@keyframes flow{to{background-position:0 46px,46px 0}}
.glow{position:absolute;left:50%;top:50%;width:500px;height:300px;transform:translate(-50%,-50%);background:radial-gradient(ellipse,#0ea5e933,transparent 70%);filter:blur(30px)}</style></head>
<body><div class=bg></div><div class=glow></div>
<div class=w><div class=t>BACKGROUND BEAMS</div><div class=s>ACETERNITY · 网格光束流动</div></div></body></html>
