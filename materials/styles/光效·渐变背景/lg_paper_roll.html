<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>牛皮纸纹</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#c9a97c;overflow:hidden}
.gr{position:absolute;inset:0;background-image:repeating-conic-gradient(#00000006 0 .07turn,#0000 0 .14turn),repeating-linear-gradient(0deg,#00000004 0 .2vh,transparent .2vh .5vh);background-size:6px 6px,100% 100%;animation:sc 4s linear infinite}
.fib{position:absolute;width:16vh;height:.4vh;background:#8d6e63;border-radius:1vh;opacity:.35;animation:fv 9s linear infinite;left:calc(var(--x)*1%);top:calc(var(--y)*1%);transform:rotate(calc(var(--r)*1deg))}
@keyframes sc{to{background-position:12px 6px,0 0}}
@keyframes fv{to{transform:rotate(calc(var(--r)*1deg)) translateX(14vh);opacity:0}}
</style></head>
<body><div id="stage"><div class="gr"></div><div class="fib" style="--x:6;--y:6;--r:-90;animation-delay:0.0s"></div><div class="fib" style="--x:53;--y:37;--r:-37;animation-delay:0.7s"></div><div class="fib" style="--x:16;--y:68;--r:16;animation-delay:1.4s"></div><div class="fib" style="--x:63;--y:13;--r:69;animation-delay:2.0999999999999996s"></div><div class="fib" style="--x:26;--y:44;--r:-58;animation-delay:2.8s"></div><div class="fib" style="--x:73;--y:75;--r:-5;animation-delay:3.5s"></div><div class="fib" style="--x:36;--y:20;--r:48;animation-delay:4.199999999999999s"></div><div class="fib" style="--x:83;--y:51;--r:-79;animation-delay:4.8999999999999995s"></div><div class="fib" style="--x:46;--y:82;--r:-26;animation-delay:5.6s"></div><div class="fib" style="--x:9;--y:27;--r:27;animation-delay:6.3s"></div><div class="fib" style="--x:56;--y:58;--r:80;animation-delay:7.0s"></div><div class="fib" style="--x:19;--y:89;--r:-47;animation-delay:7.699999999999999s"></div><div class="fib" style="--x:66;--y:34;--r:6;animation-delay:0.3999999999999986s"></div><div class="fib" style="--x:29;--y:65;--r:59;animation-delay:1.0999999999999996s"></div><div class="fib" style="--x:76;--y:10;--r:-68;animation-delay:1.799999999999999s"></div><div class="fib" style="--x:39;--y:41;--r:-15;animation-delay:2.5s"></div></div></body></html>
