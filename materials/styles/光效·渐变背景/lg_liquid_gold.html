<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>液态金</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#0d0a04;overflow:hidden}
.aur{position:absolute;width:70vh;height:70vh;border-radius:50%;filter:blur(4vh);animation:mv 9s ease-in-out infinite alternate;mix-blend-mode:screen}
.a1{background:radial-gradient(circle,#ffd54f,#b8860b 60%,transparent 75%);left:8%;top:6%}
.a2{background:radial-gradient(circle,#ffab00,#7a4f00 60%,transparent 75%);right:6%;bottom:4%;animation-duration:11s}
.a3{background:radial-gradient(circle,#fff8e1,#8d6e63 55%,transparent 72%);left:30%;bottom:14%;animation-duration:7s;width:44vh;height:44vh}
@keyframes mv{to{transform:translate(10vw,-6vh) scale(1.2)}}
</style></head>
<body><div id="stage"><div class="aur a1"></div><div class="aur a2"></div><div class="aur a3"></div></div></body></html>
