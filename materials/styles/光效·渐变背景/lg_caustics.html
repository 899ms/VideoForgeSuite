<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>水面焦散</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:linear-gradient(#01579b,#02364f);overflow:hidden}
.ca{position:absolute;inset:-30%;background:conic-gradient(from 0deg at 50% 50%,#ffffff00,#b3e5fc44 12%,#ffffff00 22%,#e1f5fe33 38%,#ffffff00 52%,#81d4fa44 68%,#ffffff00 82%,#b3e5fc33 94%,#ffffff00);filter:blur(2.4vh);animation:sp 9s linear infinite;mix-blend-mode:screen}
.ca.c2{animation-duration:13s;animation-direction:reverse;opacity:.7}
@keyframes sp{to{transform:rotate(1turn)}}
</style></head>
<body><div id="stage"><div class="ca"></div><div class="ca c2"></div></div></body></html>
