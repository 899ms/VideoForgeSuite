<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>尘埃光斑</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}

@keyframes fv{0%{transform:translate(0,0)}25%{transform:translate(3vh,2vh)}50%{transform:translate(-2vh,5vh)}75%{transform:translate(4vh,3vh)}100%{transform:translate(0,0)}}
</style></head>
