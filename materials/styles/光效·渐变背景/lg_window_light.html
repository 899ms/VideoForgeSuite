<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>窗光尘埃</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:linear-gradient(120deg,#1c1712,#0c0a07);overflow:hidden}
.wn{position:absolute;left:-6%;top:-14%;width:64vw;height:130vh;background:linear-gradient(115deg,#ffe0b233,#ffe0b211 55%,transparent);transform:rotate(12deg);filter:blur(1vh)}
.wn:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 12vw,#000000cc 12vw 13.2vw)}
.du{position:absolute;width:.8vh;height:.8vh;border-radius:50%;background:#ffe0b2aa;filter:blur(.2vh);animation:fv 7s linear infinite;left:calc(var(--x)*1%);top:calc(var(--y)*1%)}
@keyframes fv{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}60%{transform:translate(2vh,8vh)}100%{opacity:0;transform:translate(-1vh,16vh)}}
</style></head>
<body><div id="stage"><div class="wn"></div><div class="du" style="--x:8;--y:8;animation-delay:0.0s"></div><div class="du" style="--x:49;--y:37;animation-delay:0.9s"></div><div class="du" style="--x:30;--y:16;animation-delay:1.8s"></div><div class="du" style="--x:11;--y:45;animation-delay:2.7s"></div><div class="du" style="--x:52;--y:24;animation-delay:3.6s"></div><div class="du" style="--x:33;--y:53;animation-delay:4.5s"></div><div class="du" style="--x:14;--y:32;animation-delay:5.4s"></div><div class="du" style="--x:55;--y:11;animation-delay:0.2999999999999998s"></div><div class="du" style="--x:36;--y:40;animation-delay:1.2000000000000002s"></div><div class="du" style="--x:17;--y:19;animation-delay:2.0999999999999996s"></div><div class="du" style="--x:58;--y:48;animation-delay:3.0s"></div><div class="du" style="--x:39;--y:27;animation-delay:3.9000000000000004s"></div><div class="du" style="--x:20;--y:56;animation-delay:4.800000000000001s"></div><div class="du" style="--x:61;--y:35;animation-delay:5.700000000000001s"></div><div class="du" style="--x:42;--y:14;animation-delay:0.5999999999999996s"></div><div class="du" style="--x:23;--y:43;animation-delay:1.5s"></div><div class="du" style="--x:64;--y:22;animation-delay:2.4000000000000004s"></div><div class="du" style="--x:45;--y:51;animation-delay:3.3000000000000007s"></div></div></body></html>
