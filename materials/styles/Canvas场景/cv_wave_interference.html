<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>波干涉</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#050510}
canvas{position:absolute;inset:0;width:100%;height:100%}
</style></head>
<body><div id="stage"><canvas id="cv" width="480" height="270"></canvas><script>const c=document.getElementById("cv"),x=c.getContext("2d");const W=480,H=270,s1=[130,135],s2=[350,135];let t=0;const im=x.createImageData(W,H);(function loop(){t+=.06;const d=im.data;for(let py=0;py<H;py++)for(let px=0;px<W;px++){const a=Math.sin(Math.hypot(px-s1[0],py-s1[1])*.11-t*2.2);const b=Math.sin(Math.hypot(px-s2[0],py-s2[1])*.11-t*2.2);const v=(a+b)*.5;const i=(py*W+px)*4;const q=v>0?v:0;d[i]=20+q*140;d[i+1]=30+q*180;d[i+2]=90+q*70;d[i+3]=255}x.putImageData(im,0,0);x.fillStyle="#fff";x.beginPath();x.arc(s1[0],s1[1],4,0,6.28);x.arc(s2[0],s2[1],4,0,6.28);x.fill();requestAnimationFrame(loop)})();</script></div></body></html>
