<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>珊瑚生长</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#061420;display:grid;place-items:center}canvas{position:absolute;inset:0;width:100%;height:100%}
</style></head>
<body><div id="stage"><canvas id="cv"></canvas><script>const c=document.getElementById("cv"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;x.fillStyle="#061420";x.fillRect(0,0,c.width,c.height);const TIPS=[];for(let i=0;i<7;i++)TIPS.push({x:c.width*(.2+i*.1),y:c.height*.88,a:-1.5708+(Math.random()-.5)*.6,dep:0});let cnt=0;(function lp(){for(let k=0;k<14;k++){for(const t2 of TIPS){const ox=t2.x,oy=t2.y;t2.a+=(Math.random()-.5)*.24;t2.x+=Math.cos(t2.a)*2.2;t2.y+=Math.sin(t2.a)*2.2;x.strokeStyle=`hsla(${170+t2.dep*4},80%,${45+t2.dep*2}%,.8)`;x.lineWidth=Math.max(.6,5-t2.dep*.4);x.beginPath();x.moveTo(ox,oy);x.lineTo(t2.x,t2.y);x.stroke();t2.dep++;if(t2.dep>34&&Math.random()<.06){t2.dep=0;t2.a+=(Math.random()<.5?1:-1)*.7}}cnt++;if(cnt>3000&&!cnt)TIPS.length=0}x.fillStyle="rgba(6,20,32,.012)";x.fillRect(0,0,c.width,c.height);requestAnimationFrame(lp)})();</script></div></body></html>
