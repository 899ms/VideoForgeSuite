<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#050505;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}canvas{width:100vw;height:100vh}</style></head><body><canvas id="cv" width="1920" height="1080"></canvas><script>const cv=document.getElementById("cv"),ctx=cv.getContext("2d");function f(t){ctx.fillStyle="#050505";ctx.fillRect(0,0,1920,1080);const x=960+Math.sin(t/1600)*580,y=540+Math.cos(t/2100)*300;ctx.strokeStyle="rgba(56,189,248,.6)";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,1080);ctx.moveTo(0,y);ctx.lineTo(1920,y);ctx.stroke();ctx.strokeStyle="#38bdf8";ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(x,y,26,0,7);ctx.stroke();ctx.beginPath();ctx.arc(x,y,4,0,7);ctx.fillStyle="#38bdf8";ctx.fill();ctx.font="16px Consolas";ctx.fillStyle="rgba(56,189,248,.8)";ctx.fillText(`x:${x|0} y:${y|0}`,x+34,y-12);requestAnimationFrame(f)}requestAnimationFrame(f)</script></body></html>
