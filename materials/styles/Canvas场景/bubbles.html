<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>上浮气泡</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
.bg{position:fixed;inset:0;background:radial-gradient(70% 70% at 50% 45%,#48C6EFcc 0%,transparent 72%),radial-gradient(55% 55% at 18% 82%,#6F86D6aa 0%,transparent 70%),radial-gradient(55% 55% at 82% 18%,#B2FEFAaa 0%,transparent 70%),linear-gradient(135deg,#2b2542,#171428);animation:hue 22s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}canvas{width:100%;height:100%;display:block}
.txt{color:#fff;font-weight:900;text-align:center}
</style></head>
<body><div class="bg"></div><div id="stage"><canvas id="cv"></canvas></div>
<script>var cv=document.getElementById('cv'),x=cv.getContext('2d');
function rs(){cv.width=innerWidth;cv.height=innerHeight;}rs();addEventListener('resize',rs);var B=[];(function loop(){requestAnimationFrame(loop);x.fillStyle='rgba(10,20,40,0.15)';x.fillRect(0,0,cv.width,cv.height);if(B.length<60)B.push({x:Math.random()*cv.width,y:cv.height+20,r:4+Math.random()*16,v:0.6+Math.random()*1.4});for(var i=B.length-1;i>=0;i--){var b=B[i];b.y-=b.v;if(b.y<-20){B.splice(i,1);continue;}x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.strokeStyle='rgba(160,220,255,0.6)';x.lineWidth=1.5;x.stroke();x.fillStyle='rgba(160,220,255,0.12)';x.fill();}})();</script></body></html>
