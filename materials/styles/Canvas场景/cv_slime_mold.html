<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>黏菌网络</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#0d0d0f}canvas{position:absolute;inset:0;width:100%;height:100%}
</style></head>
<body><div id="stage"><canvas id="cv"></canvas><script>const c=document.getElementById("cv"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;x.fillStyle="#0d0d0f";x.fillRect(0,0,c.width,c.height);const P=[];const src=[{x:c.width*.5,y:c.height*.5},{x:c.width*.22,y:c.height*.3},{x:c.width*.78,y:c.height*.7}];for(let i=0;i<400;i++)P.push({x:src[i%3].x,y:src[i%3].y,a:Math.random()*6.28});const dt=(x0,y0)=>Math.min(...src.map(s=>Math.hypot(s.x-x0,s.y-y0)));(function lp(){for(const p of P){const l=dt(p.x+Math.cos(p.a+.3)*12,p.y+Math.sin(p.a+.3)*12),r=dt(p.x+Math.cos(p.a-.3)*12,p.y+Math.sin(p.a-.3)*12);if(l<r)p.a+=.35;else if(r<l)p.a-=.35;p.a+=(Math.random()-.5)*.1;p.x+=Math.cos(p.a)*1.4;p.y+=Math.sin(p.a)*1.4;p.x=(p.x+c.width)%c.width;p.y=(p.y+c.height)%c.height;x.fillStyle="rgba(255,176,0,.30)";x.fillRect(p.x,p.y,1.6,1.6)}x.fillStyle="rgba(13,13,15,.012)";x.fillRect(0,0,c.width,c.height);requestAnimationFrame(lp)})();</script></div></body></html>
