<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>闪烁星海</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
.bg{position:fixed;inset:0;background:radial-gradient(70% 70% at 50% 45%,#fffcc 0%,transparent 72%),radial-gradient(55% 55% at 18% 82%,#29D3E6aa 0%,transparent 70%),radial-gradient(55% 55% at 82% 18%,#7C6CF5aa 0%,transparent 70%),linear-gradient(135deg,#2b2542,#171428);animation:hue 22s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}canvas{width:100%;height:100%;display:block}
.txt{color:#fff;font-weight:900;text-align:center}
</style></head>
<body><div class="bg"></div><div id="stage"><canvas id="cv"></canvas></div>
<script>var cv=document.getElementById('cv'),x=cv.getContext('2d');
function rs(){cv.width=innerWidth;cv.height=innerHeight;}rs();addEventListener('resize',rs);var S=[];for(var i=0;i<220;i++)S.push({x:Math.random()*cv.width,y:Math.random()*cv.height,ph:Math.random()*7,sp:0.5+Math.random()});var t=0;(function loop(){requestAnimationFrame(loop);t+=0.05;x.fillStyle='#05040c';x.fillRect(0,0,cv.width,cv.height);for(var i=0;i<S.length;i++){var s=S[i];var a=0.4+0.6*Math.abs(Math.sin(t*s.sp+s.ph));x.beginPath();x.arc(s.x,s.y,1.6,0,7);x.fillStyle='rgba(255,255,255,'+a+')';x.fill();}})();</script></body></html>
