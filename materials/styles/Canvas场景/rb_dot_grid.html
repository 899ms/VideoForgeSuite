<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#f4f4f5;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}canvas{width:100vw;height:100vh}</style></head><body><canvas id="cv" width="1920" height="1080"></canvas><script>const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),G=36;function f(t){ctx.fillStyle="#f4f4f5";ctx.fillRect(0,0,1920,1080);const cx=960+Math.sin(t/1300)*500,cy=540+Math.cos(t/1700)*260;for(let x=0;x<1920;x+=G)for(let y=0;y<1080;y+=G){const d=Math.hypot(x-cx,y-cy),r=Math.max(0,1-d/380);ctx.fillStyle=`rgba(24,24,27,${.12+r*.85})`;ctx.beginPath();ctx.arc(x,y,2+r*5,0,7);ctx.fill()}requestAnimationFrame(f)}requestAnimationFrame(f)</script></body></html>
