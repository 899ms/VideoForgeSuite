<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>等离子</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
.bg{position:fixed;inset:0;background:radial-gradient(70% 70% at 50% 45%,#7C6CF5cc 0%,transparent 72%),radial-gradient(55% 55% at 18% 82%,#FF5C8Aaa 0%,transparent 70%),radial-gradient(55% 55% at 82% 18%,#29D3E6aa 0%,transparent 70%),linear-gradient(135deg,#2b2542,#171428);animation:hue 22s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}canvas{width:100%;height:100%;display:block}
.txt{color:#fff;font-weight:900;text-align:center}
</style></head>
<body><div class="bg"></div><div id="stage"><canvas id="cv"></canvas></div>
<script>var cv=document.getElementById('cv'),x=cv.getContext('2d');
function rs(){cv.width=innerWidth;cv.height=innerHeight;}rs();addEventListener('resize',rs);var t=0;(function loop(){requestAnimationFrame(loop);t+=0.04;var img=x.createImageData(cv.width,cv.height);for(var y=0;y<cv.height;y+=2)for(var xx=0;xx<cv.width;xx+=2){var v=Math.sin(xx*0.02+t)+Math.sin(y*0.02+t)+Math.sin((xx+y)*0.02+t)+Math.sin(Math.hypot(xx-cv.width/2,y-cv.height/2)*0.02-t);var c=Math.floor((v+4)/8*255);var idx=(y*cv.width+xx)*4;img.data[idx]=c;img.data[idx+1]=120+Math.floor(80*Math.sin(v));img.data[idx+2]=255-c;img.data[idx+3]=255;}x.putImageData(img,0,0);})();</script></body></html>
