<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>融合球</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
.bg{position:fixed;inset:0;background:radial-gradient(70% 70% at 50% 45%,#7C6CF5cc 0%,transparent 72%),radial-gradient(55% 55% at 18% 82%,#29D3E6aa 0%,transparent 70%),radial-gradient(55% 55% at 82% 18%,#FF5C8Aaa 0%,transparent 70%),linear-gradient(135deg,#2b2542,#171428);animation:hue 22s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}canvas{width:100%;height:100%;display:block}
.txt{color:#fff;font-weight:900;text-align:center}
</style></head>
<body><div class="bg"></div><div id="stage"><canvas id="cv"></canvas></div>
<script>var cv=document.getElementById('cv'),x=cv.getContext('2d');
function rs(){cv.width=innerWidth;cv.height=innerHeight;}rs();addEventListener('resize',rs);var M=[];for(var i=0;i<5;i++)M.push({x:Math.random()*cv.width,y:Math.random()*cv.height,vx:(Math.random()-.5)*2,vy:(Math.random()-.5)*2,r:60+Math.random()*40});var t=0;(function loop(){requestAnimationFrame(loop);t+=0.01;for(var i=0;i<M.length;i++){var m=M[i];m.x+=m.vx;m.y+=m.vy;if(m.x<0||m.x>cv.width)m.vx*=-1;if(m.y<0||m.y>cv.height)m.vy*=-1;}x.fillStyle='#0e0c16';x.fillRect(0,0,cv.width,cv.height);x.globalCompositeOperation='lighter';for(var k=0;k<3;k++){x.fillStyle=['rgba(124,108,245,0.5)','rgba(41,211,230,0.5)','rgba(255,92,138,0.5)'][k];for(var i=0;i<M.length;i++){var m=M[i];var g=x.createRadialGradient(m.x,m.y,0,m.x,m.y,m.r);g.addColorStop(0,'rgba(255,255,255,0.7)');g.addColorStop(1,'transparent');x.fillStyle=g;x.beginPath();x.arc(m.x+(k*20),m.y,m.r,0,7);x.fill();}}x.globalCompositeOperation='source-over';})();</script></body></html>
