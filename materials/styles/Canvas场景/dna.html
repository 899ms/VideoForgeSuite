<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>DNA 螺旋</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
.bg{position:fixed;inset:0;background:radial-gradient(70% 70% at 50% 45%,#29D3E6cc 0%,transparent 72%),radial-gradient(55% 55% at 18% 82%,#FF5C8Aaa 0%,transparent 70%),radial-gradient(55% 55% at 82% 18%,#7C6CF5aa 0%,transparent 70%),linear-gradient(135deg,#2b2542,#171428);animation:hue 22s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}canvas{width:100%;height:100%;display:block}
.txt{color:#fff;font-weight:900;text-align:center}
</style></head>
<body><div class="bg"></div><div id="stage"><canvas id="cv"></canvas></div>
<script>var cv=document.getElementById('cv'),x=cv.getContext('2d');
function rs(){cv.width=innerWidth;cv.height=innerHeight;}rs();addEventListener('resize',rs);var t=0;(function loop(){requestAnimationFrame(loop);t+=0.03;x.clearRect(0,0,cv.width,cv.height);var cx=cv.width/2,n=24;for(var i=0;i<n;i++){var y=i/cv.height*cv.height*0.9+20;var a=t+i*0.4;var x1=cx+Math.cos(a)*90,y1=y;var x2=cx+Math.cos(a+Math.PI)*90,y2=y;x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);x.strokeStyle='rgba(124,108,245,'+(0.3+0.5*Math.abs(Math.sin(a)))+')';x.lineWidth=2;x.stroke();x.beginPath();x.arc(x1,y1,5,0,7);x.fillStyle='#29D3E6';x.fill();x.beginPath();x.arc(x2,y2,5,0,7);x.fillStyle='#FF5C8A';x.fill();}})();</script></body></html>
