<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#09090b;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}canvas{width:100vw;height:100vh}</style></head><body><canvas id="cv" width="1920" height="1080"></canvas><script>const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),P=[];setInterval(()=>{for(let b=0;b<3;b++){const x=180+Math.random()*1560,y=180+Math.random()*720;for(let i=0;i<16;i++){const a=Math.PI*2*i/16,sp=5+Math.random()*3;P.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,l:60})}}},500);(function f(){ctx.fillStyle="rgba(9,9,11,.28)";ctx.fillRect(0,0,1920,1080);for(let i=P.length-1;i>=0;i--){const p=P[i];p.x+=p.vx;p.y+=p.vy;p.vx*=.96;p.vy*=.96;p.l--;if(p.l<=0){P.splice(i,1);continue}ctx.strokeStyle=`rgba(255,220,120,${p.l/60})`;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(p.x-p.vx*2.2,p.y-p.vy*2.2);ctx.stroke()}requestAnimationFrame(f)})()</script></body></html>
