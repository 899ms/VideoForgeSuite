<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#010104;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}canvas{width:100vw;height:100vh}</style></head><body><canvas id="cv" width="1920" height="1080"></canvas><script>const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),S=[];for(let i=0;i<340;i++)S.push({x:(Math.random()-.5)*2000,y:(Math.random()-.5)*2000,z:Math.random()*1+.05});function f(){ctx.fillStyle="rgba(1,1,4,.35)";ctx.fillRect(0,0,1920,1080);ctx.translate(960,540);S.forEach(s=>{s.z-=.012;if(s.z<=.02){s.x=(Math.random()-.5)*2000;s.y=(Math.random()-.5)*2000;s.z=1}const k=1/s.z,x=s.x*k,y=s.y*k;if(Math.abs(x)<960&&Math.abs(y)<540){ctx.strokeStyle=`rgba(180,200,255,${(1-s.z)*1.2})`;ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x*k*1.08,y*k*1.08);ctx.stroke()}});ctx.setTransform(1,0,0,1,0,0);requestAnimationFrame(f)}requestAnimationFrame(f)</script></body></html>
