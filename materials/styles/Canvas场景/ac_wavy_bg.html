<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#020617;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}canvas{width:100vw;height:100vh;opacity:.9}</style></head><body><canvas id="cv" width="1920" height="1080"></canvas><script>const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),N=90;function f(t){ctx.fillStyle="#020617";ctx.fillRect(0,0,1920,1080);for(let i=0;i<N;i++){const p=i/N,bx=i*22,by=200+Math.sin(t/1400+p*Math.PI*3)*140+Math.cos(t/1000+p*7)*70,hue=230+p*90;ctx.fillStyle=`hsla(${hue},80%,62%,.5)`;ctx.beginPath();ctx.arc(bx,by,7,0,7);ctx.fill()}requestAnimationFrame(f)}requestAnimationFrame(f)</script></body></html>
