<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0a;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}canvas{width:100vw;height:100vh}</style></head><body><canvas id="cv" width="1920" height="1080"></canvas><script>const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),rows=9,cols=22;function f(t){ctx.fillStyle="#0a0a0a";ctx.fillRect(0,0,1920,1080);const cx=960+Math.sin(t/1500)*620,cy=540+Math.cos(t/1900)*330;for(let i=0;i<rows;i++)for(let j=0;j<cols;j++){const bx=180+j*(1560/(cols-1)),by=180+i*(720/(rows-1)),dx=cx-bx,dy=cy-by,d=Math.hypot(dx,dy),p=Math.max(0,1-d/300),L=46*(0.4+p);ctx.strokeStyle=`rgba(167,139,250,${.4+p*.6})`;ctx.lineWidth=3.5;ctx.beginPath();ctx.moveTo(bx,by);ctx.lineTo(bx+dx/d*L*p+ (1-p)*(Math.sin(t/800+i+j)*8),by+dy/d*L*p);ctx.stroke()}requestAnimationFrame(f)}requestAnimationFrame(f)</script></body></html>
