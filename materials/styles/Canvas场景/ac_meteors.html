<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#020617;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}canvas{width:100vw;height:100vh}</style></head><body><canvas id="cv" width="1920" height="1080"></canvas><script>const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),M=[];setInterval(()=>{M.push({x:Math.random()*2100-100,y:-60,vx:-(3+Math.random()*4),vy:6+Math.random()*5,l:1})},160);function f(){ctx.fillStyle="#020617";ctx.fillRect(0,0,1920,1080);M.forEach(m=>{m.x+=m.vx;m.y+=m.vy;if(m.y>1150)m.y=-60;if(m.x<-200)m.x=2000;const g=ctx.createLinearGradient(m.x,m.y,m.x-m.vx*16,m.y-m.vy*16);g.addColorStop(0,"#e0f2fe");g.addColorStop(1,"transparent");ctx.strokeStyle=g;ctx.lineWidth=3.5;ctx.beginPath();ctx.moveTo(m.x,m.y);ctx.lineTo(m.x-m.vx*16,m.y-m.vy*16);ctx.stroke()});requestAnimationFrame(f)}requestAnimationFrame(f)</script></body></html>
