<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>双摆混沌</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#08090d;display:grid;place-items:center}canvas{position:absolute;inset:0;width:100%;height:100%}
</style></head>
<body><div id="stage"><canvas id="cv"></canvas><script>const c=document.getElementById("cv"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const L1=c.height*.22,L2=c.height*.22;let a1=Math.PI/2,a2=Math.PI/2+.2,a1v=0,a2v=0,g=1,m1=1.2,m2=1;const cx=c.width/2,cy=c.height*.32;x.fillStyle="#08090d";x.fillRect(0,0,c.width,c.height);(function lp(){for(let k=0;k<3;k++){const d1=-g*(2*m1+m2)*Math.sin(a1)-g*m2*Math.sin(a1-2*a2)-2*Math.sin(a1-a2)*m2*(a2v*a2v*L2+a1v*a1v*L1*Math.cos(a1-a2));const den=2*m1+m2-m2*Math.cos(2*a1-2*a2);const d1v=d1/(L1*den);const d2v=2*Math.sin(a1-a2)*(a1v*a1v*L1*(m1+m2)+g*(m1+m2)*Math.cos(a1)+a2v*a2v*L2*m2*Math.cos(a1-a2))/(L2*den);a1v+=d1v*.016;a2v+=d2v*.016;a1+=a1v*.016;a2+=a2v*.016}const x1=cx+L1*Math.sin(a1),y1=cy+L1*Math.cos(a1),x2=x1+L2*Math.sin(a2),y2=y1+L2*Math.cos(a2);x.fillStyle="rgba(8,9,13,.02)";x.fillRect(0,0,c.width,c.height);x.strokeStyle="#e91e63";x.fillStyle="#e91e63";x.beginPath();x.arc(x2,y2,1.4,0,6.28);x.fill();x.strokeStyle="#37474f";x.beginPath();x.moveTo(cx,cy);x.lineTo(x1,y1);x.lineTo(x2,y2);x.stroke();x.fillStyle="#90a4ae";x.beginPath();x.arc(x1,y1,4,0,6.28);x.fill();requestAnimationFrame(lp)})();</script></div></body></html>
