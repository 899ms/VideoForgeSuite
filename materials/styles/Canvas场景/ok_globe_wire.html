<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#020617;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}canvas{width:100vw;height:100vh}</style></head><body><canvas id="cv" width="1920" height="1080"></canvas><script>const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),R=320;function f(t){ctx.fillStyle="#020617";ctx.fillRect(0,0,1920,1080);ctx.translate(960,540);const ry=t/2400,rx=Math.sin(t/6000)*.35;function P3(la,lo){let x=Math.cos(la)*Math.cos(lo+ry),y=Math.sin(la),z=Math.sin(la+0)*0+Math.cos(la)*Math.sin(lo+ry);const y2=y*Math.cos(rx)-z*Math.sin(rx),z2=y*Math.sin(rx)+z*Math.cos(rx);return[x*R,y2*R,z2]}for(let la=-Math.PI/2;la<=Math.PI/2;la+=Math.PI/12){ctx.beginPath();let started=false;for(let lo=0;lo<=Math.PI*2+.1;lo+=.08){const[x,y,z]=P3(la,lo);if(z<0){ctx.lineTo(x,y);started=true}else{ctx.moveTo(x,y);started=false}}ctx.strokeStyle="rgba(56,189,248,.22)";ctx.lineWidth=1.4;ctx.stroke()}for(let lo=0;lo<Math.PI*2;lo+=Math.PI/12){ctx.beginPath();let started=false;for(let la=-Math.PI/2;la<=Math.PI/2+.02;la+=.06){const[x,y,z]=P3(la,lo);if(z<0){ctx.lineTo(x,y);started=true}else{ctx.moveTo(x,y);started=false}}ctx.strokeStyle="rgba(167,139,250,.28)";ctx.lineWidth=1.4;ctx.stroke()}ctx.setTransform(1,0,0,1,0,0);requestAnimationFrame(f)}requestAnimationFrame(f)</script></body></html>
