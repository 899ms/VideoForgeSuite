<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>鸟群</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:linear-gradient(#0d1b2a,#1b263b)}canvas{position:absolute;inset:0;width:100%;height:100%}
</style></head>
<body><div id="stage"><canvas id="cv"></canvas><script>const c=document.getElementById("cv"),x=c.getContext("2d");const W=()=>c.width=c.clientWidth,H=()=>c.height=c.clientHeight;W();H();const N=90,B=[];for(let i=0;i<N;i++)B.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:Math.cos(i)*2,vy:Math.sin(i)*2});function lp(){x.fillStyle="#0d1b2a";x.fillRect(0,0,c.width,c.height);for(const b of B){let cx=0,cy=0,vx=0,vy=0,n=0;for(const o of B){if(o===b)continue;const d=(o.x-b.x)**2+(o.y-b.y)**2;if(d<9000){cx+=o.x;cy+=o.y;vx+=o.vx;vy+=o.vy;n++}}if(n){b.vx+=((cx/n-b.x)*.002+(vx/n-b.vx)*.05)*3;b.vy+=((cy/n-b.y)*.002+(vy/n-b.vy)*.05)*3}if(b.x<50)b.vx+=.3;if(b.x>c.width-50)b.vx-=.3;if(b.y<50)b.vy+=.3;if(b.y>c.height-50)b.vy-=.3;b.x+=b.vx;b.y+=b.vy;x.save();x.translate(b.x,b.y);x.rotate(Math.atan2(b.vy,b.vx));x.fillStyle="#e0f2f1";x.beginPath();x.moveTo(6,0);x.lineTo(-4,3);x.lineTo(-4,-3);x.fill();x.restore()}requestAnimationFrame(lp)}lp();</script></div></body></html>
