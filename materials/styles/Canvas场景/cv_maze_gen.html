<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>迷宫生成</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#0b0f1a;display:grid;place-items:center}canvas{position:absolute;inset:0;width:100%;height:100%}
</style></head>
<body><div id="stage"><canvas id="cv"></canvas><script>const c=document.getElementById("cv"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const S=22,C=Math.ceil(c.width/S),R=Math.ceil(c.height/S);let cells;function init(){cells=Array.from({length:R},()=>Array(C).fill(15))}init();const st=[[0,0]];const vis=Array.from({length:R},()=>Array(C).fill(0));vis[0][0]=1;const DM={1:[0,-1,4],2:[1,0,8],4:[0,1,1],8:[-1,0,2]};let cur=null;(function lp(){for(let k=0;k<30&&st.length;k++){if(!cur){cur=st[st.length-1]}const[cx,cy]=cur;const nbs=[];for(const k2 in DM){const[mx,my,op]=DM[k2];const nx=cx+mx,ny=cy+my;if(nx>=0&&nx<C&&ny>=0&&ny<R&&!vis[ny][nx])nbs.push([nx,ny,+k2,op])}if(nbs.length){const[nx,ny,dir,op]=nbs[Math.random()*nbs.length|0];cells[cy][cx]&=~(1<<dir);cells[ny][nx]&=~op;vis[ny][nx]=1;st.push([nx,ny]);cur=[nx,ny]}else{st.pop();cur=st[st.length-1]||null}}x.fillStyle="#0b0f1a";x.fillRect(0,0,c.width,c.height);x.strokeStyle="#4dd0e1";x.lineWidth=2;for(let r=0;r<R;r++)for(let cc=0;cc<C;cc++){const w=cells[r][cc],px=cc*S,py=r*S;x.beginPath();if(w&1){x.moveTo(px,py);x.lineTo(px+S,py)}if(w&2){x.moveTo(px+S,py);x.lineTo(px+S,py+S)}if(w&4){x.moveTo(px,py+S);x.lineTo(px+S,py+S)}if(w&8){x.moveTo(px,py);x.lineTo(px,py+S)}x.stroke()}if(!st.length){setTimeout(()=>{init();vis.forEach(a=>a.fill(0));st.push([0,0]);vis[0][0]=1;cur=null},1800)}requestAnimationFrame(lp)})();</script></div></body></html>
