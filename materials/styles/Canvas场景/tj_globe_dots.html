<!doctype html><html lang=zh><head><meta charset=utf-8>
<style>html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#0c1440,#010208 75%)}
.t{position:absolute;left:50%;top:11%;transform:translateX(-50%);font-size:26px;font-weight:800;color:#93c5fd;letter-spacing:8px;z-index:2}</style></head><body>
<div class=t>DOT GLOBE</div>
<canvas id=c style="position:absolute;inset:0"></canvas>
<script>
var c=document.getElementById('c'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
var pts=[];
for(var i=0;i<1300;i++){var t=Math.random()*Math.PI*2,p=Math.acos(2*Math.random()-1);
pts.push({t:t,p:p,k:Math.random()});}
var ry=0;
function f(){x.fillStyle='rgba(1,2,8,.3)';x.fillRect(0,0,c.width,c.height);ry+=0.006;
var R=230;
for(var i=0;i<pts.length;i++){var q=pts[i];
var X=R*Math.sin(q.p)*Math.cos(q.t+ry),Y=R*Math.cos(q.p),Z=R*Math.sin(q.p)*Math.sin(q.t+ry);
var sc=560/(560+Z);var sx=c.width/2+X*sc,sy=c.height*0.52+Y*sc;
var front=Z<0;var sz=(front?1.7:0.9)*sc;
x.fillStyle=front?'rgba(147,197,253,'+(0.35+0.5*q.k)+')':'rgba(99,102,241,.18)';
x.beginPath();x.arc(sx,sy,sz,0,7);x.fill();}
x.strokeStyle='rgba(96,165,250,.25)';x.lineWidth=1.2;
x.beginPath();x.ellipse(c.width/2,c.height*0.52,R*0.98,R*0.3,0,0,7);x.stroke();
requestAnimationFrame(f);}
f();
setTimeout(function(){try{document.getAnimations().forEach(function(a){a.pause()})}catch(e){}},2600);</script></body></html>
