<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0a;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}canvas{width:100vw;height:100vh}</style></head><body><canvas id="cv" width="1920" height="1080"></canvas><script>const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),S=60;function f(t){ctx.fillStyle="#0a0a0a";ctx.fillRect(0,0,1920,1080);for(let x=0;x<1920;x+=S)for(let y=0;y<1080;y+=S){const v=(Math.sin(x/300+t/700)+Math.cos(y/260-t/900))/2,a=.08+Math.max(0,v)*.7;ctx.fillStyle=`rgba(56,189,248,${a})`;ctx.fillRect(x+4,y+4,S-8,S-8)}requestAnimationFrame(f)}requestAnimationFrame(f)</script></body></html>
