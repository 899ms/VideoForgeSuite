<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>科赫雪花</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#0a1220;display:grid;place-items:center}canvas{position:absolute;inset:0;width:100%;height:100%}
</style></head>
<body><div id="stage"><canvas id="cv"></canvas><script>const c=document.getElementById("cv"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;let d=0;(function lp(){d=(d+.02)%5;x.fillStyle="#0a1220";x.fillRect(0,0,c.width,c.height);const lv=Math.min(4,Math.floor(d));x.strokeStyle="#4dd0e1";x.lineWidth=1.4;const R=c.height*.36,cx=c.width/2,cy=c.height/2;function koch(x1,y1,x2,y2,dep){if(dep==0){x.moveTo(x1,y1);x.lineTo(x2,y2);return}const dx=(x2-x1)/3,dy=(y2-y1)/3;const ax=x1+dx,ay=y1+dy,bx=x1+2*dx,by=y1+2*dy;const mx=(x1+x2)/2+Math.sqrt(3)/6*(y1-y2)*-1,my=(y1+y2)/2+Math.sqrt(3)/6*(x2-x1)*-1;koch(x1,y1,ax,ay,dep-1);koch(ax,ay,mx,my,dep-1);koch(mx,my,bx,by,dep-1);koch(bx,by,x2,y2,dep-1)}x.beginPath();for(let i=0;i<3;i++){const a1=2.094*i-1.5708,a2=2.094*(i+1)-1.5708;koch(cx+R*Math.cos(a1),cy+R*Math.sin(a1),cx+R*Math.cos(a2),cy+R*Math.sin(a2),lv)}x.stroke();requestAnimationFrame(lp)})();</script></div></body></html>
