<!doctype html><html lang=zh><head><meta charset=utf-8>
<style>html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#0b1120,#000 80%)}
.t{position:absolute;left:50%;top:12%;transform:translateX(-50%);font-size:26px;font-weight:800;color:#7dd3fc;letter-spacing:8px;z-index:2}</style></head><body>
<div class=t>PARTICLE SPHERE</div>
<canvas id=c style="position:absolute;inset:0"></canvas>
<script>
var c=document.getElementById('c'),x=c.getContext('2d');
c.width=innerWidth;c.height=innerHeight;
var N=900,pts=[];
for(var i=0;i<N;i++){var th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);
pts.push({t:th,p:ph,s:0.4+Math.random()*1.4,h:190+Math.random()*60});}
var ry=0;
function proj(t,p,ry){var R=240;
var X=R*Math.sin(p)*Math.cos(t+ry),Y=R*Math.cos(p),Z=R*Math.sin(p)*Math.sin(t+ry);
var sc=520/(520+Z);return{x:c.width/2+X*sc,y:c.height/2+Y*sc,z:Z,s:sc};}
function f(){x.fillStyle='rgba(2,6,23,.25)';x.fillRect(0,0,c.width,c.height);ry+=0.008;
for(var i=0;i<N;i++){var q=proj(pts[i].t,pts[i].p,ry);
var sz=pts[i].s*q.s*2.2,al=0.25+0.55*((q.z+240)/480);
x.fillStyle='hsla('+pts[i].h+',95%,68%,'+al+')';
x.beginPath();x.arc(q.x,q.y,sz,0,7);x.fill();}
requestAnimationFrame(f);}
f();
setTimeout(function(){try{document.getAnimations().forEach(function(a){a.pause()})}catch(e){}},2600);</script></body></html>
