<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>巴恩斯利蕨</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#07130c;display:grid;place-items:center}canvas{position:absolute;inset:0;width:100%;height:100%}
</style></head>
<body><div id="stage"><canvas id="cv"></canvas><script>const c=document.getElementById("cv"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;x.fillStyle="#07130c";x.fillRect(0,0,c.width,c.height);let px=0,py=0,k=0;(function lp(){x.fillStyle="rgba(74,222,128,.65)";for(let i=0;i<160;i++){const r=Math.random();let nx,ny;if(r<.01){nx=0;ny=.16*py}else if(r<.86){nx=.85*px+.04*py;ny=-.04*px+.85*py+1.6}else if(r<.93){nx=.2*px-.26*py;ny=.23*px+.22*py+1.6}else{nx=-.15*px+.28*py;ny=.26*px+.24*py+.44}px=nx;py=ny;x.fillRect(c.width/2+px*c.width/5.4,c.height-8-py*c.height/2.4,1.6,1.6)}requestAnimationFrame(lp)})();</script></div></body></html>
