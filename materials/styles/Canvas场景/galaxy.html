<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>星系旋臂</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
.bg{position:fixed;inset:0;background:radial-gradient(70% 70% at 50% 45%,#fffcc 0%,transparent 72%),radial-gradient(55% 55% at 18% 82%,#7C6CF5aa 0%,transparent 70%),radial-gradient(55% 55% at 82% 18%,#29D3E6aa 0%,transparent 70%),linear-gradient(135deg,#2b2542,#171428);animation:hue 22s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}canvas{width:100%;height:100%;display:block}
.txt{color:#fff;font-weight:900;text-align:center}
</style></head>
<body><div class="bg"></div><div id="stage"><canvas id="cv"></canvas></div>
<script>var cv=document.getElementById('cv'),x=cv.getContext('2d');
function rs(){cv.width=innerWidth;cv.height=innerHeight;}rs();addEventListener('resize',rs);var stars=[];for(var i=0;i<420;i++)stars.push({a:Math.random()*7,r:20+Math.random()*Math.min(cv.width,cv.height)*0.45,sp:0.002+Math.random()*0.01});var t=0;(function loop(){requestAnimationFrame(loop);t+=0.005;x.fillStyle='rgba(6,4,14,0.2)';x.fillRect(0,0,cv.width,cv.height);var cx=cv.width/2,cy=cv.height/2;for(var i=0;i<stars.length;i++){var s=stars[i],ang=s.a+t*(1+s.sp*20)*2;var px=cx+Math.cos(ang)*s.r,py=cy+Math.sin(ang)*s.r;var hue=(s.r*0.5)%360;x.beginPath();x.arc(px,py,1.4,0,7);x.fillStyle='hsl('+hue+',80%,70%)';x.fill();}x.beginPath();x.arc(cx,cy,18,0,7);x.fillStyle='#fff';x.fill();})();</script></body></html>
