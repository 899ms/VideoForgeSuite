<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>雨幕</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
.bg{position:fixed;inset:0;background:radial-gradient(70% 70% at 50% 45%,#48C6EFcc 0%,transparent 72%),radial-gradient(55% 55% at 18% 82%,#6F86D6aa 0%,transparent 70%),radial-gradient(55% 55% at 82% 18%,#B2FEFAaa 0%,transparent 70%),linear-gradient(135deg,#2b2542,#171428);animation:hue 22s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}canvas{width:100%;height:100%;display:block}
.txt{color:#fff;font-weight:900;text-align:center}
</style></head>
<body><div class="bg"></div><div id="stage"><canvas id="cv"></canvas></div>
<script>var cv=document.getElementById('cv'),x=cv.getContext('2d');
function rs(){cv.width=innerWidth;cv.height=innerHeight;}rs();addEventListener('resize',rs);var D=[];for(var i=0;i<160;i++)D.push({x:Math.random()*cv.width,y:Math.random()*cv.height,s:4+Math.random()*8});(function loop(){requestAnimationFrame(loop);x.fillStyle='rgba(10,12,24,0.25)';x.fillRect(0,0,cv.width,cv.height);x.strokeStyle='rgba(120,200,255,0.55)';x.lineWidth=1.4;for(var i=0;i<D.length;i++){var d=D[i];d.y+=d.s;d.x+=d.s*0.3;if(d.y>cv.height){d.y=-10;d.x=Math.random()*cv.width;}x.beginPath();x.moveTo(d.x,d.y);x.lineTo(d.x-d.s*0.3,d.y-d.s*2.2);x.stroke();}})();</script></body></html>
