<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>火焰余烬</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
.bg{position:fixed;inset:0;background:radial-gradient(70% 70% at 50% 45%,#FF6A00cc 0%,transparent 72%),radial-gradient(55% 55% at 18% 82%,#FF2D95aa 0%,transparent 70%),radial-gradient(55% 55% at 82% 18%,#FFD200aa 0%,transparent 70%),linear-gradient(135deg,#2b2542,#171428);animation:hue 22s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}canvas{width:100%;height:100%;display:block}
.txt{color:#fff;font-weight:900;text-align:center}
</style></head>
<body><div class="bg"></div><div id="stage"><canvas id="cv"></canvas></div>
<script>var cv=document.getElementById('cv'),x=cv.getContext('2d');
function rs(){cv.width=innerWidth;cv.height=innerHeight;}rs();addEventListener('resize',rs);var P=[];(function loop(){requestAnimationFrame(loop);x.fillStyle='rgba(8,4,10,0.18)';x.fillRect(0,0,cv.width,cv.height);if(P.length<120)P.push({x:cv.width/2+(Math.random()-.5)*60,y:cv.height,vx:(Math.random()-.5)*1,vy:-(2+Math.random()*3),life:1});for(var i=P.length-1;i>=0;i--){var p=P[i];p.x+=p.vx;p.y+=p.vy;p.vy-=0.02;p.life-=0.012;if(p.life<=0){P.splice(i,1);continue;}var g=x.createRadialGradient(p.x,p.y,0,p.x,p.y,10);g.addColorStop(0,'rgba(255,'+Math.floor(160*p.life)+',40,'+p.life+')');g.addColorStop(1,'transparent');x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,10,0,7);x.fill();}})();</script></body></html>
