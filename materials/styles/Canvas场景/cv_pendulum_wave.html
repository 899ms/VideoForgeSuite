<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>钟摆波</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#0a0e14;display:grid;place-items:center}canvas{position:absolute;inset:0;width:100%;height:100%}
</style></head>
<body><div id="stage"><canvas id="cv"></canvas><script>const c=document.getElementById("cv"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const N=15,t0=performance.now();(function lp(){x.fillStyle="#0a0e14";x.fillRect(0,0,c.width,c.height);x.strokeStyle="#33415566";x.beginPath();x.moveTo(c.width*.5,40);x.lineTo(c.width*.5,40);x.stroke();const t=(performance.now()-t0)/1000;for(let i=0;i<N;i++){const f=.55+i*.035,px=c.width*.5+Math.sin(t*6.28*f)*c.width*.32,py=90+i*(c.height-160)/N;x.strokeStyle="#22d3ee44";x.beginPath();x.moveTo(c.width*.5,60);x.lineTo(px,py);x.stroke();x.fillStyle=i%2?"#22d3ee":"#ffca28";x.beginPath();x.arc(px,py,6,0,6.28);x.fill()}requestAnimationFrame(lp)})();</script></div></body></html>
