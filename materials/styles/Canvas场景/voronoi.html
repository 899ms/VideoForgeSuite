<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>细胞网格</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
.bg{position:fixed;inset:0;background:radial-gradient(70% 70% at 50% 45%,#7C6CF5cc 0%,transparent 72%),radial-gradient(55% 55% at 18% 82%,#29D3E6aa 0%,transparent 70%),radial-gradient(55% 55% at 82% 18%,#FF5C8Aaa 0%,transparent 70%),linear-gradient(135deg,#2b2542,#171428);animation:hue 22s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}canvas{width:100%;height:100%;display:block}
.txt{color:#fff;font-weight:900;text-align:center}
</style></head>
<body><div class="bg"></div><div id="stage"><canvas id="cv"></canvas></div>
<script>var cv=document.getElementById('cv'),x=cv.getContext('2d');
function rs(){cv.width=innerWidth;cv.height=innerHeight;}rs();addEventListener('resize',rs);var pts=[];for(var i=0;i<14;i++)pts.push({x:Math.random()*cv.width,y:Math.random()*cv.height,c:['#7C6CF5','#29D3E6','#FF5C8A','#43E97B'][i%4]});var t=0;(function loop(){requestAnimationFrame(loop);t+=0.01;x.fillStyle='#0e0c16';x.fillRect(0,0,cv.width,cv.height);for(var i=0;i<pts.length;i++){pts[i].x+=Math.sin(t+i)*0.6;pts[i].y+=Math.cos(t*0.8+i)*0.6;}var step=28;for(var Y=0;Y<cv.height;Y+=step)for(var X=0;X<cv.width;X+=step){var best=1e9,bi=0;for(var i=0;i<pts.length;i++){var d=(X-pts[i].x)*(X-pts[i].x)+(Y-pts[i].y)*(Y-pts[i].y);if(d<best){best=d;bi=i;}}x.fillStyle=pts[bi].c;x.globalAlpha=0.5;x.fillRect(X,Y,step,step);}x.globalAlpha=1;})();</script></body></html>
