<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>龙卷风</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
.bg{position:fixed;inset:0;background:radial-gradient(70% 70% at 50% 45%,#29D3E6cc 0%,transparent 72%),radial-gradient(55% 55% at 18% 82%,#7C6CF5aa 0%,transparent 70%),radial-gradient(55% 55% at 82% 18%,#FF5C8Aaa 0%,transparent 70%),linear-gradient(135deg,#2b2542,#171428);animation:hue 22s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}canvas{width:100%;height:100%;display:block}
.txt{color:#fff;font-weight:900;text-align:center}
</style></head>
<body><div class="bg"></div><div id="stage"><canvas id="cv"></canvas></div>
<script>var cv=document.getElementById('cv'),x=cv.getContext('2d');
function rs(){cv.width=innerWidth;cv.height=innerHeight;}rs();addEventListener('resize',rs);var t=0;(function loop(){requestAnimationFrame(loop);t+=0.02;x.fillStyle='rgba(8,6,14,0.18)';x.fillRect(0,0,cv.width,cv.height);var cx=cv.width/2;for(var i=0;i<260;i++){var p=i/260;var y=p*cv.height;var rad=(10+p*120)*(0.6+0.4*Math.sin(t+i*0.1));var ang=t*3+i*0.3;var px=cx+Math.cos(ang)*rad,py=y;x.beginPath();x.arc(px,py,2.2,0,7);x.fillStyle='rgba(41,211,230,'+(1-p*0.6)+')';x.fill();}})();</script></body></html>
