<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>分形树</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#101418;display:grid;place-items:center}canvas{position:absolute;inset:0;width:100%;height:100%}
</style></head>
<body><div id="stage"><canvas id="cv"></canvas><script>const c=document.getElementById("cv"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;let t=0;(function lp(){t+=.006;x.fillStyle="#101418";x.fillRect(0,0,c.width,c.height);x.save();x.translate(c.width/2,c.height*.94);const sw=Math.sin(t)*.35;function br(len,dep){x.strokeStyle="rgba(129,199,132,"+(dep/11)+")";x.lineWidth=dep*.9;x.beginPath();x.moveTo(0,0);x.lineTo(0,-len);x.stroke();x.translate(0,-len);if(dep>1){x.save();x.rotate(.42+sw);br(len*.72,dep-1);x.restore();x.save();x.rotate(-.42+sw);br(len*.72,dep-1);x.restore()}}br(c.height*.16,11);x.restore();requestAnimationFrame(lp)})();</script></div></body></html>
