<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>行星轨道</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(60% 60% at 50% 50%,#0d1226,#03040a)}
.sun{position:absolute;width:9vh;height:9vh;border-radius:50%;background:radial-gradient(circle at 35% 32%,#fff7d6,#fbbf24 55%,#f59e0b);box-shadow:0 0 8vh #fbbf24aa,0 0 20vh #f59e0b44}
.orb{position:absolute;width:calc(var(--r)*2);height:calc(var(--r)*2);border:1px solid #ffffff14;border-radius:50%;animation:rot var(--d) linear infinite}
.orb i{position:absolute;left:50%;top:0;width:2.6vh;height:2.6vh;margin:-1.3vh;border-radius:50%;box-shadow:0 0 2.4vh currentColor;background:inherit}
.orb i:after{content:"";position:absolute;left:50%;top:50%;width:8vh;height:8vh;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,color 0%,transparent 65%);opacity:.35}
@keyframes rot{to{transform:rotate(360deg)}}
.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff8}
</style></head>

yle="left:9%;top:21%"></div><div class="star" style="left:82%;top:58%"></div><div class="star" style="left:55%;top:95%"></div><div class="star" style="left:28%;top:32%"></div><div class="star" style="left:1%;top:69%"></div><div class="star" style="left:74%;top:6%"></div><div class="star" style="left:47%;top:43%"></div><div class="star" style="left:20%;top:80%"></div><div class="star" style="left:93%;top:17%"></div><div class="star" style="left:66%;top:54%"></div><div class="star" style="left:39%;top:91%"></div><div class="star" style="left:12%;top:28%"></div><div class="star" style="left:85%;top:65%"></div><div class="star" style="left:58%;top:2%"></div><div class="star" style="left:31%;top:39%"></div><div class="star" style="left:4%;top:76%"></div><div class="star" style="left:77%;top:13%"></div></div></body></html>
