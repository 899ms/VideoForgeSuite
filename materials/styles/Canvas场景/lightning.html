<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>闪电</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
.bg{position:fixed;inset:0;background:radial-gradient(70% 70% at 50% 45%,#00E5FFcc 0%,transparent 72%),radial-gradient(55% 55% at 18% 82%,#FF2E97aa 0%,transparent 70%),radial-gradient(55% 55% at 82% 18%,#7C4DFFaa 0%,transparent 70%),linear-gradient(135deg,#2b2542,#171428);animation:hue 22s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}canvas{width:100%;height:100%;display:block}
.txt{color:#fff;font-weight:900;text-align:center}
</style></head>
<body><div class="bg"></div><div id="stage"><canvas id="cv"></canvas></div>
<script>var cv=document.getElementById('cv'),x=cv.getContext('2d');
function rs(){cv.width=innerWidth;cv.height=innerHeight;}rs();addEventListener('resize',rs);var bolt=[];(function loop(){requestAnimationFrame(loop);x.fillStyle='rgba(6,4,14,0.3)';x.fillRect(0,0,cv.width,cv.height);if(Math.random()<0.04){bolt=[];var x0=cv.width/2+(Math.random()-.5)*cv.width*0.4;for(var y=0;y<cv.height;y+=14){x0+=(Math.random()-.5)*40;bolt.push([x0,y]);}}x.strokeStyle='#fff';x.shadowColor='#00E5FF';x.shadowBlur=18;x.lineWidth=2.5;x.beginPath();for(var i=0;i<bolt.length;i++){if(i===0)x.moveTo(bolt[i][0],bolt[i][1]);else x.lineTo(bolt[i][0],bolt[i][1]);}x.stroke();x.shadowBlur=0;bolt=bolt.slice(0,Math.max(0,bolt.length-3));})();</script></body></html>
