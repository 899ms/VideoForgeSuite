<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>六边形脉冲</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
.bg{position:fixed;inset:0;background:radial-gradient(70% 70% at 50% 45%,#00E5FFcc 0%,transparent 72%),radial-gradient(55% 55% at 18% 82%,#7C4DFFaa 0%,transparent 70%),radial-gradient(55% 55% at 82% 18%,#FF2E97aa 0%,transparent 70%),linear-gradient(135deg,#2b2542,#171428);animation:hue 22s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}canvas{width:100%;height:100%;display:block}
.txt{color:#fff;font-weight:900;text-align:center}
</style></head>
<body><div class="bg"></div><div id="stage"><canvas id="cv"></canvas></div>
<script>var cv=document.getElementById('cv'),x=cv.getContext('2d');
function rs(){cv.width=innerWidth;cv.height=innerHeight;}rs();addEventListener('resize',rs);var t=0;(function loop(){requestAnimationFrame(loop);t+=0.03;x.fillStyle='#0a0a1f';x.fillRect(0,0,cv.width,cv.height);var cx=cv.width/2,cy=cv.height/2;for(var ring=0;ring<6;ring++){var R=ring*40+20+Math.sin(t+ring)*8;x.strokeStyle='rgba(0,229,255,'+(0.8-ring*0.12)+')';x.lineWidth=2;for(var a=0;a<6;a++){var ang=a/6*Math.PI*2+ring*0.3;var px=cx+Math.cos(ang)*R,py=cy+Math.sin(ang)*R;if(a===0)x.beginPath(),x.moveTo(px,py);else x.lineTo(px,py);}x.closePath();x.stroke();}})();</script></body></html>
