<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>彗星拖尾</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:radial-gradient(60% 60% at 70% 30%,#0b1030,#03040c)}
canvas{position:absolute;inset:0;width:100%;height:100%}
</style></head>
<body><div id="stage"><canvas id="cv" width="960" height="540"></canvas><script>const c=document.getElementById("cv"),x=c.getContext("2d");let t=0;const T=[];function fly(){const y=Math.random()*300+60;const s={x:-80,y,trail:[]};T.push(s);if(T.length>2)T.shift()}setInterval(fly,3200);fly();(function loop(){x.fillStyle="rgba(3,4,12,.28)";x.fillRect(0,0,960,540);for(const s of T){s.x+=7;s.y+=1.1;s.trail.push({x:s.x,y:s.y});if(s.trail.length>46)s.trail.shift();for(let i=0;i<s.trail.length;i++){const p=s.trail[i],k=i/s.trail.length;x.fillStyle=`rgba(140,190,255,${k*.8})`;x.beginPath();x.arc(p.x,p.y,k*7,0,6.28);x.fill()}x.fillStyle="#fff";x.shadowColor="#8cbeff";x.shadowBlur=24;x.beginPath();x.arc(s.x,s.y,8,0,6.28);x.fill();x.shadowBlur=0}for(let i=0;i<60;i++){const sx=(i*173)%960,sy=(i*97)%540;x.fillStyle="rgba(255,255,255,.4)";x.fillRect(sx,sy,1.4,1.4)}requestAnimationFrame(loop)})();</script></div></body></html>
