<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>兰顿蚂蚁</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#f5f1e6}canvas{position:absolute;inset:0;width:100%;height:100%}
</style></head>
<body><div id="stage"><canvas id="cv"></canvas><script>const c=document.getElementById("cv"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const S=6,C=Math.ceil(c.width/S),R=Math.ceil(c.height/S);const g=new Uint8Array(C*R);let ax=C>>1,ay=R>>1,d=0;const dx=[0,1,0,-1],dy=[-1,0,1,0];(function lp(){for(let k=0;k<220;k++){const i=ay*C+ax;if(g[i]){g[i]=0;x.fillStyle="#f5f1e6";x.fillRect(ax*S,ay*S,S,S);d=(d+1)%4}else{g[i]=1;x.fillStyle="#e91e63";x.fillRect(ax*S,ay*S,S,S);d=(d+3)%4}ax=(ax+dx[d]+C)%C;ay=(ay+dy[d]+R)%R}x.fillStyle="#0d47a1";x.fillRect(ax*S-1,ay*S-1,S+2,S+2);requestAnimationFrame(lp)})();</script></div></body></html>
