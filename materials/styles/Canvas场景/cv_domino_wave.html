<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>多米诺</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#0c0c14;display:grid;place-items:center}
.row{display:flex;gap:1.2vh;align-items:flex-end}
.row i{width:2.6vh;height:16vh;background:linear-gradient(#5ea8ff,#2b3f8c);border-radius:.5vh;transform-origin:bottom;animation:dm 3.4s ease-in-out infinite;animation-delay:calc(var(--i)*.09s);box-shadow:0 0 2vh #5ea8ff44}
@keyframes dm{0%,100%{transform:rotate(0)}12%{transform:rotate(-62deg)}30%{transform:rotate(-8deg)}}
</style></head>
<body><div id="stage"><div class="row"><i style="--i:0"></i><i style="--i:1"></i><i style="--i:2"></i><i style="--i:3"></i><i style="--i:4"></i><i style="--i:5"></i><i style="--i:6"></i><i style="--i:7"></i><i style="--i:8"></i><i style="--i:9"></i><i style="--i:10"></i><i style="--i:11"></i><i style="--i:12"></i><i style="--i:13"></i><i style="--i:14"></i><i style="--i:15"></i><i style="--i:16"></i><i style="--i:17"></i><i style="--i:18"></i><i style="--i:19"></i><i style="--i:20"></i><i style="--i:21"></i></div></div></body></html>
