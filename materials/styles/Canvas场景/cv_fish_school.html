<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>鱼群洄游</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:linear-gradient(#023e5e,#001a2e)}canvas{position:absolute;inset:0;width:100%;height:100%}
</style></head>
<body><div id="stage"><canvas id="cv"></canvas><script>const c=document.getElementById("cv"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const F=[];for(let i=0;i<70;i++)F.push({x:Math.random()*c.width,y:Math.random()*c.height,a:Math.random()*6.28,s:1.5+Math.random()});let t=0;(function lp(){x.fillStyle="#023e5e";x.fillRect(0,0,c.width,c.height);t+=.01;for(const f of F){const tx=Math.sin(f.y*.008+t)*1.4,ty=Math.cos(f.x*.006+t)*1.2;f.a+=(Math.atan2(ty,tx)-f.a+6.28)%(6.28)*.04;f.x+=Math.cos(f.a)*f.s;f.y+=Math.sin(f.a)*f.s;if(f.x<-30)f.x=c.width+30;if(f.x>c.width+30)f.x=-30;if(f.y<-20)f.y=c.height+20;if(f.y>c.height+20)f.y=-20;x.save();x.translate(f.x,f.y);x.rotate(f.a);x.fillStyle="rgba(179,229,252,.8)";x.beginPath();x.moveTo(9,0);x.quadraticCurveTo(-2,4,-8,0);x.quadraticCurveTo(-2,-4,9,0);x.moveTo(-8,0);x.lineTo(-13,-3);x.lineTo(-13,3);x.fill();x.restore()}requestAnimationFrame(lp)})();</script></div></body></html>
