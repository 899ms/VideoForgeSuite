<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>飘雪</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
.bg{position:fixed;inset:0;background:radial-gradient(70% 70% at 50% 45%,#fffcc 0%,transparent 72%),radial-gradient(55% 55% at 18% 82%,#48C6EFaa 0%,transparent 70%),radial-gradient(55% 55% at 82% 18%,#B2FEFAaa 0%,transparent 70%),linear-gradient(135deg,#2b2542,#171428);animation:hue 22s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}canvas{width:100%;height:100%;display:block}
.txt{color:#fff;font-weight:900;text-align:center}
</style></head>
<body><div class="bg"></div><div id="stage"><canvas id="cv"></canvas></div>
<script>var cv=document.getElementById('cv'),x=cv.getContext('2d');
function rs(){cv.width=innerWidth;cv.height=innerHeight;}rs();addEventListener('resize',rs);var F=[];for(var i=0;i<140;i++)F.push({x:Math.random()*cv.width,y:Math.random()*cv.height,r:1+Math.random()*3,v:0.4+Math.random()*1,ph:Math.random()*7});(function loop(){requestAnimationFrame(loop);x.fillStyle='rgba(10,12,24,0.2)';x.fillRect(0,0,cv.width,cv.height);x.fillStyle='#fff';for(var i=0;i<F.length;i++){var f=F[i];f.y+=f.v;f.ph+=0.02;f.x+=Math.sin(f.ph)*0.6;if(f.y>cv.height){f.y=-5;f.x=Math.random()*cv.width;}x.beginPath();x.arc(f.x,f.y,f.r,0,7);x.fill();}})();</script></body></html>
