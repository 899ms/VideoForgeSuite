<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>等高线</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#0a0f0d}
canvas{position:absolute;inset:0;width:100%;height:100%}
</style></head>
<body><div id="stage"><canvas id="cv" width="960" height="540"></canvas><script>const c=document.getElementById("cv"),x=c.getContext("2d");let t=0;const noise=(px,py)=>Math.sin(px*.02+Math.cos(py*.017+t)*2)+Math.cos(py*.019+Math.sin(px*.013-t)*2)+Math.sin((px+py)*.008+t*.7);(function loop(){t+=.008;x.fillStyle="#0a0f0d";x.fillRect(0,0,960,540);for(let lv=-3;lv<=3;lv+=.5){x.beginPath();for(let px=0;px<=960;px+=6){let py=0;const A=240;for(let s=0;s<=540;s+=4){if(noise(px,s)>lv&&noise(px,s)<lv+.09){py=s;break}}py?x.lineTo(px,py):x.moveTo(px,py)}x.strokeStyle=`rgba(120,220,160,${.5-Math.abs(lv)*.09})`;x.lineWidth=1.1;x.stroke()}requestAnimationFrame(loop)})();</script></div></body></html>
