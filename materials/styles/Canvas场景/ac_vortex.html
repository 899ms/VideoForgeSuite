<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#050011;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}canvas{width:100vw;height:100vh}</style></head><body><canvas id="cv" width="1920" height="1080"></canvas><script>const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),P=[],C=["#a78bfa","#f472b6","#38bdf8","#e879f9"];for(let i=0;i<420;i++)P.push({a:Math.random()*Math.PI*2,r:Math.random()*900,s:.006+Math.random()*.018,d:Math.random()*.4+.6,c:C[i%4]});function f(){ctx.fillStyle="rgba(5,0,17,.2)";ctx.fillRect(0,0,1920,1080);ctx.translate(960,540);P.forEach(p=>{p.a+=p.s;p.r-=.7*p.d;if(p.r<20)p.r=900;const x=Math.cos(p.a)*p.r,y=Math.sin(p.a)*p.r*.6;ctx.fillStyle=p.c;ctx.globalAlpha=Math.min(1,(900-p.r)/500);ctx.fillRect(x,y,2.5,2.5)});ctx.globalAlpha=1;ctx.setTransform(1,0,0,1,0,0);requestAnimationFrame(f)}requestAnimationFrame(f)</script></body></html>
