<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#0a0518;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}canvas{width:100vw;height:100vh}</style></head><body><canvas id="cv" width="1920" height="1080"></canvas><script>const cv=document.getElementById("cv"),ctx=cv.getContext("2d");function f(t){ctx.fillStyle="#0a0518";ctx.fillRect(0,0,1920,1080);for(let l=0;l<14;l++){const g=ctx.createLinearGradient(0,0,1920,0),h=(t/60+l*18)%360;g.addColorStop(0,`hsla(${h},85%,62%,.28)`);g.addColorStop(1,`hsla(${(h+70)%360},85%,62%,.28)`);ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,1080);for(let x=0;x<=1920;x+=20){ctx.lineTo(x,420+l*36+Math.sin(x/300+t/1100+l*.5)*90+Math.sin(x/120-t/700)*26)}ctx.lineTo(1920,1080);ctx.closePath();ctx.fill()}requestAnimationFrame(f)}requestAnimationFrame(f)</script></body></html>
