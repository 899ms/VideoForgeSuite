<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}canvas{width:100vw;height:100vh}</style></head><body><canvas id="cv" width="1920" height="1080"></canvas><script>const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),B=[];const C=["#f472b6","#818cf8","#38bdf8","#34d399","#fbbf24"];for(let i=0;i<12;i++)B.push({x:Math.random()*1920,y:-100,sp:2+Math.random()*4,w:2+Math.random()*6,c:C[i%5],ph:Math.random()*9});function f(){ctx.fillStyle="#000";ctx.fillRect(0,0,1920,1080);B.forEach(b=>{b.y+=b.sp;const x=b.x+Math.sin(b.y/180+b.ph)*130;if(b.y>1200){b.y=-100;b.x=Math.random()*1920}const g=ctx.createLinearGradient(x,b.y-260,x,b.y+40);g.addColorStop(0,"transparent");g.addColorStop(1,b.c);ctx.strokeStyle=g;ctx.lineWidth=b.w;ctx.beginPath();ctx.moveTo(x,b.y-260);ctx.lineTo(x,b.y+40);ctx.stroke()});requestAnimationFrame(f)}requestAnimationFrame(f)</script></body></html>
