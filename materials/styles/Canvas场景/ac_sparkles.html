<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}canvas{width:100vw;height:100vh}</style></head><body><canvas id="cv" width="1920" height="1080"></canvas><script>const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),S=[];function mk(){S.push({x:Math.random()*1920,y:Math.random()*1080,r:4+Math.random()*7,l:Math.random()*20,m:40+Math.random()*30,c:Math.random()>.5?"#fbbf24":"#f472b6"})}for(let i=0;i<10;i++)mk();setInterval(mk,120);(function f(){ctx.fillStyle="#000";ctx.fillRect(0,0,1920,1080);for(let i=S.length-1;i>=0;i--){const s=S[i];s.l++;if(s.l>s.m*2){S.splice(i,1);continue}const a=Math.sin(Math.PI*s.l/(s.m*2)),R=s.r*(1+a*1.6);ctx.fillStyle=s.c;ctx.globalAlpha=a;ctx.beginPath();ctx.moveTo(s.x,s.y-R*2);ctx.quadraticCurveTo(s.x,s.y,s.x+R*2,s.y);ctx.quadraticCurveTo(s.x,s.y,s.x,s.y+R*2);ctx.quadraticCurveTo(s.x,s.y,s.x-R*2,s.y);ctx.quadraticCurveTo(s.x,s.y,s.x,s.y-R*2);ctx.fill()}ctx.globalAlpha=1;requestAnimationFrame(f)})()</script></body></html>
