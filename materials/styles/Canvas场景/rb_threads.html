<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#050505;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}canvas{width:100vw;height:100vh}</style></head><body><canvas id="cv" width="1920" height="1080"></canvas><script>const cv=document.getElementById("cv"),ctx=cv.getContext("2d");function f(t){ctx.fillStyle="#050505";ctx.fillRect(0,0,1920,1080);for(let i=0;i<26;i++){const y=120+i*34;ctx.beginPath();for(let x=0;x<=1920;x+=14){const yy=y+Math.sin(x/220+t/1200+i*.4)*46+Math.sin(x/60-t/500+i)*10;x?ctx.lineTo(x,yy):ctx.moveTo(x,yy)}const h=(i*14+t/40)%360;ctx.strokeStyle=`hsla(${h},90%,64%,.55)`;ctx.lineWidth=2;ctx.stroke()}requestAnimationFrame(f)}requestAnimationFrame(f)</script></body></html>
