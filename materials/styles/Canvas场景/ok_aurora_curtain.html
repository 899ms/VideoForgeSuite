<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#010208;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}canvas{width:100vw;height:100vh}</style></head><body><canvas id="cv" width="1920" height="1080"></canvas><script>const cv=document.getElementById("cv"),ctx=cv.getContext("2d");function f(t){const g=ctx.createLinearGradient(0,0,0,1080);g.addColorStop(0,"#010208");g.addColorStop(1,"#020617");ctx.fillStyle=g;ctx.fillRect(0,0,1920,1080);for(let s=0;s<5;s++){ctx.beginPath();for(let x=0;x<=1920;x+=12){const base=200+s*40+Math.sin(x/300+s)*60,y=base+Math.sin(x/180+t/1400+s*2)*90;x?ctx.lineTo(x,y):ctx.moveTo(x,y)}for(let x=1920;x>=0;x-=12){const base=200+s*40+Math.sin(x/300+s)*60+260,y=base+Math.sin(x/180+t/1400+s*2)*90;ctx.lineTo(x,y)}ctx.closePath();const gg=ctx.createLinearGradient(0,100,0,700);gg.addColorStop(0,`hsla(${140+s*30},90%,65%,.16)`);gg.addColorStop(1,"transparent");ctx.fillStyle=gg;ctx.fill()}for(let i=0;i<80;i++){const x=(i*97)%1920,y=(i*53)%500;ctx.fillStyle=`rgba(255,255,255,${(Math.sin(t/500+i)*.5+.5)*.8})`;ctx.fillRect(x,y,2,2)}requestAnimationFrame(f)}requestAnimationFrame(f)</script></body></html>
