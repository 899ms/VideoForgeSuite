<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>引力弹弓</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#02040a;display:grid;place-items:center}canvas{position:absolute;inset:0;width:100%;height:100%}
</style></head>
<body><div id="stage"><canvas id="cv"></canvas><script>const c=document.getElementById("cv"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;x.fillStyle="#02040a";x.fillRect(0,0,c.width,c.height);const sun={x:c.width*.5,y:c.height*.5};const pl={x:c.width*.72,y:c.height*.5,vx:0,vy:-2.1};(function lp(){x.fillStyle="rgba(2,4,10,.03)";x.fillRect(0,0,c.width,c.height);const dx=sun.x-pl.x,dy=sun.y-pl.y,d2=dx*dx+dy*dy,d=Math.sqrt(d2);pl.vx+=dx/d2*2600*.016;pl.vy+=dy/d2*2600*.016;pl.x+=pl.vx*.016*60*.02;pl.y+=pl.vy*.016*60*.02;if(d<18){pl.x=c.width*.72;pl.y=c.height*.5;pl.vx=0;pl.vy=-2.1}x.fillStyle="#ffb300";x.beginPath();x.arc(sun.x,sun.y,14,0,6.28);x.fill();x.strokeStyle="#e91e63";x.beginPath();x.arc(pl.x,pl.y,4,0,6.28);x.stroke();x.fillStyle="rgba(233,30,99,.35)";x.fillRect(pl.x-1,pl.y-1,2,2);requestAnimationFrame(lp)})();</script></div></body></html>
