<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>雨滴涟漪</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:linear-gradient(#0a1220,#050a14)}
canvas{position:absolute;inset:0;width:100%;height:100%}
</style></head>
<body><div id="stage"><canvas id="cv" width="960" height="540"></canvas><script>const c=document.getElementById("cv"),x=c.getContext("2d");const R=[];function drop(){R.push({x:Math.random()*960,y:Math.random()*540,r:0,a:1});if(R.length>60)R.shift()}for(let i=0;i<22;i++)drop(),R[i].r=Math.random()*40,R[i].a=1-R[i].r/45;setInterval(drop,180);(function loop(){x.fillStyle="#050a14";x.fillRect(0,0,960,540);for(let i=R.length-1;i>=0;i--){const r=R[i];r.r+=1.9;r.a-=.014;if(r.a<=0){R.splice(i,1);continue}x.strokeStyle=`rgba(160,215,255,${r.a})`;x.lineWidth=2.6;x.beginPath();x.ellipse(r.x,r.y,r.r,r.r*.45,0,0,6.28);x.stroke();x.fillStyle=`rgba(200,235,255,${r.a*.9})`;x.beginPath();x.arc(r.x,r.y-r.r*.6,2.2,0,6.28);x.fill()}requestAnimationFrame(loop)})();</script></div></body></html>
