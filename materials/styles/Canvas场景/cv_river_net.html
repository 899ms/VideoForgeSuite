<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>河流水系</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#0a1208;display:grid;place-items:center}canvas{position:absolute;inset:0;width:100%;height:100%}
</style></head>
<body><div id="stage"><canvas id="cv"></canvas><script>const c=document.getElementById("cv"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;x.fillStyle="#0a1208";x.fillRect(0,0,c.width,c.height);let srcs=[{x:c.width*.5,y:0,a:1.5708,gen:0}];let t=0;(function lp(){for(let k=0;k<3;k++){const ns=[];for(const s of srcs){const ox=s.x,oy=s.y;s.a+=(Math.random()-.5)*.14;s.x+=Math.cos(s.a)*2.4;s.y+=Math.sin(s.a)*2.4;x.strokeStyle="rgba(125,211,252,.5)";x.lineWidth=Math.max(.5,3-s.gen*.4);x.beginPath();x.moveTo(ox,oy);x.lineTo(s.x,s.y);x.stroke();if(Math.random()<.012&&s.gen<7){ns.push({x:s.x,y:s.y,a:s.a+(Math.random()<.5?1:-1)*.5,gen:s.gen+1});ns.push({x:s.x,y:s.y,a:s.a,gen:s.gen})}else if(s.y<c.height-6)ns.push(s)}srcs=ns;if(!srcs.length){t++;srcs=[{x:Math.random()*c.width,y:0,a:1.5708+(Math.random()-.5),gen:0}]}if(t>2){t=0;x.fillStyle="rgba(10,18,8,.0)";x.fillRect(0,0,c.width,c.height)}}requestAnimationFrame(lp)})();</script></div></body></html>
