<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>蚁群觅食</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#171310}canvas{position:absolute;inset:0;width:100%;height:100%}
</style></head>
<body><div id="stage"><canvas id="cv"></canvas><script>const c=document.getElementById("cv"),x=c.getContext("2d");c.width=innerWidth;c.height=innerHeight;const A=[];const food={x:c.width*.82,y:c.height*.3};const home={x:c.width*.16,y:c.height*.72};for(let i=0;i<120;i++)A.push({x:home.x,y:home.y,a:Math.random()*6.28,g:false});(function lp(){x.fillStyle="rgba(23,19,16,.18)";x.fillRect(0,0,c.width,c.height);x.fillStyle="#8d6e63";x.beginPath();x.arc(home.x,home.y,12,0,6.28);x.fill();x.fillStyle="#66bb6a";x.beginPath();x.arc(food.x,food.y,10,0,6.28);x.fill();for(const a of A){a.a+=(Math.random()-.5)*.5;const tg=a.g?home:food;const ta=Math.atan2(tg.y-a.y,tg.x-a.x);if(Math.hypot(tg.x-a.x,tg.y-a.y)<14){a.g=!a.g}else{let d=(ta-a.a+6.28)%6.28;if(d>3.14)d-=6.28;a.a+=d*.08}a.x+=Math.cos(a.a)*1.6;a.y+=Math.sin(a.a)*1.6;x.fillStyle=a.g?"#ffb300":"#e0e0e0";x.fillRect(a.x-1,a.y-1,2.4,1.4)}requestAnimationFrame(lp)})();</script></div></body></html>
