<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#050505;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}canvas{width:100vw;height:100vh}</style></head><body><canvas id="cv" width="1920" height="1080"></canvas><script>const cv=document.getElementById("cv"),ctx=cv.getContext("2d"),CH="ABCDEF0123456789",G=52,cells=[];for(let x=0;x<1920;x+=G)for(let y=0;y<1080;y+=G)cells.push({x,y,c:CH[Math.floor(Math.random()*16)],a:.18+Math.random()*.5,sp:.005+Math.random()*.02});function f(){ctx.fillStyle="#050505";ctx.fillRect(0,0,1920,1080);cells.forEach(c=>{if(Math.random()<c.sp)c.c=CH[Math.floor(Math.random()*16)];ctx.fillStyle=`rgba(110,231,183,${c.a})`;ctx.font="bold 22px Consolas";ctx.fillText(c.c,c.x+10,c.y+30)});requestAnimationFrame(f)}requestAnimationFrame(f)</script></body></html>
