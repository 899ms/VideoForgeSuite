<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>定价卡</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:flex;gap:4vh;align-items:center;justify-content:center;background:#0b1020}
.pc{width:24vh;padding:3.4vh 3vh;border-radius:2vh;background:#141d36;border:1px solid #ffffff14;color:#94a3b8;text-align:center;animation:glow 6s ease-in-out infinite;animation-delay:calc(var(--i)*2s)}
.pc h3{color:#e8eefc;font-size:3vh;margin-bottom:1vh}
.pc .p{font-size:6vh;font-weight:900;color:#fff}
.pc p{font-size:2vh;margin-top:1.6vh}
.pc.hot{border-color:#fbbf24}
@keyframes glow{0%,28%,100%{box-shadow:none;transform:scale(1);border-color:#ffffff14}10%,18%{box-shadow:0 0 6vh #fbbf2466;transform:scale(1.06);border-color:#fbbf24}}
</style></head>
<body><div id="stage"><div class="pc" style="--i:0"><h3>体验版</h3><div class="p">¥0</div><p>每月 10 条视频</p></div><div class="pc hot" style="--i:1"><h3>专业版</h3><div class="p">¥99</div><p>无限渲染 + 全特效库</p></div><div class="pc" style="--i:2"><h3>团队版</h3><div class="p">¥299</div><p>多人协作 + 私有模型</p></div></div></body></html>
