<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>毛玻璃卡</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
.bg{position:fixed;inset:0;background:radial-gradient(70% 70% at 50% 45%,#29D3E6cc 0%,transparent 72%),radial-gradient(55% 55% at 18% 82%,#7C6CF5aa 0%,transparent 70%),radial-gradient(55% 55% at 82% 18%,#FF5C8Aaa 0%,transparent 70%),linear-gradient(135deg,#2b2542,#171428);animation:hue 22s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}canvas{width:100%;height:100%;display:block}
.txt{color:#fff;font-weight:900;text-align:center}
.gc{width:320px;padding:34px 38px;border-radius:24px;background:rgba(255,255,255,0.12);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,0.25);box-shadow:0 20px 60px #29D3E655;animation:floaty 4s ease-in-out infinite}@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}</style></head>
<body><div class="bg"></div><div id="stage"><div class="gc"><h2 style="color:#fff;margin:0">Glass UI</h2><p style="color:#fff9;margin:8px 0 0">Frosted · Blur · Glow</p></div></div>
<script></script></body></html>
