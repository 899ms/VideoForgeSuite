<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0a;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}.g{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:26vh;gap:1.4vw;width:82vw}.c{border-radius:20px;background:#101012;border:1px solid #232326;position:relative;overflow:hidden;transition:all .5s}.c.big{grid-column:span 2}.c.on{border-color:#818cf8;box-shadow:0 0 46px rgba(99,102,241,.35),inset 0 0 60px rgba(99,102,241,.12);transform:scale(1.02)}.c h3{position:absolute;bottom:10%;left:8%;color:#e4e4e7;font-size:1.9vw}</style></head><body><div class="g" id="g"><div class="c big"><h3>Analytics</h3></div><div class="c"><h3>Module 1</h3></div><div class="c"><h3>Module 2</h3></div><div class="c"><h3>Module 3</h3></div><div class="c"><h3>Module 4</h3></div><div class="c"><h3>Module 5</h3></div><div class="c"><h3>Module 6</h3></div></div><script>const cs=[...document.querySelectorAll(".c")];let i=0;setInterval(()=>{cs.forEach(c=>c.classList.remove("on"));cs[i%cs.length].classList.add("on");i++},1200)</script></body></html>
