<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#09090b;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}.g{height:100vh;overflow:hidden;width:52vw}.c{display:flex;flex-direction:column;animation:rl 10s linear infinite}.g:hover .c{animation-play-state:paused}.c div{height:30vh;margin:2vh 0;border-radius:18px;background:linear-gradient(135deg,var(--a),var(--b));display:flex;align-items:center;justify-content:center;color:#fff;font-size:3vw;font-weight:800}@keyframes rl{to{transform:translateY(-50%)}}</style></head><body><div class="g"><div class="c" id="c"></div></div><script>const I=[["#f472b6","#db2777","PINK"],["#a78bfa","#7c3aed","VIOLET"],["#38bdf8","#0284c7","SKY"],["#34d399","#059669","EMERALD"],["#fbbf24","#d97706","AMBER"],["#fb7185","#e11d48","ROSE"]];const s=I.map(x=>`<div style="--a:${x[0]};--b:${x[1]}">${x[2]}</div>`).join("");document.getElementById("c").innerHTML=s+s</script></body></html>
