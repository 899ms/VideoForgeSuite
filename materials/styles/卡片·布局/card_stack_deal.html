<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>卡片堆叠</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#101018;perspective:100vh}
.deck{position:relative;width:24vh;height:34vh;transform-style:preserve-3d}
.deck div{position:absolute;inset:0;border-radius:1.8vh;display:grid;place-items:center;font-size:7vh;font-weight:900;color:#fff;background:linear-gradient(160deg,var(--c),#0008);box-shadow:0 2vh 5vh #000b;animation:dl 6s cubic-bezier(.7,0,.3,1) infinite;animation-delay:calc(var(--i)*.9s)}
@keyframes dl{0%{transform:translateY(-70vh) rotate(-14deg)}14%,70%{transform:translateY(calc(var(--i)*-.8vh)) rotate(calc(var(--i)*3deg))}86%,100%{transform:translateY(70vh) rotate(12deg);opacity:0}}
</style></head>
<body><div id="stage"><div class="deck"><div style="--i:0;--c:#f43f5e">♥</div><div style="--i:1;--c:#0ea5e9">♦</div><div style="--i:2;--c:#10b981">♣</div><div style="--i:3;--c:#f59e0b">♠</div><div style="--i:4;--c:#8b5cf6">★</div></div></div></body></html>
