<!doctype html><html lang=zh><head><meta charset=utf-8>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0f0f13;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif}
.m{columns:4;column-gap:14px;width:780px}
.it{break-inside:avoid;margin-bottom:14px;border-radius:14px;position:relative;overflow:hidden;border:1px solid #ffffff14;opacity:0;transform:translateY(26px);animation:up .7s cubic-bezier(.22,1,.36,1) forwards}
@keyframes up{to{opacity:1;transform:none}}
.cap{position:absolute;left:0;right:0;bottom:0;padding:10px 12px;font-size:12px;color:#e2e8f0;background:linear-gradient(transparent,rgba(0,0,0,.7))}
.h{font-size:24px;font-weight:800;color:#93c5fd;letter-spacing:5px;margin-bottom:22px}</style></head><body>
<div class=h>MASONRY 瀑布流入场</div>
<div class=m id=m></div>
<script>
var d=[['#6366f1',150],['#ec4899',110],['#f59e0b',170],['#10b981',120],['#38bdf8',190],['#a78bfa',130],['#f43f5e',150],['#22d3ee',110],['#fbbf24',160],['#34d399',120],['#818cf8',180],['#fb7185',130]];
var m=document.getElementById('m');
d.forEach(function(x,i){var dv=document.createElement('div');dv.className='it';
dv.style.height=x[1]+'px';dv.style.background='linear-gradient(145deg,'+x[0]+',#ffffff22)';
dv.style.animationDelay=(i*0.12)+'s';
dv.innerHTML='<div class=cap>素材卡 '+(i+1)+'</div>';m.appendChild(dv);});
setTimeout(function(){var a=document.querySelectorAll('*');for(var i=0;i<a.length;i++){try{a[i].style.animationPlayState='paused'}catch(e){}}try{document.getAnimations().forEach(function(x){x.pause()})}catch(e){}},2400);</script></body></html>
