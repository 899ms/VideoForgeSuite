<!doctype html><html lang=zh><head><meta charset=utf-8>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#020617;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif}
.scene{perspective:1200px}
.card{width:420px;height:260px;border-radius:22px;padding:28px;position:relative;transform-style:preserve-3d;
background:linear-gradient(145deg,rgba(56,189,248,.12),rgba(167,139,250,.10));
border:1px solid rgba(148,163,184,.25);backdrop-filter:blur(6px);
box-shadow:0 30px 60px -20px rgba(2,132,199,.45);
animation:in3d 1.1s cubic-bezier(.16,1,.3,1) both}
.card::before{content:"";position:absolute;inset:-2px;border-radius:24px;padding:2px;
background:conic-gradient(from var(--a,0deg),#38bdf8,#a78bfa,#f472b6,#38bdf8);
-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;
animation:spin 2.4s linear infinite}
@keyframes spin{to{--a:360deg}}
@keyframes in3d{0%{opacity:0;transform:rotateY(-40deg) rotateX(18deg) translateZ(-300px)}100%{opacity:1;transform:rotateY(-14deg) rotateX(8deg) translateZ(0)}}
h2{margin:.2em 0;color:#f1f5f9;font-size:34px;font-weight:900;text-shadow:0 2px 12px #0009}
p{color:#94a3b8;font-size:19px;line-height:1.7;margin:0}
.tag{display:inline-block;margin-top:16px;padding:6px 14px;border-radius:999px;font-size:15px;font-weight:700;color:#0b1120;background:linear-gradient(90deg,#67e8f9,#c4b5fd)}
@property --a{syntax:'<angle>';initial-value:0deg;inherits:false}
</style></head><body><div class=scene><div class=card>
<h2>3D Tilt Card</h2>
<p>Inspira UI 风格 · 流光边框 + 玻璃拟态<br>透视入场，自带呼吸光晕</p>
<span class=tag>NEON BORDER BEAM</span>
</div></div></body></html>
