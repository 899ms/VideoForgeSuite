<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#09090b;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}.r{width:100vw;overflow:hidden;padding:3vh 0;transform:rotate(-2deg)}.k{display:flex;gap:2vw;width:max-content;animation:sc 18s linear infinite}.k2{animation-direction:reverse;margin-top:2vh}.k div{width:24vw;height:22vh;border-radius:16px;background:linear-gradient(135deg,var(--a),var(--b));display:flex;align-items:center;justify-content:center;color:#fff;font-size:2.2vw;font-weight:800}@keyframes sc{to{transform:translateX(-50%)}}</style></head><body><div class="r"><div class="k" id="k1"></div><div class="k k2" id="k2"></div></div><script>const I=[["#f472b6","#db2777","BOLD"],["#a78bfa","#6d28d9","SLEEK"],["#38bdf8","#0369a1","FAST"],["#34d399","#047857","CLEAN"],["#fbbf24","#b45309","FUN"]];const mk=el=>{const s=I.map(x=>`<div style="--a:${x[0]};--b:${x[1]}">${x[2]}</div>`).join("");el.innerHTML=s+s};mk(k1);mk(k2)</script></body></html>
