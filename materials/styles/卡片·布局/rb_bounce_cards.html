<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#0c0a1d;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}.s{position:relative;width:24vw;height:34vh}.s div{position:absolute;inset:0;border-radius:20px;background:linear-gradient(135deg,var(--a),var(--b));animation:bn 2.6s ease-in-out infinite alternate;box-shadow:0 20px 60px rgba(0,0,0,.5)}@keyframes bn{from{transform:translateY(0) rotate(var(--r))}to{transform:translateY(-7vh) rotate(calc(var(--r) + 4deg))}}</style></head><body><div class="s"><div style="--a:#f472b6;--b:#db2777;--r:-8deg"></div><div style="--a:#a78bfa;--b:#7c3aed;--r:-2deg;animation-delay:.2s"></div><div style="--a:#38bdf8;--b:#0284c7;--r:5deg;animation-delay:.4s"></div></div><script></script></body></html>
