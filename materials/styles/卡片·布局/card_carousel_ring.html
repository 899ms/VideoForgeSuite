<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>环形轮播</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(60% 70% at 50% 45%,#141c33,#080b16);perspective:110vh;overflow:hidden}
.ring{position:relative;width:24vh;height:32vh;transform-style:preserve-3d;animation:sp 12s linear infinite}
.ring div{position:absolute;inset:0;border-radius:1.6vh;border:1px solid #ffffff22;display:grid;place-items:center;font-size:5vh;font-weight:900;color:#fff;transform:rotateY(calc(var(--i)*60deg)) translateZ(34vh);background:linear-gradient(160deg,var(--c),#0009 90%);box-shadow:0 2vh 5vh #000a}
@keyframes sp{to{transform:rotateY(360deg)}}
</style></head>
<body><div id="stage"><div class="ring"><div style="--i:0;--c:#0ea5e9">01</div><div style="--i:1;--c:#8b5cf6">02</div><div style="--i:2;--c:#f59e0b">03</div><div style="--i:3;--c:#10b981">04</div><div style="--i:4;--c:#f43f5e">05</div><div style="--i:5;--c:#6366f1">06</div></div></div></body></html>
