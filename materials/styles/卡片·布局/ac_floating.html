<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#0b1120;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}.d{display:flex;gap:4vw}.f{width:16vh;height:16vh;border-radius:24px;background:linear-gradient(135deg,var(--a),var(--b));animation:ft var(--t) ease-in-out infinite;box-shadow:0 20px 50px rgba(0,0,0,.5)}@keyframes ft{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5vh) rotate(var(--r))}}</style></head><body><div class="d"><div class="f" style="--a:#f472b6;--b:#db2777;--t:4s;--r:6deg"></div><div class="f" style="--a:#38bdf8;--b:#0369a1;--t:5s;--r:-8deg"></div><div class="f" style="--a:#fbbf24;--b:#b45309;--t:4.6s;--r:10deg"></div></div><script></script></body></html>
