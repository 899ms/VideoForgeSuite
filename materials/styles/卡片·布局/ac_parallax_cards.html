<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#020617;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}.scene{position:relative;width:70vw;height:70vh;perspective:1400px}.cd{position:absolute;inset:0;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:3vw;font-weight:800;color:#fff;box-shadow:0 30px 90px rgba(0,0,0,.6)}.cd:nth-child(1){background:linear-gradient(135deg,#0ea5e9,#6366f1);animation:pv1 6s ease-in-out infinite}.cd:nth-child(2){background:linear-gradient(135deg,#8b5cf6,#ec4899);transform:translate(6vw,8vh);animation:pv2 6s ease-in-out infinite}.cd:nth-child(3){background:linear-gradient(135deg,#10b981,#06b6d4);transform:translate(-6vw,14vh);animation:pv3 6s ease-in-out infinite}@keyframes pv1{0%,100%{transform:translateZ(0) rotate(-2deg)}50%{transform:translateZ(90px) rotate(2deg)}}@keyframes pv2{0%,100%{transform:translate(6vw,8vh) translateZ(50px)}50%{transform:translate(6vw,8vh) translateZ(140px)}}@keyframes pv3{0%,100%{transform:translate(-6vw,14vh)}50%{transform:translate(-6vw,14vh) translateZ(60px)}}</style></head><body><div class="scene"><div class="cd">DEPTH 3</div><div class="cd">DEPTH 2</div><div class="cd">DEPTH 1</div></div><script></script></body></html>
