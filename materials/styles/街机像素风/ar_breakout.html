<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>打砖块</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#0d0d17}
.bd2{position:relative;width:36vh;height:44vh;border:.8vh solid #3c3c5c;background:#151525;overflow:hidden}
.brick{position:absolute;height:3.4vh;border:.3vh solid #0d0d17}
.ball{position:absolute;width:2.2vh;height:2.2vh;border-radius:50%;background:#fff;animation:bb 3.2s linear infinite}
.pad{position:absolute;bottom:2vh;left:12vh;width:10vh;height:2.4vh;background:#8bac0f;border-radius:.6vh;animation:pd 3.2s linear infinite}
@keyframes bb{0%{left:17vh;top:36vh}20%{left:30vh;top:8vh}45%{left:5vh;top:14vh}70%{left:25vh;top:26vh}100%{left:17vh;top:36vh}}
@keyframes pd{0%{left:12vh}20%{left:24vh}45%{left:2vh}70%{left:19vh}100%{left:12vh}}
</style></head>
<body><div id="stage"><div class="bd2"><span class="brick" style="left:0.0vh;top:0vh;width:6.6vh;background:#ef5350"></span><span class="brick" style="left:7.2vh;top:0vh;width:6.6vh;background:#ef5350"></span><span class="brick" style="left:14.4vh;top:0vh;width:6.6vh;background:#ef5350"></span><span class="brick" style="left:21.6vh;top:0vh;width:6.6vh;background:#ef5350"></span><span class="brick" style="left:28.8vh;top:0vh;width:6.6vh;background:#ef5350"></span><span class="brick" style="left:0.0vh;top:4vh;width:6.6vh;background:#ffca28"></span><span class="brick" style="left:7.2vh;top:4vh;width:6.6vh;background:#ffca28"></span><span class="brick" style="left:14.4vh;top:4vh;width:6.6vh;background:#ffca28"></span><span class="brick" style="left:21.6vh;top:4vh;width:6.6vh;background:#ffca28"></span><span class="brick" style="left:28.8vh;top:4vh;width:6.6vh;background:#ffca28"></span><span class="brick" style="left:0.0vh;top:8vh;width:6.6vh;background:#66bb6a"></span><span class="brick" style="left:7.2vh;top:8vh;width:6.6vh;background:#66bb6a"></span><span class="brick" style="left:14.4vh;top:8vh;width:6.6vh;background:#66bb6a"></span><span class="brick" style="left:21.6vh;top:8vh;width:6.6vh;background:#66bb6a"></span><span class="brick" style="left:28.8vh;top:8vh;width:6.6vh;background:#66bb6a"></span><span class="ball"></span><span class="pad"></span></div></div></body></html>
