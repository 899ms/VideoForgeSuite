<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>金币计数</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#0d0d17}
.wrp{display:flex;align-items:center;gap:4vh;font-family:monospace}
.cn{width:9vh;height:9vh;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe082,#ffb300 60%,#ff8f00);border:.8vh solid #e65100;animation:sp .8s steps(8) infinite;box-shadow:0 0 3vh #ffb30066}
.ct{font-size:8vh;color:#ffd54f;text-shadow:.5vh .5vh 0 #4e2c00}
@keyframes sp{50%{transform:scaleY(.15)}100%{transform:scaleY(1)}}
</style></head>
<body><div id="stage"><div class="wrp"><span class="cn"></span><span class="ct" id="ct">000000</span></div><script>const ct=document.getElementById("ct");let v=0;setInterval(()=>{v=(v+7)%999999;ct.textContent=String(v).padStart(6,"0")},120)</script></div></body></html>
