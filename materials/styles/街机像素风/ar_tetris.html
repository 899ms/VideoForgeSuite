<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>俄罗斯方块</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#0d0d17}
.bd2{position:relative;width:30vh;height:40vh;border:.8vh solid #3c3c5c;background:#151525;overflow:hidden}
.cu{position:absolute;width:6vh;height:6vh;display:grid;grid-template-columns:1fr 1fr;animation:dr 5s steps(1) infinite}
.cu i{background:#4fc3f7;border:.3vh solid #0d0d17}
.row{position:absolute;left:0;right:0;height:6vh;display:flex}
.row i{flex:1;border:.3vh solid #0d0d17;background:#7e57c2}
.row.flash i{background:#fff;animation:fh .4s steps(1) 3}
@keyframes dr{0%,30%{top:-12vh;left:12vh}55%,80%{top:22vh;left:6vh}100%{top:-12vh;left:12vh}}
@keyframes fh{50%{opacity:.2}}
</style></head>
<body><div id="stage"><div class="bd2"><div class="cu"><i></i><i></i><i></i><i></i></div><div class="row" style="bottom:0"><i></i><i></i><i></i><i></i><i></i></div></div></div></body></html>
