<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>吃豆人</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#000;display:grid;place-items:center;overflow:hidden}
.lane{position:relative;width:70vw;height:10vh}
.dot{position:absolute;top:4.4vh;width:1.2vh;height:1.2vh;border-radius:50%;background:#ffd54f;animation:dp 4s steps(1) infinite}
.pm{position:absolute;top:1vh;width:8vh;height:8vh;border-radius:50%;background:#ffd54f;animation:pmv 4s linear infinite;clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}
.pm:after{content:"";position:absolute;inset:0;border-radius:50%;background:#000;clip-path:polygon(100% 0,100% 100%,30% 50%);animation:chomp .34s linear infinite}
.gh{position:absolute;top:1.6vh;width:7vh;height:7vh;background:#ef5350;border-radius:3.5vh 3.5vh 0 0;animation:ghv 4s linear infinite}
.gh:before{content:"";position:absolute;left:1.2vh;top:1.8vh;width:1.6vh;height:1.6vh;background:#fff;border-radius:50%;box-shadow:2.6vh 0 0 #fff}
@keyframes pmv{0%{left:-8%}100%{left:100%}}
@keyframes ghv{0%{left:-20%}100%{left:88%}}
@keyframes chomp{50%{clip-path:polygon(100% 0,100% 100%,60% 50%)}}
@keyframes dp{0%{opacity:1}88%{opacity:1}100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="lane"><i class="dot" style="left:8%"></i><i class="dot" style="left:15%"></i><i class="dot" style="left:22%"></i><i class="dot" style="left:29%"></i><i class="dot" style="left:36%"></i><i class="dot" style="left:43%"></i><i class="dot" style="left:50%"></i><i class="dot" style="left:57%"></i><i class="dot" style="left:64%"></i><i class="dot" style="left:71%"></i><i class="dot" style="left:78%"></i><i class="dot" style="left:85%"></i><span class="pm"></span><span class="gh"></span></div></div></body></html>
