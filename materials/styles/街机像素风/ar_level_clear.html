<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>通关横幅</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#0d0d17}
.bn{text-align:center;animation:bn 4s steps(1) infinite;opacity:0}
.bn h1{font-family:monospace;font-size:9vh;color:#8bac0f;letter-spacing:.12em;text-shadow:.6vh .6vh 0 #0f380f;margin:0}
.bn p{font-family:monospace;font-size:3.4vh;color:#9bbc0f;margin-top:2vh;animation:bl .8s steps(1) infinite}
.st{margin-top:3vh;font-family:monospace;font-size:3vh;color:#ffd54f;letter-spacing:.3em}
@keyframes bn{0%{opacity:0;transform:scale(.6)}12%{opacity:1;transform:scale(1.06)}18%{transform:scale(1)}86%{opacity:1}100%{opacity:0}}
@keyframes bl{50%{opacity:.25}}
</style></head>
<body><div id="stage"><div class="bn"><h1>LEVEL CLEAR!</h1><p>BONUS +3000</p><div class="st">★ ★ ★</div></div></div></body></html>
