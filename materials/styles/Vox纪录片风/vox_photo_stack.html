<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>照片堆抽检</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#c9b899}
.stk{position:relative;width:34vw;aspect-ratio:4/3}
.stk div{position:absolute;inset:0;box-shadow:0 1.5vh 4vh #0005;border:.9vh solid #fff;background:linear-gradient(135deg,#6d7f8f,#3c4c5c)}
.stk div:nth-child(1){transform:rotate(4deg)}
.stk div:nth-child(2){transform:rotate(-3deg);background:linear-gradient(135deg,#8f7a6d,#5c4a3c)}
.stk div:nth-child(3){transform:rotate(1deg);background:linear-gradient(135deg,#7a8f6d,#4a5c3c);animation:fly 6s steps(1) infinite}
.stk div:nth-child(3):after{content:"1968.03";position:absolute;bottom:-4.5vh;left:1vh;color:#3b2f1d;font-size:2.2vh}
@keyframes fly{0%,20%{transform:rotate(1deg) translate(0,0)}38%,88%{transform:rotate(24deg) translate(70vw,10vh);opacity:0}89%,100%{transform:rotate(1deg) translate(0,0);opacity:1}}
</style></head>
<body><div id="stage"><div class="stk"><div></div><div></div><div></div></div></div></body></html>
