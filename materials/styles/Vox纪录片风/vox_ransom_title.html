<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>剪报拼字</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#4c4438;display:flex;gap:1.4vh;align-items:center;justify-content:center}
.w{background:#f2ecdc;color:#26221b;font-size:9vh;font-weight:900;padding:1vh 1.6vh;box-shadow:0 .8vh 2vh #0006}
.w:nth-child(1){transform:rotate(-4deg)}.w:nth-child(2){transform:rotate(3deg) translateY(1vh);background:#e6ddc6}
.w:nth-child(3){transform:rotate(-2deg)}
</style></head>
<body><div id="stage"><div class="w">WHY</div><div class="w">NOW</div><div class="w">?</div></div></body></html>
