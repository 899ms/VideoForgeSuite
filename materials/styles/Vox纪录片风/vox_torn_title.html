<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>撕纸标题</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#8c5a3c;display:grid;place-items:center}
.rip{position:relative;font-size:11vh;font-weight:900;color:#f4ecd8;letter-spacing:.06em;filter:drop-shadow(.8vh 1vh 0 #0005)}
.rip:after{content:"";position:absolute;inset:-2vh -3vh;background:#f4ecd8;z-index:-1;clip-path:polygon(0 12%,4% 0,30% 6%,55% 0,82% 8%,100% 2%,100% 88%,96% 100%,70% 94%,45% 100%,18% 92%,0 100%);animation:rv 5s ease-in-out infinite}
@keyframes rv{0%,12%{clip-path:polygon(0 100%,100% 100%,100% 100%,0 100%)}55%,80%{clip-path:polygon(0 12%,4% 0,30% 6%,55% 0,82% 8%,100% 2%,100% 88%,96% 100%,70% 94%,45% 100%,18% 92%,0 100%)}100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="rip">真相</div></div></body></html>
