<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>引文换词</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#f4ecd8;padding:8vh}
.q{background:#fbf6ea;padding:5vh 6vh;box-shadow:0 1.5vh 4vh #0003;font-size:3.6vh;line-height:1.9;color:#2b2b2b;max-width:70vw}
.sw{display:inline-block;position:relative;perspective:40vh;width:5.2em;vertical-align:bottom}
.sw b{position:absolute;left:0;top:0;font-weight:900;color:#b23a48;backface-visibility:hidden;animation:fp 4.8s steps(1) infinite;border-bottom:.6vh solid #ffe34d}
.sw b:nth-child(2){transform:rotateX(90deg);animation-delay:0s}
@keyframes fp{0%,46%{transform:rotateX(0)}50%,96%{transform:rotateX(-90deg)}100%{transform:rotateX(0)}}
</style></head>
<body><div id="stage"><div class="q">报告显示，城市热岛效应的核心原因是<span class="sw"><b style="animation-delay:0s">玻璃幕墙</b><b style="animation-delay:2.4s">沥青路面</b></span>吸收了过多日照。</div></div></body></html>
