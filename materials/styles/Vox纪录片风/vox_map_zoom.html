<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>地图缩放填色</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#dbe9dc;overflow:hidden}
.map{position:absolute;inset:-10%;animation:zm 7s ease-in-out infinite}
.land{position:absolute;inset:14% 18%;background:#e8f0e4;clip-path:polygon(8% 40%,20% 22%,38% 18%,52% 26%,66% 20%,84% 30%,92% 48%,80% 66%,58% 74%,40% 68%,22% 72%,4% 58%)}
.hl{position:absolute;inset:14% 18%;background:#e0453b;clip-path:polygon(38% 18%,52% 26%,66% 20%,58% 44%,44% 42%);animation:fi 7s steps(1) infinite;opacity:0}
@keyframes zm{0%,100%{transform:scale(1)}45%,75%{transform:scale(1.9) translate(8%,10%)}}
@keyframes fi{0%,30%{opacity:0}45%,80%{opacity:1}81%,100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="map"><div class="land"></div><div class="hl"></div></div></div></body></html>
