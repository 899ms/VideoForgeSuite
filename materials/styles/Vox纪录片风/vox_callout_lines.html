<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>地图标注线</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#e9e4d4}
.dot{position:absolute;left:38%;top:42%;width:2.2vh;height:2.2vh;border-radius:50%;background:#c0392b;box-shadow:0 0 0 .8vh #c0392b33;animation:pp 4s infinite}
.ln{position:absolute;left:40%;top:45%;height:.5vh;background:#2c3e50;transform-origin:left;animation:ln 4s steps(20) infinite}
.lb{position:absolute;left:62%;top:28%;font-size:3vh;font-weight:700;color:#2c3e50;opacity:0;animation:lb 4s steps(1) infinite;border-bottom:.6vh solid #c0392b;padding-bottom:.4vh}
@keyframes pp{0%,100%{transform:scale(1)}15%{transform:scale(1.7)}30%{transform:scale(1)}}
@keyframes ln{0%{width:0;opacity:1}35%,80%{width:22vw;opacity:1}81%,100%{opacity:0}}
@keyframes lb{0%,35%{opacity:0}50%,80%{opacity:1}81%,100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="dot"></div><div class="ln"></div><div class="lb">关键节点 A</div></div></body></html>
