<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>涂黑揭密</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#f3ecdb;display:grid;place-items:center;gap:2vh}
.l{font-size:3.6vh;color:#3a342a;position:relative;line-height:2}
.l b{position:relative;color:#0000}
.l b:after{content:"";position:absolute;inset:8% -1%;background:#141414;animation:rd 5s steps(1) infinite}
@keyframes rd{0%,45%{transform:scaleX(1)}60%,85%{transform:scaleX(0);transform-origin:right}86%,100%{transform:scaleX(1);transform-origin:left}}
</style></head>
<body><div id="stage"><div class="l">机密文件显示：预算<b>超支 340%</b>，且从未公开。</div></div></body></html>
