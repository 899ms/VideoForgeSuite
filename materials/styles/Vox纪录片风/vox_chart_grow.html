<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>数据回应旁白</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#f7f3ea;display:grid;place-items:center}
.ch{display:flex;gap:3vh;align-items:flex-end;height:40vh}
.b{width:7vh;background:#2b6cb0;transform-origin:bottom;animation:gr 6s steps(28) infinite}
.b:nth-child(2){height:55%;animation-delay:.5s;background:#2f855a}
.b:nth-child(1){height:30%}.b:nth-child(3){height:80%;animation-delay:1s;background:#c05621}
.b:nth-child(4){height:100%;animation-delay:1.5s;background:#9b2c2c}
.cap{position:absolute;top:14vh;left:12vw;font-size:3.2vh;color:#4a3f2f;font-weight:700}
@keyframes gr{0%{transform:scaleY(0)}45%,85%{transform:scaleY(1)}100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="cap">“到了 2019 年，数字翻了三倍…”</div><div class="ch"><div class="b"></div><div class="b"></div><div class="b"></div><div class="b"></div></div></div></body></html>
