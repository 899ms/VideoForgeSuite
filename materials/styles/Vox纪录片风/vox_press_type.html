<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>报纸打字</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#f1ead9;display:grid;place-items:center}
.col{width:56vw;font-size:3vh;line-height:1.9;color:#2e2a22;white-space:pre-wrap;overflow:hidden;height:34vh;animation:ty 6s steps(30) infinite alternate;border-right:.5vh solid #2e2a22;padding-right:1.4vh}
@keyframes ty{from{height:0}to{height:34vh}}
</style></head>
<body><div id="stage"><div class="col">1972 年 6 月 17 日，五个人闯入了水门大厦。
没有人知道，这扇被胶带贴住的门，
最终会撬动整个白宫。</div></div></body></html>
