<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>档案印章</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#efe7d3;display:grid;place-items:center}
.st{border:1vh double #b3352c;color:#b3352c;font-size:7vh;font-weight:900;letter-spacing:.2em;padding:2vh 4vh;transform:rotate(-14deg);border-radius:1vh;animation:st 4s steps(1) infinite;opacity:0;mix-blend-mode:multiply}
@keyframes st{0%,55%{opacity:0;transform:rotate(-14deg) scale(2.4)}62%,88%{opacity:.9;transform:rotate(-14deg) scale(1)}89%,100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="st">已核实</div></div></body></html>
