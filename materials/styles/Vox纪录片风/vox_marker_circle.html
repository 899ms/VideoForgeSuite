<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>马克笔圈重点</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#f6f1e3;display:grid;place-items:center}
.box{font-size:4.6vh;font-weight:700;color:#33302a;padding:3vh 5vh;position:relative}
.box svg{position:absolute;inset:-2vh;width:calc(100%+4vh);height:calc(100%+4vh);overflow:visible}
.box ellipse{fill:none;stroke:#e0432f;stroke-width:.9vh;stroke-linecap:round;stroke-dasharray:460;stroke-dashoffset:460;animation:ci 3.6s steps(30) infinite;transform:rotate(-4deg);transform-origin:center}
@keyframes ci{0%{stroke-dashoffset:460}55%,85%{stroke-dashoffset:0}100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="box">就是这里<svg viewBox="0 0 220 90"><ellipse cx="110" cy="45" rx="100" ry="36"/></svg></div></div></body></html>
