<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>软木板情报墙</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:repeating-linear-gradient(45deg,#b98a54 0 1.2vh,#a97b48 1.2vh 2.4vh)}
.cd{position:absolute;width:16vh;height:12vh;background:linear-gradient(135deg,#5d6d7e,#34495e);box-shadow:0 1vh 2.4vh #0006;animation:pn 6s steps(1) infinite}
.cd:before{content:"";position:absolute;top:-1.2vh;left:50%;transform:translateX(-50%);width:2.4vh;height:2.4vh;border-radius:50%;background:#c0392b;box-shadow:0 .4vh .8vh #0008}
.cd.c2{left:30%;top:40%;animation-delay:2s;background:linear-gradient(135deg,#7d6b8f,#4a3b5c)}
.cd.c3{left:62%;top:18%;animation-delay:4s;background:linear-gradient(135deg,#8f6b5d,#5c3b2f)}
@keyframes pn{0%{opacity:0;transform:scale(1.4)}8%{opacity:1;transform:scale(1)}}
</style></head>
<body><div id="stage"><div class="cd"></div><div class="cd c2"></div><div class="cd c3"></div></div></body></html>
