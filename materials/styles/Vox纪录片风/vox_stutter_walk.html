<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>12fps 顿挫</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#f2e8d5;overflow:hidden}
.ch{position:absolute;bottom:14vh;left:-8vw;width:6vh;height:12vh;background:#33322e;border-radius:2.4vh 2.4vh .6vh .6vh;animation:wk 5s steps(16) infinite}
.ch:before{content:"";position:absolute;top:-3.4vh;left:.6vh;width:4vh;height:3.4vh;background:#33322e;border-radius:50%}
.ch:after{content:"";position:absolute;bottom:-2.6vh;left:.4vh;width:2vh;height:2.6vh;background:#33322e;box-shadow:2.6vh 0 0 #33322e}
@keyframes wk{to{transform:translateX(112vw)}}
.hint{position:absolute;top:6vh;right:4vw;font-size:2.6vh;color:#6b5d45}
</style></head>
<body><div id="stage"><div class="ch"></div><div class="hint">animating on twos · 12fps</div></div></body></html>
