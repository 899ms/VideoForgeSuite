<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>荧光笔扫划</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#f4ecd8;padding:8vh}
.doc{background:#fbf6ea;padding:4vh 5vh;box-shadow:0 1.5vh 4vh #0003;font-size:3.4vh;line-height:2;color:#2b2b2b;max-width:70vw}
.doc .hl{position:relative;white-space:nowrap}
.doc .hl i{position:absolute;left:-1%;top:52%;height:52%;width:0;background:#ffe34d;z-index:-1;border-radius:.4vh;animation:sw 4s steps(24) infinite}
@keyframes sw{0%{width:0}40%,75%{width:102%}100%{width:102%;opacity:0}}
</style></head>
<body><div id="stage"><div class="doc">真相只有一个：<span class="hl">被记录的数字<i></i></span>，才是证据。</div></div></body></html>
