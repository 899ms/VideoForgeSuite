<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>便利贴接力</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#a9b8a0;display:grid;place-items:center;perspective:120vh}
.pn{position:absolute;width:26vh;height:26vh;background:#ffe985;box-shadow:.6vh .8vh 1.6vh #0004;animation:sq 9s steps(1) infinite;display:grid;place-items:center;font-size:3.4vh;font-weight:700;color:#4a4436}
.pn:nth-child(2){background:#8fd6ff;animation-delay:3s}
.pn:nth-child(3){background:#ffa8a8;animation-delay:6s}
@keyframes sq{0%{transform:translateY(40vh) rotate(14deg) scale(.6);opacity:0}12%{transform:none;opacity:1}28%,33%{transform:none;opacity:1}42%,100%{transform:translateY(-40vh) rotate(-10deg);opacity:0}}
</style></head>
<body><div id="stage"><div class="pn">为什么？</div><div class="pn">谁干的？</div><div class="pn">去哪了？</div></div></body></html>
