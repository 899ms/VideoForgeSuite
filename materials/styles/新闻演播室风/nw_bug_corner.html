<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>台标角标</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:linear-gradient(140deg,#2b3440,#161c23);position:relative}
.bug{position:absolute;left:3.5%;top:4%;display:flex;align-items:center;gap:1.6vh;background:#0d1117cc;border:.3vh solid #37424e;border-radius:.8vh;padding:1.4vh 2.4vh;animation:in 4.5s ease-out infinite;opacity:0}
.logo{width:5vh;height:5vh;border-radius:.8vh;background:linear-gradient(135deg,#c62828,#e53935);display:grid;place-items:center;color:#fff;font-weight:900;font-size:2.6vh}
.bug .tx{color:#e8eaed;font-size:2.6vh;font-weight:700;line-height:1.4}
.bug .tm{color:#90a4ae;font-size:2vh;font-family:monospace}
@keyframes in{0%{opacity:0;transform:translateX(-4vh)}10%,86%{opacity:1;transform:none}100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="bug"><span class="logo">HS</span><div class="tx">Hermes 新闻台<br><span class="tm">LIVE · 21:00 档</span></div></div></div></body></html>
