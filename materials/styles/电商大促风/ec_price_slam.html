<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>价格砸落</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#fff3e0;overflow:hidden}
.tg{background:#d0342c;color:#fff;border-radius:2vh;padding:3vh 6vh;box-shadow:0 2vh 0 #8c1d18,0 3vh 6vh #0004;animation:sl 3.6s cubic-bezier(.3,1.6,.5,1) infinite;text-align:center}
.tg .pr{font-size:11vh;font-weight:900;line-height:1}
.tg .un{font-size:4vh;font-weight:900;vertical-align:top}
.tg .old{font-size:2.8vh;color:#ffcdd2;text-decoration:line-through;margin-top:1vh}
.dust{position:absolute;width:16vh;height:4vh;border-radius:50%;background:#00000022;bottom:calc(50% - 12vh);opacity:0;animation:du 3.6s ease-out infinite}
@keyframes sl{0%,8%{transform:translateY(-90vh) scale(1.3);opacity:0}30%{transform:translateY(0) scale(1);opacity:1}36%{transform:scale(.94,1.06)}42%,88%{transform:scale(1)}100%{opacity:0;transform:translateY(0)}}
@keyframes du{0%,26%{opacity:0;transform:scale(.3)}34%{opacity:1;transform:scale(1.15)}60%,100%{opacity:0;transform:scale(1.6)}}
</style></head>
<body><div id="stage"><div class="tg"><span class="un">¥</span><span class="pr">199</span><div class="old">日常价 ¥599</div></div><div class="dust"></div></div></body></html>
