<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>秒杀霓虹</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#12060e}
.nn{font-size:16vh;font-weight:900;color:#ff2d78;text-shadow:0 0 1vh #ff2d78,0 0 3vh #ff2d78,0 0 7vh #ff2d78aa;letter-spacing:.1em;animation:nk 2.6s steps(1) infinite}
.nn small{display:block;text-align:center;font-size:3vh;color:#7df9ff;text-shadow:0 0 2vh #7df9ff;letter-spacing:.6em;margin-top:1.4vh}
@keyframes nk{0%,18%,22%,60%,64%,100%{opacity:1}20%,62%{opacity:.35}}
</style></head>
<body><div id="stage"><div class="nn">限时秒杀<small>SECKILL 19:00</small></div></div></body></html>
