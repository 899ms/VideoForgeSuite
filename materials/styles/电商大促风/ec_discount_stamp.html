<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>折扣盖章</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#ede7f6}
.st{width:34vh;height:34vh;border:1.2vh solid #d0342c;border-radius:50%;display:grid;place-items:center;color:#d0342c;transform:rotate(-14deg);animation:st 3.8s cubic-bezier(.2,1.4,.4,1) infinite;position:relative}
.st:after{content:"";position:absolute;inset:.8vh;border:.5vh dashed #d0342c;border-radius:50%}
.st b{font-size:9vh;font-weight:900;letter-spacing:.02em}
.st i{font-style:normal;font-size:3vh;font-weight:900;letter-spacing:.4em}
@keyframes st{0%,10%{transform:rotate(-14deg) scale(2.6);opacity:0}30%{transform:rotate(-14deg) scale(1);opacity:1}34%{transform:rotate(-14deg) scale(1.05)}88%,100%{transform:rotate(-14deg) scale(1);opacity:1}}
</style></head>
<body><div id="stage"><div class="st"><div style="text-align:center"><i>限时立减</i><br><b>-50%</b></div></div></div></body></html>
