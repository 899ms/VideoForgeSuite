<!doctype html><html lang=zh><head><meta charset=utf-8>
<style>html,body{margin:0;height:100%;overflow:hidden;background:linear-gradient(135deg,#0f172a,#1e293b);display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif}
.w{text-align:center}
.t{display:flex;gap:.08em;font-size:72px;font-weight:900;color:#e2e8f0}
.ch{opacity:0;display:inline-block;transform:translateY(60px) rotateX(-90deg)}
.g1{animation:rise .7s cubic-bezier(.22,1,.36,1) forwards}.g2 .ch{animation-delay:.12s}
@keyframes rise{to{opacity:1;transform:none}}
.u{width:0;height:8px;margin-top:14px;border-radius:4px;background:linear-gradient(90deg,#38bdf8,#a78bfa,#f472b6);box-shadow:0 0 24px #38bdf888}
.s{font-size:20px;color:#94a3b8;margin-bottom:10px;letter-spacing:6px}
</style></head><body><div class=w>
<div class=s>GSAP STYLE · STAGGER</div>
<div class=t id=t></div>
<div class=u id=u></div></div>
<script>var s="TIMELINE";var t=document.getElementById('t');for(var i=0;i<s.length;i++){var sp=document.createElement('span');sp.className='ch g'+(i%2+1);sp.textContent=s[i];sp.style.animationDelay=(i*0.09)+'s';t.appendChild(sp);}
document.getElementById('u').animate([{width:'0'},{width:'340px'}],{duration:900,delay:600,easing:'cubic-bezier(.22,1,.36,1)',fill:'forwards'});</script>
<script>setTimeout(function(){var a=document.querySelectorAll('*');for(var i=0;i<a.length;i++){try{a[i].style.animationPlayState='paused'}catch(e){}}try{document.getAnimations().forEach(function(x){x.pause()})}catch(e){}},2600);</script></body></html>
