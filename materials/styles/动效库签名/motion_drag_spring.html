<!doctype html><html lang=zh><head><meta charset=utf-8>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#18181b;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',system-ui,sans-serif}
.w{text-align:center;position:relative;width:100%}
.s{font-size:15px;color:#a1a1aa;letter-spacing:6px;margin-bottom:40px}
.stage{position:relative;height:250px;display:flex;align-items:center;justify-content:center;gap:80px}
.handle{width:96px;height:96px;border-radius:22px;background:linear-gradient(145deg,#3f3f46,#27272a);border:1px solid #52525b;display:flex;align-items:center;justify-content:center;font-size:13px;color:#d4d4d8;letter-spacing:2px;cursor:grab;box-shadow:0 14px 30px #0008}
.card{width:150px;height:100px;border-radius:18px;background:linear-gradient(140deg,#7dd3fc,#818cf8);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:17px;box-shadow:0 16px 36px rgba(99,102,241,.45)}
.trail{position:absolute;left:50%;top:50%;width:8px;height:8px;border-radius:50%;background:#e879f9;filter:blur(1px);pointer-events:none}
.hint{margin-top:34px;font-size:12px;color:#52525b;letter-spacing:4px}
@keyframes drag{0%,100%{transform:none}25%{transform:translate(70px,-38px) rotate(4deg)}45%{transform:translate(96px,-52px) rotate(6deg) scale(1.06)}70%{transform:translate(-46px,26px) rotate(-4deg)}88%{transform:translate(-30px,18px) rotate(-2deg)}}
@keyframes trail{0%,100%{transform:translate(0,0);opacity:.35}28%{transform:translate(74px,-30px);opacity:1}48%{transform:translate(60px,-42px);opacity:.9}72%{transform:translate(-54px,20px);opacity:.8}}
</style></head><body><div class=w>
<div class=s>MOTION · DRAG + SPRING SNAP</div>
<div class=stage>
<div class=trail id=t></div>
<div class=handle id=h>DRAG ME</div>
<div class=card>TARGET</div>
</div>
<div class=hint>GESTURE RELEASES TO SPRING PHYSICS</div></div>
<script>
var h=document.getElementById('h'),t=document.getElementById('t');
h.style.animation='drag 2.1s cubic-bezier(.45,.05,.35,1) infinite';
t.style.animation='trail 2.1s ease-in-out infinite';
setTimeout(function(){var a=document.querySelectorAll('*');for(var i=0;i<a.length;i++){try{a[i].style.animationPlayState='paused'}catch(e){}}try{document.getAnimations().forEach(function(x){x.pause()})}catch(e){}},1300);</script></body></html>
