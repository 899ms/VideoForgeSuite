<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#0e0e11;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}.r{display:flex;gap:1.4vw;flex-wrap:wrap;justify-content:center;max-width:70vw}.b{width:8vh;height:8vh;border-radius:16px;background:linear-gradient(135deg,#8b5cf6,#ec4899);animation:st 1.8s cubic-bezier(.6,0,.2,1.4) infinite}@keyframes st{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-7vh) scale(1.12)}60%{transform:translateY(0) scale(.92)}}</style></head><body><div class="r" id="r"></div><script>document.getElementById("r").innerHTML=Array.from({length:15},(_,i)=>`<div class="b" style="animation-delay:${i*0.08}s"></div>`).join("")</script></body></html>
