<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#111;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}.g{display:grid;grid-template-columns:repeat(4,14vh);gap:1.6vh}.c{width:14vh;height:14vh;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:5vh;font-weight:800;color:#fff;transition:all .7s cubic-bezier(.7,0,.2,1)}</style></head><body><div class="g" id="g"></div><script>const E=["🚀","⚡","🎨","🔥","💎","🌟","🎯","🧩"],C=["#8b5cf6","#ec4899","#f59e0b","#10b981","#38bdf8","#ef4444","#a78bfa","#f472b6"];const g=document.getElementById("g");let items=E.map((e,i)=>{const d=document.createElement("div");d.className="c";d.textContent=e;d.style.background=C[i];d.style.order=i;g.appendChild(d);return d});setInterval(()=>{items.forEach(d=>{d.style.order=Math.floor(Math.random()*8);d.style.transform="scale(1.18) rotate(8deg)"});setTimeout(()=>items.forEach(d=>d.style.transform=""),420)},2000)</script></body></html>
