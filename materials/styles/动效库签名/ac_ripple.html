<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0f;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}.w{position:relative;width:100vw;height:100vh;overflow:hidden}.r{position:absolute;border-radius:50%;border:2px solid var(--c);animation:rp 2.4s ease-out forwards;opacity:0}@keyframes rp{0%{width:0;height:0;opacity:.9}100%{width:60vh;height:60vh;opacity:0}}</style></head><body><div class="w" id="w"></div><script>const C=["#f472b6","#a78bfa","#38bdf8","#34d399"];setInterval(()=>{const r=document.createElement("div");r.className="r";r.style.left=(10+Math.random()*75)+"vw";r.style.top=(10+Math.random()*75)+"vh";r.style.setProperty("--c",C[Math.floor(Math.random()*4)]);document.getElementById("w").appendChild(r);setTimeout(()=>r.remove(),2400)},380)</script></body></html>
