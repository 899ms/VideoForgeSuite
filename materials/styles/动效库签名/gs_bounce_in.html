<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#101014;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}.w{display:flex;gap:2.4vw}.b{width:11vh;height:11vh;border-radius:22px;background:linear-gradient(135deg,var(--a),var(--b));animation:bi 2.8s cubic-bezier(.3,1.6,.5,1) infinite;box-shadow:0 14px 34px rgba(0,0,0,.45)}@keyframes bi{0%{transform:translateY(-16vh) scale(.3);opacity:0}45%{transform:translateY(0) scale(1.06);opacity:1}60%{transform:translateY(-3vh) scale(.97)}75%{transform:translateY(0) scale(1)}100%{transform:translateY(0) scale(1);opacity:1}}</style></head><body><div class="w"><div class="b" style="--a:#f472b6;--b:#db2777"></div><div class="b" style="--a:#38bdf8;--b:#0369a1;animation-delay:.2s"></div><div class="b" style="--a:#34d399;--b:#047857;animation-delay:.4s"></div></div><script></script></body></html>
