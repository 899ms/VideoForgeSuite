<!doctype html><html lang=zh><head><meta charset=utf-8>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#18181b;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:34px;font-family:'Segoe UI',system-ui,sans-serif}
.sh{font-size:64px;font-weight:900;letter-spacing:4px;color:#3f3f46;background:linear-gradient(110deg,#52525b 42%,#fef08a 50%,#52525b 58%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 2.2s linear infinite}
@keyframes shine{to{background-position:-250% 0}}
.sh2{background:linear-gradient(110deg,#3f3f46 42%,#67e8f9 50%,#3f3f46 58%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;animation-delay:.4s}
.s{font-size:13px;color:#71717a;letter-spacing:6px}</style></head><body>
<div class=sh>SHINY TEXT</div><div class="sh sh2">流光掠过</div><div class=s>REACT BITS · SHINY TEXT</div>
<script>setTimeout(function(){try{document.getAnimations().forEach(function(x){x.pause()})}catch(e){}},1350);</script></body></html>
