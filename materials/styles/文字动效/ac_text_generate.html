<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#000;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}.t{font-size:6vw;font-weight:800;color:#fff}.t em{color:#38bdf8;font-style:normal}.cu{display:inline-block;width:.35em;height:1em;background:#38bdf8;vertical-align:-.1em;animation:bl 1s steps(1) infinite}@keyframes bl{50%{opacity:0}}</style></head><body><div class="t">Build <em id="w"></em><span class="cu"></span></div><script>const W=["websites","interfaces","experiences","animations","products"];let wi=0,ci=0,del=false;setInterval(()=>{const word=W[wi];if(!del){ci++;if(ci>=word.length){del=true;setTimeout(()=>{},0);if(ci>word.length+8){del=true;ci=word.length}}document.getElementById("w").textContent=word.slice(0,ci);if(ci>=word.length&&del&&document.getElementById("w").textContent===word){let n=0;const iv=setInterval(()=>{n++;if(n>18){clearInterval(iv);del=true}},80);}}else{ci--;document.getElementById("w").textContent=word.slice(0,ci);if(ci<=0){del=false;wi=(wi+1)%W.length}}},110)</script></body></html>
