<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#0f0a1e;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}.t{font-size:6.5vw;font-weight:800;color:#e9d5ff;max-width:80vw;text-align:center;line-height:1.35}.t span{display:inline-block;margin:0 .35em;filter:blur(14px);opacity:0;animation:bf 3.2s ease forwards infinite}@keyframes bf{18%{filter:blur(14px);opacity:0;transform:translateY(2vh)}45%,82%{filter:blur(0);opacity:1;transform:translateY(0)}100%{filter:blur(14px);opacity:0;transform:translateY(-2vh)}}</style></head><body><div class="t" id="t">Ship ideas faster than ever</div><script>const ws=document.getElementById("t").textContent.split(" ");document.getElementById("t").innerHTML=ws.map((x,i)=>`<span style="animation-delay:${i*180}ms">${x}</span>`).join(" ")</script></body></html>
