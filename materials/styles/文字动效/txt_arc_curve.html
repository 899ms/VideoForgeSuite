<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>弧形文字</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#0b1220}
#stage svg{width:80vh;height:80vh;animation:rot 14s linear infinite}
#stage text{font-size:5.4vh;font-weight:900;fill:#7ef0ff;letter-spacing:.9vh}
@keyframes rot{to{transform:rotate(360deg)}}
</style></head>
<body><div id="stage"><svg viewBox="0 0 400 400"><defs><path id="cp" d="M200,200 m-150,0 a150,150 0 1,1 300,0 a150,150 0 1,1 -300,0"/></defs><text><textPath href="#cp">VIDEO FORGE SUITE · 素材军火库 · FORGE ·</textPath></text><circle cx="200" cy="200" r="70" fill="none" stroke="#fb7185" stroke-width="2" stroke-dasharray="10 8"/></svg></div></body></html>
