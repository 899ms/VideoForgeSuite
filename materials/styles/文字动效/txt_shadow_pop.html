<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>硬阴影字</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#ffe45e}
#stage span{font-size:13vh;font-weight:900;letter-spacing:.05em;color:#111;display:inline-block;animation:pk 3.2s cubic-bezier(.34,1.56,.64,1) infinite;text-shadow:.7vh .7vh 0 #ff5d8f,1.4vh 1.4vh 0 #4cc9f0}
@keyframes pk{0%,100%{transform:translate(0,0) rotate(-2deg)}50%{transform:translate(-1vh,-1vh) rotate(2deg);text-shadow:1.2vh 1.2vh 0 #ff5d8f,2.4vh 2.4vh 0 #4cc9f0}}
</style></head>
<body><div id="stage"><span>BOOM!</span></div></body></html>
