<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>逐字动能文字</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
.bg{position:fixed;inset:0;background:radial-gradient(70% 70% at 50% 45%,#7C6CF5cc 0%,transparent 72%),radial-gradient(55% 55% at 18% 82%,#29D3E6aa 0%,transparent 70%),radial-gradient(55% 55% at 82% 18%,#FF5C8Aaa 0%,transparent 70%),linear-gradient(135deg,#2b2542,#171428);animation:hue 22s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}canvas{width:100%;height:100%;display:block}
.txt{color:#fff;font-weight:900;text-align:center}
.txt span{display:inline-block;transform-origin:bottom}</style></head>
<body><div class="bg"></div><div id="stage"><div class="txt" id="t" style="font-size:62px;letter-spacing:4px">KINETIC MOTION</div></div>
<script>var el=document.getElementById('t'),s=el.textContent;el.textContent='';
        [].forEach.call(s,function(ch){var sp=document.createElement('span');sp.textContent=ch===' '?'\u00A0':ch;el.appendChild(sp);});
        var sp=el.querySelectorAll('span'),k=0;
        (function tick(){sp.forEach(function(e,i){e.style.transition='transform .5s cubic-bezier(.2,1.4,.4,1),opacity .5s';if(i===k){e.style.transform='translateY(-22px) rotate(-6deg)';e.style.opacity=1;}else{e.style.transform='translateY(0) rotate(0)';e.style.opacity=.45;}});k=(k+1)%sp.length;setTimeout(tick,420);})();</script></body></html>
