<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#020617;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}.t{font-size:6.5vw;font-weight:800;color:#94a3b8;line-height:1.3;max-width:75vw}.w{display:inline-block;color:#38bdf8;animation:fw .6s ease}.sh{color:#e2e8f0}@keyframes fw{from{opacity:0;transform:translateY(3vh) rotateX(80deg)}to{opacity:1;transform:none}}</style></head><body><div class="t"><span class="sh">Coding is </span><span class="w" id="w">fun</span></div><script>const W=["fun","creative","powerful","addictive","limitless"],e=document.getElementById("w");let i=0;setInterval(()=>{i=(i+1)%W.length;e.style.animation="none";e.offsetHeight;e.style.animation="";e.textContent=W[i]},2000)</script></body></html>
