<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#0c0a09;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}.t{font-size:8vw;font-weight:900;color:#fafaf9;letter-spacing:.3vw}.t span{display:inline-block;transition:all .4s}.t span.gone{transform:scale(0);opacity:0}.h{font-size:2vw;color:#78716c;margin-top:4vh}</style></head><body><div><div class="t" id="t">DISAPPEAR</div><div class="h">letters vanish one by one</div></div><script>const sp=[...document.getElementById("t").textContent],el=document.getElementById("t");el.innerHTML=sp.map(c=>`<span>${c}</span>`).join("");let k=0;setInterval(()=>{const ss=el.children;ss[k%sp.length].classList.add("gone");k++;if(k%sp.length===0)setTimeout(()=>[...ss].forEach(s=>s.classList.remove("gone")),500)},300)</script></body></html>
