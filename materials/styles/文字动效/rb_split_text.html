<!DOCTYPE html><html><head><meta charset="utf-8"><style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0f;display:flex;align-items:center;justify-content:center;font-family:'Segoe UI',Arial,sans-serif}.t{font-size:11vw;font-weight:900;color:#fff;letter-spacing:.4vw}.t span{display:inline-block;animation:pop 2.8s cubic-bezier(.2,.8,.2,1.5) infinite}@keyframes pop{0%,12%{transform:scale(.2) translateY(6vh);opacity:0}32%,80%{transform:scale(1) translateY(0);opacity:1}100%{transform:scale(.2) translateY(-6vh);opacity:0}}</style></head><body><div class="t" id="t">CREATE AMAZING</div><script>document.getElementById("t").innerHTML=[...document.getElementById("t").textContent].map((c,i)=>`<span style="animation-delay:${i*90}ms">${c==" "?"&nbsp;":c}</span>`).join("")</script></body></html>
