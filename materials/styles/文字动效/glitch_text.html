<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>故障文字</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
.bg{position:fixed;inset:0;background:radial-gradient(70% 70% at 50% 45%,#00E5FFcc 0%,transparent 72%),radial-gradient(55% 55% at 18% 82%,#FF2E97aa 0%,transparent 70%),radial-gradient(55% 55% at 82% 18%,#7C4DFFaa 0%,transparent 70%),linear-gradient(135deg,#2b2542,#171428);animation:hue 22s linear infinite}
@keyframes hue{to{filter:hue-rotate(360deg)}}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}canvas{width:100%;height:100%;display:block}
.txt{color:#fff;font-weight:900;text-align:center}
.gl{position:relative;font-size:84px;font-weight:900;color:#fff;letter-spacing:4px}.gl::before,.gl::after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;overflow:hidden}.gl::before{color:#FF2E97;animation:g1 2.2s infinite linear alternate-reverse;clip-path:inset(0 0 60% 0)}.gl::after{color:#00E5FF;animation:g2 1.7s infinite linear alternate-reverse;clip-path:inset(55% 0 0 0)}@keyframes g1{0%{transform:translate(0,0)}50%{transform:translate(-4px,2px)}100%{transform:translate(3px,-2px)}}@keyframes g2{0%{transform:translate(0,0)}50%{transform:translate(4px,-2px)}100%{transform:translate(-3px,2px)}}</style></head>
<body><div class="bg"></div><div id="stage"><div class="gl" data-text="GLITCH">GLITCH</div></div>
<script></script></body></html>
