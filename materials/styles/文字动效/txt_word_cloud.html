<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>词云浮现</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:1.5vh 3.5vh;padding:0 10vh;background:radial-gradient(80% 80% at 50% 45%,#101830,#070b16)}
#stage span{font-size:var(--s);font-weight:900;color:var(--c);text-shadow:0 0 3vh color-mix(in srgb,var(--c) 50%,transparent);animation:gl 6s ease-in-out infinite;animation-delay:calc(var(--i)*.45s)}
@keyframes gl{0%,100%{filter:brightness(.55)}50%{filter:brightness(1.6);transform:scale(1.08)}}
</style></head>
<body><div id="stage"><span style="--s:8.5vh;--c:#7ef0ff;--i:0">AI</span><span style="--s:6.5vh;--c:#fbbf24;--i:1">视频</span><span style="--s:7.5vh;--c:#fb7185;--i:2">特效</span><span style="--s:5.5vh;--c:#34d399;--i:3">剪辑</span><span style="--s:6vh;--c:#a5b4fc;--i:4">转场</span><span style="--s:5vh;--c:#f472b6;--i:5">自动化</span><span style="--s:4.5vh;--c:#fdba74;--i:6">工作流</span><span style="--s:4vh;--c:#67e8f9;--i:7">素材库</span><span style="--s:5.5vh;--c:#c4b5fd;--i:8">爆款</span><span style="--s:4vh;--c:#fde68a;--i:9">上分</span><span style="--s:4.5vh;--c:#5eead4;--i:10">数字人</span><span style="--s:3.8vh;--c:#fca5a5;--i:11">口播</span></div></body></html>
