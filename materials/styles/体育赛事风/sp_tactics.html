<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>战术板</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#1e5c34}
.bd{position:relative;width:60vw;height:60vh;background:repeating-linear-gradient(0deg,#2e7d4f 0 11.6vh,#27914f 11.6vh 12vh);border:.8vh solid #fff;border-radius:1vh;box-shadow:0 2vh 5vh #0005}
.bd svg{position:absolute;inset:0;width:100%;height:100%}
.bd path{fill:none;stroke:#ffe082;stroke-width:.6vh;stroke-dasharray:1.6 1.6;stroke-linecap:round;stroke-dashoffset:300;animation:rn 4.5s ease-in-out infinite}
.bd path.p2{stroke:#ff8a80;animation-delay:1.2s;stroke-dashoffset:240}
.pl{position:absolute;width:2.6vh;height:2.6vh;border-radius:50%;background:#fff;box-shadow:0 0 1vh #0006;animation:mv 4.5s ease-in-out infinite}
.pl.x{background:#ff8a80;animation-delay:1.2s}
@keyframes rn{0%{stroke-dashoffset:300}60%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
@keyframes mv{0%{left:12%;top:78%}60%,85%{left:70%;top:20%}100%{left:12%;top:78%;opacity:0}}
</style></head>
<body><div id="stage"><div class="bd"><svg viewBox="0 0 600 300" preserveAspectRatio="none"><path d="M70,235 C180,260 300,180 420,60 M420,60 L400,78 M420,60 L438,74"/><path class="p2" d="M120,80 C220,60 320,110 400,200 M400,200 L382,186 M400,200 L402,178"/></svg><span class="pl"></span><span class="pl x" style="left:18%;top:24%"></span></div></div></body></html>
