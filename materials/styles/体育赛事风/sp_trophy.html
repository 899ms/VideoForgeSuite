<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>夺冠时刻</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(70% 70% at 50% 40%,#26304a,#0c1018);overflow:hidden}
.tr{font-size:20vh;filter:drop-shadow(0 1vh 3vh #ffd54f88);animation:tz 3.8s ease-out infinite}
.cf{position:absolute;width:1.6vh;height:2.6vh;top:-6vh;animation:cf 2.8s linear infinite}
@keyframes tz{0%{transform:scale(.4);opacity:0}22%{transform:scale(1.15)}30%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1)}}
@keyframes cf{to{transform:translateY(110vh) rotate(540deg)}}
</style></head>
<body><div id="stage"><span class="tr">🏆</span><i class="cf" style="left:0%;background:#ffd54f;animation-delay:0.0s"></i><i class="cf" style="left:37%;background:#ef5350;animation-delay:0.23s"></i><i class="cf" style="left:74%;background:#42a5f5;animation-delay:0.46s"></i><i class="cf" style="left:11%;background:#ffd54f;animation-delay:0.6900000000000001s"></i><i class="cf" style="left:48%;background:#ef5350;animation-delay:0.92s"></i><i class="cf" style="left:85%;background:#42a5f5;animation-delay:1.1500000000000001s"></i><i class="cf" style="left:22%;background:#ffd54f;animation-delay:1.3800000000000001s"></i><i class="cf" style="left:59%;background:#ef5350;animation-delay:1.61s"></i><i class="cf" style="left:96%;background:#42a5f5;animation-delay:1.84s"></i><i class="cf" style="left:33%;background:#ffd54f;animation-delay:2.0700000000000003s"></i><i class="cf" style="left:70%;background:#ef5350;animation-delay:2.3000000000000003s"></i><i class="cf" style="left:7%;background:#42a5f5;animation-delay:2.5300000000000002s"></i><i class="cf" style="left:44%;background:#ffd54f;animation-delay:2.7600000000000002s"></i><i class="cf" style="left:81%;background:#ef5350;animation-delay:0.1900000000000004s"></i><i class="cf" style="left:18%;background:#42a5f5;animation-delay:0.4200000000000004s"></i><i class="cf" style="left:55%;background:#ffd54f;animation-delay:0.6500000000000004s"></i><i class="cf" style="left:92%;background:#ef5350;animation-delay:0.8800000000000003s"></i><i class="cf" style="left:29%;background:#42a5f5;animation-delay:1.1100000000000003s"></i></div></body></html>
