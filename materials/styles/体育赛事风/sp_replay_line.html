<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>回放描线</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#0b0e12;display:grid;place-items:center;overflow:hidden}
.fr{position:relative;width:64vw;height:52vh;background:linear-gradient(160deg,#1b2530,#101820);border:.4vh solid #2c3a48;border-radius:.8vh;overflow:hidden}
.tg{position:absolute;left:3%;top:6%;background:#d0342c;color:#fff;font-size:2.4vh;font-weight:900;letter-spacing:.2em;padding:.8vh 2vh;border-radius:.4vh;animation:bl 1s steps(1) infinite}
.ln{position:absolute;left:14%;bottom:20%;width:0;height:.5vh;background:#4fc3f7;border-radius:.4vh;box-shadow:0 0 1.6vh #4fc3f7;animation:tr 4.5s ease-in-out infinite;transform-origin:left}
.ln:after{content:"";position:absolute;right:-1.2vh;top:-1vh;border:.9vh solid transparent;border-left:1.6vh solid #4fc3f7}
.ball{position:absolute;width:2vh;height:2vh;border-radius:50%;background:#fff;box-shadow:0 0 2vh #4fc3f7;animation:blm 4.5s ease-in-out infinite}
@keyframes tr{0%{width:0}55%,82%{width:56%}100%{width:56%;opacity:0}}
@keyframes blm{0%{left:14%;bottom:20%}55%,82%{left:68%;bottom:64%}100%{left:68%;bottom:64%;opacity:0}}
@keyframes bl{50%{opacity:.4}}
</style></head>
<body><div id="stage"><div class="fr"><span class="tg">REPLAY 回放</span><span class="ln"></span><span class="ball"></span></div></div></body></html>
