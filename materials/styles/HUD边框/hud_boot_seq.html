<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>系统自检启动</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#050a08;color:#22ff88;font-family:'Courier New',monospace;padding:6vh 7vw;font-size:2.8vh;line-height:2.1;overflow:hidden}
.ln{opacity:0;animation:ap .1s steps(1) forwards}

</style></head>
<body><div id="stage"><div><div class="ln " style="animation-delay:0.0s">HERMES OS v5.2 booting...</div><div class="ln ok" style="animation-delay:0.32s">mount /dev/gpu0 ... cuda ready</div><div class="ln ok" style="animation-delay:0.64s">load model weights ... 42.7GB</div><div class="ln " style="animation-delay:0.96s">init timeline engine ... ok</div><div class="ln ok" style="animation-delay:1.28s">attach materials bank ... 500+ items</div><div class="ln ok" style="animation-delay:1.6s">render pipeline ... 60fps</div><div class="ln " style="animation-delay:1.92s">ALL SYSTEMS NOMINAL</div></div></div></body></html>
