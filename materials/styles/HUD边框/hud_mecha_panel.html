<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>机甲座舱</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:linear-gradient(#0c1220,#050810);font-family:monospace;color:#7ee0ff;overflow:hidden}
.fr{position:absolute;inset:4%;border:.3vh solid #7ee0ff44;border-radius:2vh}
.fr:before{content:"MECHA-04";position:absolute;left:3vh;top:-1.6vh;background:#0c1220;padding:0 1.4vh;font-size:2.4vh;letter-spacing:.3em}
.pl{position:absolute;display:flex;flex-direction:column;gap:1vh;font-size:2.4vh}
.pl .r{display:flex;justify-content:space-between;width:24vw;color:#9ff}
.pl .r b{color:#ffd166}
.lt{left:7%;top:14%}.rt{right:7%;top:14%;text-align:right}
.wn{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);width:30vw;height:2vh;border:.2vh solid #7ee0ff44}
.wn i{position:absolute;left:0;top:0;bottom:0;background:#7ee0ff;width:72%}
.core{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:10vh;height:10vh;border-radius:50%;border:.4vh solid #7ee0ff55;display:grid;place-items:center;color:#ffd166;font-size:2.2vh;animation:pu 2s ease-in-out infinite}
@keyframes pu{50%{box-shadow:0 0 4vh #7ee0ff55}}
</style></head>
<body><div id="stage"><div class="fr"></div><div class="pl lt"><div class="r"><span>ENERGY</span><b>72%</b></div><div class="r"><span>SHIELD</span><b>OK</b></div><div class="r"><span>AMMO</span><b>240</b></div></div><div class="pl rt"><div class="r"><span>SYNC</span><b>98.2%</b></div><div class="r"><span>THRUST</span><b>MAX</b></div><div class="r"><span>THREAT</span><b style="color:#ff5252">2 KM</b></div></div><div class="core">CORE</div><div class="wn"><i></i></div></div></body></html>
