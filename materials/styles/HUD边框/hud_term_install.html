<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>终端安装</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#0c0c0f;color:#d8dee9;font-family:'Courier New',monospace;display:grid;place-items:center}
.tm{width:56vw;background:#111318;border:.2vh solid #2a2e37;border-radius:1.2vh;overflow:hidden}
.hd2{background:#1a1d24;padding:1.2vh 2vh;font-size:2.4vh;color:#8a93a6;display:flex;gap:1vh;align-items:center}
.hd2 i{width:1.4vh;height:1.4vh;border-radius:50%;background:#ff5f57}.hd2 i:nth-child(2){background:#febc2e}.hd2 i:nth-child(3){background:#28c840}
.bd2{padding:2.4vh 2.6vh;font-size:2.6vh;line-height:2}
.gn{color:#4ade80}.yl{color:#fbbf24}
.pg{display:inline-block;width:12em;border:.1em solid #2a2e37;height:1em;vertical-align:middle;position:relative;margin-left:1em}
.pg:after{content:"";position:absolute;left:0;top:0;bottom:0;width:0;background:#4ade80;animation:pi 4s steps(24) infinite}
@keyframes pi{to{width:100%}}
</style></head>
<body><div id="stage"><div class="tm"><div class="hd2"><i></i><i></i><i></i>hermes — install</div><div class="bd2"><div class="gn">$ pip install videoforgesuite</div><div>Collecting diffsynth<span class="pg"></span></div><div class="yl">Installing collected packages…<span class="pg" style="animation-delay:1.4s"></span></div><div class="gn">✓ 500+ 特效素材已就绪</div></div></div></div></body></html>
