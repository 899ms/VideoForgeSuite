<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>手绘时钟</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#fff}
.ck{position:relative;width:40vh;height:40vh;border:1vh solid #222;border-radius:50%;background:#fff}
.ck i{position:absolute;left:50%;top:50%;background:#222;transform-origin:0 0;border-radius:1vh}
.hr{width:.9vh;height:10vh;animation:hh 6s linear infinite}
.mn{width:.6vh;height:15vh;animation:mm 6s linear infinite}
.ck b{position:absolute;width:1.3vh;height:1.3vh;background:#222;border-radius:50%;left:calc(50% - .65vh);top:calc(50% - .65vh)}
.tk{position:absolute;width:.5vh;height:1.6vh;background:#555;left:calc(50% - .25vh);top:1.6vh;transform-origin:.25vh 18.4vh}
@keyframes hh{to{transform:rotate(360deg)}}
@keyframes mm{to{transform:rotate(1440deg)}}
</style></head>
<body><div id="stage"><div class="ck"><span class="tk" style="transform:rotate(0deg)"></span><span class="tk" style="transform:rotate(30deg)"></span><span class="tk" style="transform:rotate(60deg)"></span><span class="tk" style="transform:rotate(90deg)"></span><span class="tk" style="transform:rotate(120deg)"></span><span class="tk" style="transform:rotate(150deg)"></span><span class="tk" style="transform:rotate(180deg)"></span><span class="tk" style="transform:rotate(210deg)"></span><span class="tk" style="transform:rotate(240deg)"></span><span class="tk" style="transform:rotate(270deg)"></span><span class="tk" style="transform:rotate(300deg)"></span><span class="tk" style="transform:rotate(330deg)"></span><i class="hr"></i><i class="mn"></i><b></b></div></div></body></html>
