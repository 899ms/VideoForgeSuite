<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>手绘步骤流</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#fff}
.fl{display:flex;align-items:center;gap:2.5vh;font-size:3vh;font-weight:700;color:#222}
.st{display:flex;flex-direction:column;align-items:center;gap:1.4vh;opacity:0;animation:si 5.5s ease-out infinite}
.st .no{width:6.5vh;height:6.5vh;border:.5vh solid #222;border-radius:50% 46% 52% 48%/48% 52% 46% 52%;display:grid;place-items:center;font-size:3vh;background:#fff9d6}
.ar{width:7vh;height:3.4vh;opacity:0;animation:ai 5.5s ease-out infinite}
@keyframes si{0%{opacity:0;transform:translateY(2vh) scale(.8)}14%,86%{opacity:1;transform:none}100%{opacity:0}}
@keyframes ai{0%{opacity:0}14%{opacity:0;transform:translateX(-1.5vh)}22%,86%{opacity:1;transform:none}100%{opacity:0}}
.st:nth-child(3){animation-delay:.7s}.ar:nth-child(4){animation-delay:1.1s}
.st:nth-child(5){animation-delay:1.4s}.ar:nth-child(6){animation-delay:1.8s}
</style></head>
<body><div id="stage"><div class="fl"><div class="st"><span class="no">1</span>拍脑洞</div><svg class="ar" viewBox="0 0 70 34"><path d="M2,22 C20,10 44,10 62,20 M62,20 L52,12 M62,20 L54,28" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round"/></svg><div class="st"><span class="no">2</span>画分镜</div><svg class="ar" viewBox="0 0 70 34"><path d="M2,22 C20,10 44,10 62,20 M62,20 L52,12 M62,20 L54,28" fill="none" stroke="#222" stroke-width="3" stroke-linecap="round"/></svg><div class="st"><span class="no">3</span>出成片</div></div></div></body></html>
