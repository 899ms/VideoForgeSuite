<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>白板描线</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#fdfdfa;display:grid;place-items:center}
.sk{width:46vw;overflow:visible}
.sk path{fill:none;stroke:#333;stroke-width:.8vh;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:900;stroke-dashoffset:900;animation:dw 5s ease-in-out infinite}
.sk circle{fill:none;stroke:#e74c3c;stroke-width:.7vh;stroke-dasharray:160;stroke-dashoffset:160;animation:dc 5s ease-in-out infinite}
@keyframes dw{0%{stroke-dashoffset:900}55%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
@keyframes dc{0%,45%{stroke-dashoffset:160}75%,90%{stroke-dashoffset:0}100%{opacity:0}}
</style></head>
<body><div id="stage"><svg class="sk" viewBox="0 0 200 120"><path d="M20 100 C40 30 90 20 100 55 C110 20 160 30 180 100"/><circle cx="100" cy="82" r="20"/></svg></div></body></html>
