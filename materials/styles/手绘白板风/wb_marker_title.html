<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>马克笔手写</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#fffdf6;display:grid;place-items:center}
.mk{font-family:'Segoe Print','Comic Sans MS','Noto Sans SC',cursive;font-size:8vh;font-weight:700;color:#1a5fb4;position:relative}
.mk:after{content:"";position:absolute;left:0;bottom:.2vh;height:2vh;width:0;background:#ffd23f;z-index:-1;border-radius:1vh;animation:mu 3s steps(18) infinite}
@keyframes mu{0%{width:0}55%,85%{width:100%}100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="mk">手写才够真诚</div></div></body></html>
