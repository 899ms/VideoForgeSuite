<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>粉笔板书</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:radial-gradient(120% 100% at 50% 0,#2e4a3a,#1f3328);display:grid;place-items:center}
.ck{font-size:9vh;font-weight:800;color:#f2f0e4;letter-spacing:.1em;white-space:nowrap;overflow:hidden;border-right:1vh solid #f2f0e4aa;width:0;animation:tp 4s steps(14) infinite alternate;text-shadow:0 0 .6vh #f2f0e488,0 0 .2vh #fff}
.ck{font-family:'Comic Sans MS','Noto Sans SC',cursive}
@keyframes tp{to{width:7.6em}}
</style></head>
<body><div id="stage"><div class="ck">今天讲透这件事</div></div></body></html>
