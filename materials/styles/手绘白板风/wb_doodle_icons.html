<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>涂鸦弹跳</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#fff;display:flex;gap:5vh;align-items:center;justify-content:center}
.d{width:11vh;height:11vh;border:.7vh solid #333;border-radius:2vh;font-size:5.5vh;display:grid;place-items:center;animation:bb 2.6s cubic-bezier(.34,1.56,.64,1) infinite}
.d:nth-child(2){animation-delay:.15s;border-color:#e74c3c;border-radius:50% 42% 55% 45%}
.d:nth-child(3){animation-delay:.3s;border-color:#2980b9;transform:rotate(-6deg)}
.d:nth-child(4){animation-delay:.45s;border-color:#27ae60;border-radius:50% 55% 42% 50%}
@keyframes bb{0%,100%{transform:translateY(0) rotate(0)}35%{transform:translateY(-6vh) rotate(6deg)}60%{transform:translateY(0) scale(1.06,.94)}75%{transform:translateY(-1.4vh)}}
</style></head>
<body><div id="stage"><div class="d">💡</div><div class="d">✏️</div><div class="d">📌</div><div class="d">🎯</div></div></body></html>
