<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>思想泡泡</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#fff}
.fig{position:absolute;left:18%;bottom:18%;font-size:9vh}
.bub{position:absolute;right:16%;top:16%;background:#fff;border:.45vh solid #222;border-radius:50%;padding:4vh 5vh;font-size:3.4vh;font-weight:700;animation:pp 4.5s ease-out infinite;opacity:0}
.d1,.d2,.d3{position:absolute;border-radius:50%;background:#fff;border:.35vh solid #222;opacity:0;animation:dp 4.5s ease-out infinite}
.d1{width:2.4vh;height:2.4vh;right:34%;top:44%}.d2{width:1.7vh;height:1.7vh;right:29%;top:54%}.d3{width:1.1vh;height:1.1vh;right:25%;top:62%}
@keyframes dp{0%,18%{opacity:0;transform:scale(.3)}28%{opacity:1;transform:scale(1)}85%{opacity:1}100%{opacity:0}}
@keyframes pp{0%,26%{opacity:0;transform:scale(.5)}36%{opacity:1;transform:scale(1.06)}42%{transform:scale(1)}85%{opacity:1;transform:scale(1)}100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="fig">🤔</div><div class="d3"></div><div class="d2"></div><div class="d1"></div><div class="bub">今天吃什么？</div></div></body></html>
