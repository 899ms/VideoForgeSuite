<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>手绘流程图</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#fffdf5;display:grid;place-items:center}
.fl{display:flex;align-items:center;gap:2vh}
.nd{border:.6vh solid #2c3e50;border-radius:.4vh 1.4vh .6vh 1.2vh;padding:2vh 3vh;font-size:3.4vh;font-weight:700;color:#2c3e50;background:#fff;opacity:0;animation:nn 6s steps(1) infinite}
.ar{font-size:4.5vh;color:#e67e22;opacity:0;animation:nn 6s steps(1) infinite}
.nd:nth-child(1),.ar:nth-child(2){animation-delay:0s}.nd:nth-child(3),.ar:nth-child(4){animation-delay:.9s}.nd:nth-child(5){animation-delay:1.8s}
@keyframes nn{0%{opacity:0;transform:scale(.7)}10%,86%{opacity:1;transform:scale(1)}100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="fl"><div class="nd">发现问题</div><div class="ar">→</div><div class="nd">拆解原因</div><div class="ar">→</div><div class="nd">解决</div></div></div></body></html>
