<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>公式推导</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#1e3242;display:grid;place-items:center}
.eq{color:#e8f1f2;font-size:4.6vh;font-family:'Cambria Math',Georgia,serif;line-height:2.3;text-align:center;opacity:0;animation:em 7.5s steps(1) infinite}
.eq:nth-child(2){animation-delay:1.8s}.eq:nth-child(3){animation-delay:3.6s}.eq:nth-child(4){animation-delay:5.4s;color:#ffd166;font-weight:700}
@keyframes em{0%{opacity:0;transform:translateY(2vh)}8%,88%{opacity:1;transform:none}100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="eq">E = mc²</div><div class="eq">⇒ E² = (mc²)² + (pc)²</div><div class="eq">⇒ p = E/c</div><div class="eq">∴ 质量即能量</div></div></body></html>
