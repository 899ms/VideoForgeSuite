<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>板擦擦除</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#fff;display:grid;place-items:center}
.old{position:absolute;inset:0;background:#eaf4ff;display:grid;place-items:center;font-size:8vh;color:#2980b9;font-weight:800;clip-path:inset(0 0 0 0);animation:er 4s steps(24) infinite}
.erb{position:absolute;width:16vh;height:8vh;background:linear-gradient(#ff7043 55%,#ffccbc 55%);border-radius:1.4vh;box-shadow:.6vh .8vh 1.4vh #0004;animation:mv 4s steps(24) infinite;z-index:2}
@keyframes er{0%,20%{clip-path:inset(0 0 0 0)}80%,100%{clip-path:inset(0 0 0 100%)}}
@keyframes mv{0%,20%{left:0;top:70%}80%,100%{left:100%;top:60%}}
</style></head>
<body><div id="stage"><div class="old">旧知识</div><div class="erb"></div></div></body></html>
