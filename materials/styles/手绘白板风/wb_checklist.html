<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>手绘清单</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;display:grid;place-items:center;background:#fff}
.cl{font-size:3.4vh;line-height:2.3;color:#222}
.cl li{list-style:none;display:flex;align-items:center;gap:2vh;opacity:0;animation:li 6s steps(1) infinite}
.cl .bx{width:3.2vh;height:3.2vh;border:.4vh solid #222;border-radius:.8vh;position:relative}
.cl .bx:after{content:"";position:absolute;left:.2vh;top:-1vh;width:3.4vh;height:2.4vh;border:.5vh solid #2e7d32;border-radius:.5vh;border-top:0;border-right:0;transform:rotate(-50deg) scale(0);animation:ck 6s ease-out infinite}
.cl li:nth-child(1){animation-delay:.2s}.cl li:nth-child(1) .bx:after{animation-delay:.5s}
.cl li:nth-child(2){animation-delay:1.6s}.cl li:nth-child(2) .bx:after{animation-delay:1.9s}
.cl li:nth-child(3){animation-delay:3s}.cl li:nth-child(3) .bx:after{animation-delay:3.3s}
@keyframes li{0%{opacity:0}6%,88%{opacity:1}100%{opacity:0}}
@keyframes ck{0%,10%{transform:rotate(-50deg) scale(0)}20%,88%{transform:rotate(-50deg) scale(1)}100%{transform:rotate(-50deg) scale(0)}}
</style></head>
<body><div id="stage"><ul class="cl"><li><span class="bx"></span>先定钩子（前3秒）</li><li><span class="bx"></span>再列素材清单</li><li><span class="bx"></span>最后排时间线</li></ul></div></body></html>
