<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>手绘指点</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#fff;display:grid;place-items:center}
.card{width:34vw;height:26vh;background:#f6f8fa;border:.5vh dashed #90a4ae;border-radius:2vh;display:grid;place-items:center;font-size:4.5vh;color:#546e7a;font-weight:700}
.hand{position:absolute;left:58%;top:56%;font-size:9vh;animation:pt 2.8s ease-in-out infinite;transform-origin:20% 20%}
@keyframes pt{0%,100%{transform:translate(0,0)}45%,60%{transform:translate(-12vh,-6vh) scale(.94)}}
.ripple{position:absolute;left:50%;top:46%;width:6vh;height:6vh;border:.7vh solid #e74c3c;border-radius:50%;animation:rp 2.8s ease-out infinite}
@keyframes rp{0%,55%{transform:scale(0);opacity:1}80%{transform:scale(2.2);opacity:0}100%{opacity:0}}
</style></head>
<body><div id="stage"><div class="card">点这里</div><div class="ripple"></div><div class="hand">👆</div></div></body></html>
