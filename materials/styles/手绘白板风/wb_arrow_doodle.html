<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>箭头涂鸦雨</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#fffef8;overflow:hidden}
.a{position:absolute;font-size:6vh;color:#e67e22;animation:fv 5s linear infinite;opacity:0}
.a{left:calc(var(--x)*1%);animation-delay:calc(var(--d)*1s);color:hsl(calc(var(--h)*1),70%,50%);transform:rotate(calc(var(--x)*3.6deg))}
@keyframes fv{0%{top:-12%;opacity:0}12%{opacity:.9}85%{opacity:.9}100%{top:112%;opacity:0}}
.tg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:6.4vh;font-weight:900;color:#2c3e50;background:#fff59d;padding:1.6vh 3.6vh;border-radius:2vh;box-shadow:.8vh 1vh 0 #0002}
</style></head>
<body><div id="stage"><div class="tg">都指向这里</div><div class="a" style="--x:0;--d:0.0;--h:0">➜</div><div class="a" style="--x:37;--d:0.7;--h:47">➜</div><div class="a" style="--x:74;--d:1.4;--h:94">➜</div><div class="a" style="--x:11;--d:2.0999999999999996;--h:141">➜</div><div class="a" style="--x:48;--d:2.8;--h:188">➜</div><div class="a" style="--x:85;--d:3.5;--h:235">➜</div><div class="a" style="--x:22;--d:0.1999999999999993;--h:282">➜</div><div class="a" style="--x:59;--d:0.8999999999999995;--h:329">➜</div><div class="a" style="--x:96;--d:1.5999999999999996;--h:16">➜</div><div class="a" style="--x:33;--d:2.3;--h:63">➜</div></div></body></html>
