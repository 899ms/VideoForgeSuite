<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8"><title>蜡笔涂鸦</title>
<style>*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter','Noto Sans SC',system-ui,sans-serif}
#stage{position:fixed;inset:0;background:#fdf3d8;display:grid;place-items:center}
.cr{width:52vw;height:34vh;overflow:visible}
.cr path{fill:none;stroke-linecap:round;stroke-width:1.3vh;stroke-dasharray:800;stroke-dashoffset:800;filter:url(#r)}
@keyframes cw{0%{stroke-dashoffset:800}55%,85%{stroke-dashoffset:0}100%{opacity:0}}
.cr .a{stroke:#e74c3c;animation:cw 4s steps(22) infinite}
.cr .b{stroke:#3498db;stroke-width:1.6vh;animation:cw 4s steps(22) .5s infinite}
.cr .c{stroke:#f39c12;stroke-width:1.1vh;animation:cw 4s steps(22) 1s infinite}
</style></head>
<body><div id="stage"><svg class="cr" viewBox="0 0 300 160" xmlns="http://www.w3.org/2000/svg"><defs><filter id="r"><feTurbulence baseFrequency=".9" numOctaves="2" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4"/></filter></defs><path class="a" d="M30 130 Q90 20 150 80 T270 50"/><path class="b" d="M40 60 Q110 140 180 70"/><circle class="c" cx="230" cy="110" r="26"/></svg></div></body></html>
