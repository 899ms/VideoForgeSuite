<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VideoForge Suite · 视频生产中枢</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div class="aurora" aria-hidden="true"></div>
<div class="grid-overlay" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">◤</span>
    <h1>VideoForge<span>Suite</span></h1>
    <span class="brand-tag">视频生产中枢</span>
  </div>
  <div class="top-search">
    <svg class="search-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 21l-4.3-4.3M11 19a8 8 0 110-16 8 8 0 010 16z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    <input id="search" type="search" placeholder="搜索素材 / 动效 / 组件 / 转场…" aria-label="搜索素材" />
  </div>
  <div class="top-right">
    <span id="env-pill" class="env-pill">连接中…</span>
  </div>
</header>

<main class="layout">
  <!-- 左：引擎 + 生成 + 队列 -->
  <aside class="sidebar">
    <section class="panel">
      <div class="panel-head"><h2>引擎状态</h2><span class="hint">三件套平级</span></div>
      <div id="engine-list" class="engine-list"></div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2>生成视频</h2><span class="hint">H3 / Remotion</span></div>
      <form id="gen-form" class="gen-form" autocomplete="off">
        <label class="field">
          <span>画面描述</span>
          <textarea id="prompt" rows="2" placeholder="例如：赛博城市夜景，霓虹雨，电影感推镜…"></textarea>
        </label>
        <div class="row">
          <label class="field small">
            <span>模式</span>
            <select id="mode">
              <option value="t2v">文生视频</option>
              <option value="i2v">图生视频</option>
              <option value="remotion">Remotion 合成</option>
            </select>
          </label>
          <label class="field small">
            <span>时长(s)</span>
            <input id="num_frames" type="number" min="2" max="15" value="5" />
          </label>
        </div>
        <div class="row">
          <label class="field small"><span>步数</span><input id="steps" type="number" min="1" max="50" value="25" /></label>
          <label class="field small"><span>种子</span><input id="seed" type="number" value="42" /></label>
        </div>
        <button id="gen-btn" class="btn-primary" type="submit">⚡ 生成</button>
        <div id="gen-status" class="gen-status"></div>
      </form>
    </section>

    <section class="panel grow">
      <div class="panel-head"><h2>生成队列</h2></div>
      <div id="job-list" class="job-list"><div class="loading">暂无任务</div></div>
    </section>
  </aside>

  <!-- 中：素材库 -->
  <section class="gallery">
    <div class="panel gallery-panel">
      <div class="gallery-head">
        <div class="gh-left">
          <h2>素材库</h2>
          <span id="mat-count" class="count-badge">0</span>
        </div>
        <div class="cat-tabs" id="cat-tabs"></div>
      </div>
      <div class="subcat-bar" id="subcat-bar"></div>
      <div class="mat-grid" id="mat-grid"></div>
    </div>
  </section>
</main>

<!-- 右：预览抽屉 -->
<div class="drawer-backdrop" id="drawer-backdrop"></div>
<aside class="preview-drawer" id="preview-drawer" aria-hidden="true" aria-label="素材预览">
  <button class="drawer-close" id="drawer-close" aria-label="关闭预览">×</button>
  <div class="drawer-head"><span id="drawer-title">预览</span></div>
  <div class="drawer-media" id="drawer-media"></div>
  <div class="drawer-info" id="drawer-info"></div>
</aside>

<script src="/static/app.js"></script>
</body>
</html>
